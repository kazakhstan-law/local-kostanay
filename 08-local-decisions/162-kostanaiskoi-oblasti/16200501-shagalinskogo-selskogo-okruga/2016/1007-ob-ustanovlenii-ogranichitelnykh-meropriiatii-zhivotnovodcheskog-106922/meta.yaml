act_code: '106922'
requisite: Решение акима села Первомайское Аулиекольского района Костанайской области от 7 октября 2016 года № 2. Зарегистрировано Департаментом юстиции Костанайской области 19 октября 2016 года № 6656. Утратило силу решением акима села Первомайское Аулиекольского района Костанайской области от 11 апреля 2017 года № 2
title:
  rus: Об установлении ограничительных мероприятий животноводческого комплекса товарищества с ограниченной ответственностью "Ауле-Би", товарищества с ограниченной ответственностью "Ауле-Би 1" на территории села Первомайское Аулиекольского района Костанайской области
  kaz: Қостанай облысы Әулиекөл ауданы Первомай ауылының аумағында "Ауле-Би" жауапкершілігі шектеулі серіктестігі, "Ауле-Би 1" жауапкершілігі шектеулі серіктестіктерінің мал шаруашылығы кешені аумағында шектеу іс-шараларын белгілеу туралы
