requisite: Решение маслихата Карабалыкского района Костанайской области от 21 февраля 2014 года № 207. Зарегистрировано Департаментом юстиции Костанайской области 13 марта 2014 года № 4490. Утратило силу решением маслихата Карабалыкского района Костанайской области от 18 января 2016 года № 438
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок гражданских служащих социального обеспечения, образования, культуры, спорта и ветеринарии, работающих в сельской местности
  kaz: Ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласының азаматтық қызметшілеріне жиырма бес процентке жоғары лауазымдық жалақылар мен тарифтік ставкаларын белгілеу туралы
