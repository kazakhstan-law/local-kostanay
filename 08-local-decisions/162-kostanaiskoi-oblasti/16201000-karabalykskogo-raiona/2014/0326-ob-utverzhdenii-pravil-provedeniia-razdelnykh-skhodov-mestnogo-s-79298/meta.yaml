requisite: Решение маслихата Карабалыкского района Костанайской области от 26 марта 2014 года № 214. Зарегистрировано Департаментом юстиции Костанайской области 24 апреля 2014 года № 4649. Утратило силу решением маслихата Карабалыкского района Костанайской области от 28 мая 2020 года № 502 (вводится в действие по истечении десяти календарных дней после дня его  первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Побединского сельского округа Карабалыкского района Костанайской области
  kaz: Қостанай облысы Қарабалық ауданы Победа ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидасын және жергілікті қоғамдастықтың жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
