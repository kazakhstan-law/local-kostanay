requisite: Решение маслихата Карабалыкского района Костанайской области от 29 апреля 2014 года № 231. Зарегистрировано Департаментом юстиции Костанайской области 27 мая 2014 года № 4760. Утратило силу решением маслихата Карабалыкского района Костанайской области от 7 июня 2019 года № 411 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Есенкольского сельского округа Карабалыкского района Костанайской области
  kaz: Қостанай облысы Қарабалық ауданы Есенкөл ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидасын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
