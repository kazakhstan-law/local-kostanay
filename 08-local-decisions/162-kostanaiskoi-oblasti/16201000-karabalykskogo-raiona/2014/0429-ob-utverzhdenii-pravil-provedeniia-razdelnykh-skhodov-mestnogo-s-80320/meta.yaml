requisite: Решение маслихата Карабалыкского района Костанайской области от 29 апреля 2014 года № 232. Зарегистрировано Департаментом юстиции Костанайской области 27 мая 2014 года № 4761. Утратило силу решением маслихата Карабалыкского района Костанайской области от 30 октября 2020 года № 540 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Карабалыкского сельского округа Карабалыкского района Костанайской области
  kaz: Қостанай облысы Қарабалық ауданы Қарабалық ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидасын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
