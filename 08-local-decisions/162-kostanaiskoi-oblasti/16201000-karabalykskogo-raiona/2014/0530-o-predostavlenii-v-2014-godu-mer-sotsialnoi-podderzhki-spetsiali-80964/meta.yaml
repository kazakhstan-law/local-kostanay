requisite: Решение маслихата Карабалыкского района Костанайской области от 30 мая 2014 года № 250. Зарегистрировано Департаментом юстиции Костанайской области 24 июня 2014 года № 4877
title:
  rus: О предоставлении в 2014 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты
  kaz: Ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын 2014 жылы ұсыну туралы
