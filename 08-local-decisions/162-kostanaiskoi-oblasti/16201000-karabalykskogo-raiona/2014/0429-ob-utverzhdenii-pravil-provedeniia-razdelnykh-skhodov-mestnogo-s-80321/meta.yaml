requisite: Решение маслихата Карабалыкского района Костанайской области от 29 апреля 2014 года № 233. Зарегистрировано Департаментом юстиции Костанайской области 27 мая 2014 года № 4762. Утратило силу решением маслихата Карабалыкского района Костанайской области от 4 августа 2020 года № 519 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Кустанайского сельского округа Карабалыкского района Костанайской области
  kaz: Қостанай облысы Қарабалық ауданы Қостанай ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидасын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
