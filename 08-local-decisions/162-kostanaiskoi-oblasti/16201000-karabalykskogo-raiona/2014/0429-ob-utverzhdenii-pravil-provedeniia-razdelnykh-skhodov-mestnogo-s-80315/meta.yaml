  title:
    rus: О внесении изменения в решение маслихата от 29 апреля 2014 года № 230 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Бурлинского сельского округа Карабалыкского района Костанайской области»
    kaz: Мәслихаттың 2014 жылғы 29 сәуірдегі № 230 «Қостанай облысы Қарабалық ауданы Бөрлі ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидасын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгеріс енгізу туралы
