requisite: Решение маслихата Карабалыкского района Костанайской области от 5 мая 2016 года № 24. Зарегистрировано Департаментом юстиции Костанайской области 27 мая 2016 года № 6401
title:
  rus: О предоставлении в 2016 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района
  kaz: Ауданның ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2016 жылғы әлеуметтік қолдау шараларын көрсету туралы
