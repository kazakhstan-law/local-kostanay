act_code: '131017'
requisite: Решение маслихата Карабалыкского района Костанайской области от 26 апреля 2019 года № 382. Зарегистрировано Департаментом юстиции Костанайской области 30 апреля 2019 года № 8381
title:
  rus: О предоставлении в 2019 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Карабалыкского района
  kaz: 2019 жылы Қарабалық ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын көрсету туралы
