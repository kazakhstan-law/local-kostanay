requisite: Решение маслихата Карабалыкского района Костанайской области от 7 июня 2019 года № 411. Зарегистрировано Департаментом юстиции Костанайской области 13 июня 2019 года № 8527. Утратило силу решением маслихата Карабалыкского района Костанайской области от 13 ноября 2023 года № 60 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села для участия в сходе местного сообщества села Лесное Карабалыкского района Костанайской области
