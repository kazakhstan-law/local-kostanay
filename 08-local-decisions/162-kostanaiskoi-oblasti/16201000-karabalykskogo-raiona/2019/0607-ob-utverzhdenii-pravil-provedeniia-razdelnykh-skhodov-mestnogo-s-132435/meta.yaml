  title:
    rus: О внесении изменений в решение Карабалыкского районного маслихата Костанайской области от 07 июня 2019 года № 411 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества села Лесное Карабалыкского района Костанайской области»
    kaz: Қостанай облысы Қарабалық аудандық мәслихатының 2019 жылғы 07 маусымдағы «Қостанай облысы Қарабалық ауданы Лесное ауылының жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы» № 411 шешіміне өзгерістер енгізу туралы
