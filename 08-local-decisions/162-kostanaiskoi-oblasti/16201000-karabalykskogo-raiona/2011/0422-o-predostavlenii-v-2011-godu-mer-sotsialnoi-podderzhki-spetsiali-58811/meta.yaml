act_code: '58811'
requisite: Решение маслихата Карабалыкского района Костанайской области от 22 апреля 2011 года № 355. Зарегистрировано Управлением юстиции Карабалыкского района Костанайской области 12 мая 2011 года № 9-12-158. Утратило силу в связи с истечением срока применения (письмо маслихата Карабалыкского района Костанайской области от 2 мая 2013 года № 2-20/61)
title:
  rus: О предоставлении в 2011 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты района
  kaz: Ауданның ауылдық елді мекендерге жұмыс істеу және тұру үшін келген  денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына әлеуметтік қолдау шараларын 2011 жылы ұсыну туралы
