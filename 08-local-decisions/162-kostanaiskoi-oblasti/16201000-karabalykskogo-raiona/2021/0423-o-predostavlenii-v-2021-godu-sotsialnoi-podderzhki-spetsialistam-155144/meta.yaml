act_code: '155144'
requisite: Решение маслихата Карабалыкского района Костанайской области от 23 апреля 2021 года № 27. Зарегистрировано Департаментом юстиции Костанайской области 23 апреля 2021 года № 9880
title:
  rus: О предоставлении в 2021 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселка и сельских округов прибывшим для работы и проживания в сельские населенные пункты Карабалыкского района
  kaz: Қарабалық ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кент және ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2021 жылы әлеуметтік қолдау көрсету туралы
