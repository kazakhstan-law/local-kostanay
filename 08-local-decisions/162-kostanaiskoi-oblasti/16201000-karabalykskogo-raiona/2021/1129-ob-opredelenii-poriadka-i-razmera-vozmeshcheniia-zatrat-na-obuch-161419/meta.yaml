  title:
    rus: О внесении изменений в решение маслихата от 29 ноября 2021 года № 69 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Карабалыкском районе»
    kaz: Мәслихаттың 29 қарашадағы № 69 «Мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
