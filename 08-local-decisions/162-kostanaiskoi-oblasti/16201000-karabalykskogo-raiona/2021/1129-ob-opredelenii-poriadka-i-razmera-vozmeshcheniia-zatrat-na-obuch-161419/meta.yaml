requisite: Решение маслихата Карабалыкского района Костанайской области от 29 ноября 2021 года № 69. Зарегистрировано в Министерстве юстиции Республики Казахстан 9 декабря 2021 года № 25665
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Карабалыкском районе
  kaz: Қарабалық ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы
