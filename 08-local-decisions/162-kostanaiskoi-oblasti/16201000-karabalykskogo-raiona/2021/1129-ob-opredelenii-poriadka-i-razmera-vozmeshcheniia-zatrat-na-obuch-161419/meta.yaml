    kaz: Мәслихаттың 2021 жылғы 29 қарашадағы № 69 «Мүгедектігі бар адамдар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
