requisite: Решение маслихата Карабалыкского района Костанайской области от 28 мая 2020 года № 502. Зарегистрировано Департаментом юстиции Костанайской области 29 мая 2020 года № 9229. Утратило силу решением маслихата Карабалыкского района Костанайской области от 13 ноября 2023 года № 60 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села для участия в сходе местного сообщества села Победа Карабалыкского района Костанайской области
