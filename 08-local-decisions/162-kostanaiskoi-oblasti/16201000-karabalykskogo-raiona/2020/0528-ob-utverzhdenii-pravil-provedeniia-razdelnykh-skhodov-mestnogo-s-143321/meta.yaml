  title:
    rus: О внесении изменений в решение Карабалыкского районного маслихата Костанайской области от 28 мая 2020 года № 502 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества села Победа Карабалыкского района Костанайской области»
    kaz: Қостанай облысы Қарабалық аудандық мәслихатының 2020 жылғы 28 мамырдағы «Қостанай облысы Қарабалық ауданы Победа ауылының жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы» № 502 шешіміне өзгерістер енгізу туралы
