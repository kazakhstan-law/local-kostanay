title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Кособинского сельского округа Карабалыкского района Костанайской области
  kaz: Қостанай облысы Қарабалық ауданы Қособа ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын қатысу үшін тұрғындар өкілдерінің сандық құрамын бекіту туралы
