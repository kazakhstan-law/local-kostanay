  title:
    rus: О внесении изменений в решение Карабалыкского районного маслихата Костанайской области от 30 октября 2020 года № 540 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Кособинского сельского округа Карабалыкского района Костанайской области»
    kaz: Қостанай облысы Қарабалық аудандық мәслихатының 2020 жылғы 30 қазандағы «Қостанай облысы Қарабалық ауданы Қособа ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы» № 540 шешіміне өзгерістер енгізу туралы
