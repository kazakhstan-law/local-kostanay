requisite: Решение маслихата Карабалыкского района Костанайской области от 10 марта 2020 года № 478. Зарегистрировано Департаментом юстиции Костанайской области 3 апреля 2020 года № 9080
title:
  rus: О предоставлении в 2020 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Карабалыкского района
  kaz: 2020 жылы Қарабалық ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау көрсету туралы
