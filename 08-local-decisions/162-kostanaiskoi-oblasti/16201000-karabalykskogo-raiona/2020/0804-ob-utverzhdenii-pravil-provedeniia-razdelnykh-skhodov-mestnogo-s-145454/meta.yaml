requisite: Решение маслихата Карабалыкского района Костанайской области от 4 августа 2020 года № 519. Зарегистрировано Департаментом юстиции Костанайской области 12 августа 2020 года № 9367. Утратило силу решением маслихата Карабалыкского района Костанайской области от 13 ноября 2023 года № 60 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Тогузакского сельского округа Карабалыкского района Костанайской области
  kaz: Қостанай облысы Қарабалық ауданы Тоғызақ ауылының жергілікті қоғамдастықтың бөлек жиындарын қатысу үшін тұрғындар өкілдерінің сандық құрамын бекіту туралы
