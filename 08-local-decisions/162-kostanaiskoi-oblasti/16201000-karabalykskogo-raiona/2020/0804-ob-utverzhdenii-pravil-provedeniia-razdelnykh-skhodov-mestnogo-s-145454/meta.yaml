  title:
    rus: О внесении изменений в решение Карабалыкского районного маслихата Костанайской области от 04 августа 2020 года № 519 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Тогузакского сельского округа Карабалыкского района Костанайской области»
    kaz: Қостанай облысы Қарабалық аудандық мәслихатының 2020 жылғы 04 тамыздағы «Қостанай облысы Қарабалық ауданы Тоғызақ ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы» № 519 шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/168249/rus
