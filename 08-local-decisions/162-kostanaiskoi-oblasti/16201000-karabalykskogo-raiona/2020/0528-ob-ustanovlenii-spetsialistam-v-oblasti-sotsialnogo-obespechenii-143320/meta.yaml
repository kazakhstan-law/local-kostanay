act_code: '143320'
requisite: Решение маслихата Карабалыкского района Костанайской области от 28 мая 2020 года № 503. Зарегистрировано Департаментом юстиции Костанайской области 29 мая 2020 года № 9228
title:
  rus: Об установлении специалистам в области социального обеспечения, культуры и спорта, являющимся гражданскими служащими и работающим в сельской местности, повышенных на двадцать пять процентов должностных окладов и тарифных ставок по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях
  kaz: Әлеуметтік қамсыздандыру, мәдениет және спорт салаларындағы, ауылдық жерде жұмыс істейтін азаматтық қызметшілер болып табылатын мамандарға қалалық жерде осы қызмет түрлерімен айналысатын азаматтық қызметшілердің лауазымдық жалақылары мен тарифтік мөлшерлемелерімен салыстырғанда жиырма бес пайызға арттырылған лауазымдық жалақылар мен тарифтік мөлшерлемелерді белгілеу туралы
