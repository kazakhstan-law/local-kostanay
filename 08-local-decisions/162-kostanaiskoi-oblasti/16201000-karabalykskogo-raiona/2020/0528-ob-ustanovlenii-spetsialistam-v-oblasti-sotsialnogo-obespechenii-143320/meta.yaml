  title:
    rus: О внесении изменений в решение маслихата Карабалыкского района от 28 мая 2020 года № 503 «Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры и спорта, являющимся гражданскими служащими и работающим в сельской местности»
    kaz: Қарабалық ауданы мәслихатының 2020 жылғы 28 мамырдағы № 503 «Денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт салаларындағы азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін мамандарға лауазымдық жалақылары мен тарифтік мөлшерлемелерін жиырма бес пайызға арттырылған мөлшерде белгілеу туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/213886/rus
