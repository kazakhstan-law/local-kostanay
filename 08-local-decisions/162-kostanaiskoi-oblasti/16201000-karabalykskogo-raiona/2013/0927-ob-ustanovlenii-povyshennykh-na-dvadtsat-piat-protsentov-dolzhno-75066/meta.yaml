requisite: Решение маслихата Карабалыкского района Костанайской области от 27 сентября 2013 года № 163. Зарегистрировано Департаментом юстиции Костанайской области 29 октября 2013 года № 4278. Утратило силу решением маслихата Карабалыкского района Костанайской области от 21 февраля 2014 года № 207
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок гражданских служащих социального обеспечения, образования, культуры и спорта, работающих в сельской местности
  kaz: Ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласының азаматтық қызметшілеріне жиырма бес процентке жоғары лауазымдық жалақылар мен тарифтік ставкаларын белгілеу туралы
