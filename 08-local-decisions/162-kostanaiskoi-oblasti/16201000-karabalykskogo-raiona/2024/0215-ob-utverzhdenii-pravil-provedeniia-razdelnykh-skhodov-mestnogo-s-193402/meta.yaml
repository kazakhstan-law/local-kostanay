  title:
    rus: О внесении изменения в решение Карабалыкского районного маслихата Костанайской области от 15 февраля 2024 года № 90 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Кособинского сельского округа Карабалыкского района Костанайской области»
    kaz: Қостанай облысы Қарабалық аудандық мәслихатының 2024 жылғы 15 ақпандағы № 90 «Қостанай облысы Қарабалық ауданы Қособа ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгеріс енгізу туралы
