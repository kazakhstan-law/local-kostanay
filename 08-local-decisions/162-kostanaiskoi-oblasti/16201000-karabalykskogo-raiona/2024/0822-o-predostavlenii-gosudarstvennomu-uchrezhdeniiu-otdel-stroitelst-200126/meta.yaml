act_code: '200126'
requisite: Решение акима Тогузакского сельского округа Карабалыкского района Костанайской области от 22 августа 2024 года № 7
title:
  rus: 'О предоставлении государственному учреждению «Отдел строительства, архитектуры и градостроительства акимата Карабалыкского района» права ограниченного целевого землепользования (публичный сервитут) на земельный участок, расположенный по адресу: Тогузакский сельский округ, с. Гурьяновское для обслуживания и эксплуатации газопровода по объекту «Строительство АИТ на газовом топливе для объекта КГУ «Детский оздоровительный лагерь «Достык» отдела образования Карабалыкского района» Управления образования акимата Костанайской области»'
  kaz: «Қарабалық ауданы әкімдігінің құрылыс, сәулет және қала құрылысы бөлімі» мемлекеттік мекемесіне «Қостанай облысы әкімдігінің білім басқармасы» Қарабалық ауданының білім бөлімінің «Достық» балалар сауықтыру лагері «КММ объектісі ұшін» газ отынымен АИТ құрылысы» объектісі бойынша газ құбырына қызмет көрсету және пайдалану үшін Тоғызақ ауылдық округі, Гурьянов ауылы мекенжайы бойынша орналасқан жер учаскесіне шектеулі нысаналы (жария сервитут) жер пайдалану құқығын беру туралы
