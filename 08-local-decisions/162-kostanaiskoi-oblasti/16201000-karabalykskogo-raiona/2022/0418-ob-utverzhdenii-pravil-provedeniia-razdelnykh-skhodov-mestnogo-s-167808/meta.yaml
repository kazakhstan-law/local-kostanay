requisite: Решение маслихата Карабалыкского района Костанайской области от 18 апреля 2022 года № 119. Отменено решением маслихата Карабалыкского района Костанайской области от 15 сентября 2023 года № 50 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Белоглинского сельского округа Карабалыкского района Костанайской области
  kaz: Қостанай облысы Қарабалық ауданы Белоглин ауылдық округінің жергілікті қоғамдықтың бөлек жиындарын өткізу қағидасын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
