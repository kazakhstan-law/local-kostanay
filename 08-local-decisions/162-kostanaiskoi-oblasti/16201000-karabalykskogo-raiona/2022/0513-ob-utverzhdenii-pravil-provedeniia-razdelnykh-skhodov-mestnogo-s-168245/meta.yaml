requisite: Решение маслихата Карабалыкского района Костанайской области от 13 мая 2022 года № 131. Отменено решением маслихата Карабалыкского района Костанайской области от 15 сентября 2023 года № 50 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Новотроицкого сельского округа Карабалыкского района Костанайской области
  kaz: Қостанай облысы Қарабалық ауданы Новотроицк ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
