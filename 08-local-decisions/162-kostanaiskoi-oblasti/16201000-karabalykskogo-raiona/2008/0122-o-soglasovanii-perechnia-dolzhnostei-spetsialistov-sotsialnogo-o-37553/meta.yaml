act_code: '37553'
requisite: Решение маслихата Карабалыкского района Костанайской области от 22 января 2008 года № 42. Зарегистрировано Управлением юстиции Карабалыкского района Костанайской области 5 февраля 2008 года № 9-12-68
title:
  rus: О согласовании перечня должностей специалистов социального обеспечения, образования, культуры, работающих в аульной (сельской) местности, имеющих право на повышенные на двадцать пять процентов должностные оклады и тарифные ставки
  kaz: Лауазымдық төлемақыны және тарифтік ставканы жиырма бес пайызға арттырылған құқығы бар ауылдық (селолық) жерлерде жұмыс істейтін, әлеуметтік қамтамасыз ету, білім, мәдениет мамандарының лауазымдық тізбесінің келісімі туралы
