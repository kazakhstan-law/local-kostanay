requisite: Решение акима Челгашинского сельского округа Карасуского района Костанайской области от 17 ноября 2016 года № 1. Зарегистрировано Департаментом юстиции Костанайской области 25 ноября 2016 года № 6712. Утратило силу решением акима Челгашинского сельского округа Карасуского района Костанайской области от 13 апреля 2017 года № 1
