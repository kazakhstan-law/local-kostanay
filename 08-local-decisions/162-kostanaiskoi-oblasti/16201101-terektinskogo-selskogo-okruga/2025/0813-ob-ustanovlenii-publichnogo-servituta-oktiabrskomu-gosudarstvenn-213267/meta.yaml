act_code: '213267'
requisite: Решение акима Челгашинского сельского округа Карасуского района Костанайской области от 13 августа 2025 года № 8
title:
  rus: Об установлении публичного сервитута Октябрьскому государственному коммунальному предприятию «Суық Су» на праве хозяйственного ведения районного отдела жилищно-коммунального хозяйства, пассажирского транспорта, автомобильных дорог и жилищной инспекции акимата Карасуского района
  kaz: «Қарасу ауданы әкімдігінің аудандық тұрғын үй-коммуналдық шаруашылық, жолаушылар көлігі, автомобиль жолдары және тұрғын үй инспекциясы бөлімінің шаруашылық жүргізу құқығындағы Октябрьский «Суық Су» мемлекеттік коммуналдық кәсіпорынына қауымдық сервитут белгілеу туралы
