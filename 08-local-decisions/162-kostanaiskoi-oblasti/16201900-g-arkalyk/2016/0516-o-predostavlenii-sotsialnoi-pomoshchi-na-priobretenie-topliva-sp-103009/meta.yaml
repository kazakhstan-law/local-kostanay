act_code: '103009'
requisite: Решение маслихата города Аркалыка Костанайской области от 16 мая 2016 года № 23. Зарегистрировано Департаментом юстиции Костанайской области 1 июня 2016 года № 6414. Утратило силу решением маслихата города Аркалыка Костанайской области от 28 декабря 2018 года № 226 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах города Аркалыка
  kaz: Арқалық қаласының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
