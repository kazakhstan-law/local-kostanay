requisite: Решение маслихата города Аркалыка Костанайской области от 20 мая 2021 года № 34. Отменено решением маслихата города Аркалыка Костанайской области от 5 октября 2023 года № 48 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Молодежного сельского округа города Аркалыка Костанайской области
  kaz: Қостанай облысы Арқалық қаласы Молодежный ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
