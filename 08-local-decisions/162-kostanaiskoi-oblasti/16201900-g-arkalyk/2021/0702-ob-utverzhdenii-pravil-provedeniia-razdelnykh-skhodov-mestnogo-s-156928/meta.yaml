  title:
    rus: О внесении изменений в решение маслихата от 2 июля 2021 года № 44 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Родинского сельского округа города Аркалыка Костанайской области»
    kaz: Мәслихаттың 2021 жылғы 2 шілдедегі № 44 «Қостанай облысы Арқалық қаласының Родина ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиындарына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
