title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Родинского сельского округа города Аркалыка Костанайской области
  kaz: Қостанай облысы Арқалық қаласы Родина ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына  қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
