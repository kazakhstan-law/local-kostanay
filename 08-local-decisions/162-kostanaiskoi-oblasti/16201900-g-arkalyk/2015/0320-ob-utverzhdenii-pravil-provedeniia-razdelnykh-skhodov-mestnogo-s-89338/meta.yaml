act_code: '89338'
requisite: Решение маслихата города Аркалыка Костанайской области от 20 марта 2015 года № 234. Зарегистрировано Департаментом юстиции Костанайской области 28 апреля 2015 года № 5566. Утратило силу решением маслихата города Аркалыка Костанайской области от 27 февраля 2020 года № 304 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества села Родина города Аркалыка Костанайской области
  kaz: Қостанай облысы Арқалық қаласының Родина ауылында бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиындарына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
