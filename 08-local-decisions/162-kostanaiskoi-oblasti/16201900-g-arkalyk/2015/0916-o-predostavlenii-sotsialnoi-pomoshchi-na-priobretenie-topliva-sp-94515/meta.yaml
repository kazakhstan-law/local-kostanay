  kaz: 2015 жылға Арқалық қаласының ауылдық елдi мекендерінде тұратын және жұмыс істейтiн мемлекеттiк денсаулық сақтау, әлеуметтiк қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшiн әлеуметтік көмек беру туралы
