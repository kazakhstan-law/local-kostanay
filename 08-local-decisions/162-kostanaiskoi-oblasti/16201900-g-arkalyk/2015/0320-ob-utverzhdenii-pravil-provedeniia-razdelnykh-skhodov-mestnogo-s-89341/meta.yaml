  title:
    rus: О внесении изменений в решение маслихата от 20 марта 2015 года № 233 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества села Целинный города Аркалыка Костанайской области»
    kaz: Мәслихаттың 2015 жылғы 20 наурыздағы № 233 «Қостанай облысы Арқалық қаласының Целинный ауылында бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиындарына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
