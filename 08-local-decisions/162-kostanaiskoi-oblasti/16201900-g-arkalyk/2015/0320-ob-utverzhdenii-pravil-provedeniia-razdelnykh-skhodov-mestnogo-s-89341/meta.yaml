requisite: Решение маслихата города Аркалыка Костанайской области от 20 марта 2015 года № 233. Зарегистрировано Департаментом юстиции Костанайской области 28 апреля 2015 года № 5565. Утратило силу решением маслихата города Аркалыка Костанайской области от 21 июня 2022 года № 129 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества села Целинный города Аркалыка Костанайской области
  kaz: Қостанай облысы Арқалық қаласы Целинный ауылының жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
