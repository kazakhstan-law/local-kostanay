requisite: Решение маслихата города Аркалыка Костанайской области от 17 мая 2023 года № 30. Отменено решением маслихата города Аркалыка Костанайской области от 5 октября 2023 года № 48 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
