act_code: '78145'
requisite: Решение маслихата города Аркалыка Костанайской области от 19 февраля 2014 года № 154. Зарегистрировано Департаментом юстиции Костанайской области 17 марта 2014 года № 4503. Утратило силу решением маслихата города Аркалыка Костанайской области от 11 марта 2019 года № 239 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельских населенных пунктах
  kaz: Азаматтық қызметші болып табылатын және ауылдық елдi мекендерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт және ветеринария саласындағы мамандарға жиырма бес пайызға жоғары айлықақы мен тарифтік ставкалар белгілеу туралы
