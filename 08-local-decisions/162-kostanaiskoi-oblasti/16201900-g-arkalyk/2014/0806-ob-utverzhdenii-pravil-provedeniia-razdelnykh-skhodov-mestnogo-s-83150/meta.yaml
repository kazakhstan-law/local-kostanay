requisite: Решение маслихата города Аркалыка Костанайской области от 6 августа 2014 года № 195. Зарегистрировано Департаментом юстиции Костанайской области 16 сентября 2014 года № 5090. Утратило силу решением маслихата города Аркалыка Костанайской области от 27 февраля 2020 года № 304 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества села Молодежное города Аркалыка Костанайской области
  kaz: Қостанай облысы Арқалық қаласының Молодежный ауылында бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиындарына қатысатын ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
