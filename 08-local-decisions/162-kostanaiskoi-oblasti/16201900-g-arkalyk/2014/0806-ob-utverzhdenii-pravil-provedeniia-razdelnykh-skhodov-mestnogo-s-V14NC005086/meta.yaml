  title:
    rus: О внесении изменений в решение маслихата от 6 августа 2014 года № 191 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Каиндинского сельского округа города Аркалыка Костанайской области»
    kaz: Мәслихаттың 2014 жылғы 6 тамыздағы № 191 «Қостанай облысы Арқалық қаласының Қайыңды ауылында бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиындарына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
