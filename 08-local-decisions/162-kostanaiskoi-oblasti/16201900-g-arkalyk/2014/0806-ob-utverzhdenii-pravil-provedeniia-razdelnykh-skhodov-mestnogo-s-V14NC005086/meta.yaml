requisite: Решение маслихата города Аркалыка Костанайской области от 6 августа 2014 года № 191. Зарегистрировано Департаментом юстиции Костанайской области 16 сентября 2014 года № 5086. Утратило силу решением маслихата города Аркалыка Костанайской области от 21 июня 2022 года № 129 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Каиндинского сельского округа города Аркалыка Костанайской области
  kaz: Қостанай облысы Арқалық қаласы Қайыңды ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
