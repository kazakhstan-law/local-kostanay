  title:
    rus: О внесении изменений в решение маслихата от 6 августа 2014 года № 188 "Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества села Екидин города Аркалыка Костанайской области"
    kaz: Мәслихаттың 2014 жылғы 6 тамыздағы № 188 "Қостанай облысы Арқалық қаласының Екідің ауылында бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиындарына қатысатын ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы" шешіміне өзгерістер енгізу туралы
