requisite: Решение маслихата города Аркалыка Костанайской области от 6 августа 2014 года № 197. Зарегистрировано Департаментом юстиции Костанайской области 16 сентября 2014 года № 5091. Утратило силу решением маслихата города Аркалыка Костанайской области от 21 июня 2022 года № 129 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
