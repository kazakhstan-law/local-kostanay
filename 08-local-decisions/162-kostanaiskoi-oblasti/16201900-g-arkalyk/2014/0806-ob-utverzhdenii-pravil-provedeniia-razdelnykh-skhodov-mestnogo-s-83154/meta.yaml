title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества села Уштобе города Аркалыка Костанайской области
  kaz: Қостанай облысы Арқалық қаласы Үштөбе ауылының жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
