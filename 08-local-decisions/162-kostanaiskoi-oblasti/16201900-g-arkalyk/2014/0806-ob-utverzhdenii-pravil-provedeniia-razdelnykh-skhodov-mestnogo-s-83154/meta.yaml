    kaz: Мәслихаттың 2014 жылғы 6 тамыздағы № 197 "Қостанай облысы Арқалық қаласының Үштөбе ауылында бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиындарына қатысатын ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы" шешіміне өзгерістер енгізу туралы
