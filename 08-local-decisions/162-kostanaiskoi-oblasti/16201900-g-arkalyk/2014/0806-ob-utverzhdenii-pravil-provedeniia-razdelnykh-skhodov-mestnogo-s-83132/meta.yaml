title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества села Жалгызтал города Аркалыка Костанайской области
  kaz: Қостанай облысы Арқалық қаласы Жалғызтал ауылының жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
