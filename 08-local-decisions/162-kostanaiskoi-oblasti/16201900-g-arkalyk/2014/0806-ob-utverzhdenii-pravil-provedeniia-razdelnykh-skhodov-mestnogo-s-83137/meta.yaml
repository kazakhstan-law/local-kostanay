  title:
    rus: О внесении изменений в решение маслихата от 6 августа 2014 года № 185 "Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества села Ангарское города Аркалыка Костанайской области"
    kaz: Мәслихаттың 2014 жылғы 6 тамыздағы № 185 "Қостанай облысы Арқалық қаласының Аңғар ауылында бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиындарына қатысатын ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы" шешіміне өзгерістер енгізу туралы
