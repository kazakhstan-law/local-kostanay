    kaz: Мәслихаттың 2014 жылғы 6 тамыздағы № 185 «Қостанай облысы Арқалық қаласының Аңғар ауылында бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиындарына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
