act_code: '142734'
requisite: Решение маслихата города Аркалыка Костанайской области от 4 мая 2020 года № 312. Зарегистрировано Департаментом юстиции Костанайской области 13 мая 2020 года № 9173. Утратило силу решением маслихата города Аркалыка Костанайской области от 23 февраля 2021 года № 15 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры и спорта, являющимся гражданскими служащими и работающим в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк мөлшерлемелерді белгілеу туралы
