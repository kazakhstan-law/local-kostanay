act_code: '146385'
requisite: Решение маслихата города Аркалыка Костанайской области от 15 сентября 2020 года № 341. Зарегистрировано Департаментом юстиции Костанайской области 17 сентября 2020 года № 9452
title:
  rus: О предоставлении в 2020 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты
  kaz: Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2020 жылы әлеуметтік қолдау көрсету туралы
