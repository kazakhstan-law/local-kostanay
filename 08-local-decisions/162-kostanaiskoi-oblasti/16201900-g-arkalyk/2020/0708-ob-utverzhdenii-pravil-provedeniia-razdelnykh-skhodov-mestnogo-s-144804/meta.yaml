    kaz: Мәслихаттың 2020 жылғы 8 шілдедегі № 326 «Қостанай облысы Арқалық қаласының Ашутасты ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
