  title:
    rus: О внесении изменений в решение маслихата от 22 декабря 2022 года № 181 «О предоставлении в 2023 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты»
    kaz: Мәслихаттың 2022 жылғы 22 желтоқсандағы № 181 «Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2023 жылы әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
