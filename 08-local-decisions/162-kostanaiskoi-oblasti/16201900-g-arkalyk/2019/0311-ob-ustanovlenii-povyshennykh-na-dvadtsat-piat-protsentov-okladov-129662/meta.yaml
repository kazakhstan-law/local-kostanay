act_code: '129662'
requisite: Решение маслихата города Аркалыка Костанайской области от 11 марта 2019 года № 239. Зарегистрировано Департаментом юстиции Костанайской области 15 марта 2019 года № 8302. Утратило силу решением маслихата города Аркалыка Костанайской области от 4 мая 2020 года № 312 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельских населенных пунктах
  kaz: Азаматтық қызметші болып табылатын және ауылдық елдi мекендерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт және ветеринария саласындағы мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтiк мөлшерлемелерді белгiлеу туралы
