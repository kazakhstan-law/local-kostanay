  title:
    rus: О внесении изменений в решение маслихата от 27 ноября 2014 года № 256 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества села Кожа Наурзумского района Костанайской области»
    kaz: Мәслихаттың 2014 жылғы 27 қарашадағы № 256 «Қостанай облысы Науырзым ауданы Қожа ауылының бөлек жергілікті қоғамдастық жиындарын өткізу қағидасын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
