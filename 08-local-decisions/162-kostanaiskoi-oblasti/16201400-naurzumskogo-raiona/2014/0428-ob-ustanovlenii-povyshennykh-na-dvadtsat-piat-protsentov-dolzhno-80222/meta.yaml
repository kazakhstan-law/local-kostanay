requisite: Решение маслихата Наурзумского района Костанайской области от 28 апреля 2014 года № 220. Зарегистрировано Департаментом юстиции Костанайской области 23 мая 2014 года № 4748. Утратило силу решением маслихата Наурзумского района Костанайской области от 6 августа 2015 года № 320
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности, за счет средств районного бюджета
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және ветеринария саласындағы мамандарға аудандық бюджет қаражаты есебінен жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік ставкаларды белгілеу туралы
