requisite: Решение маслихата Наурзумского района Костанайской области от 27 ноября 2014 года № 253. Зарегистрировано департаментюм юстиции Костанайской области 25 декабря 2014 года № 5251. Утратило силу решением маслихата Наурзумского района Костанайской области от 27 ноября 2017 года № 132
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Буревестнинского сельского округа Наурзумского района Костанайской области
  kaz: Қостанай облысы Науырзым ауданы Буревестник ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидасын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
