requisite: Решение маслихата Наурзумского района Костанайской области от 6 августа 2015 года № 320. Зарегистрировано Департаментом юстиции Костанайской области 27 августа 2015 года № 5844. Утратило силу решением маслихата Наурзумского района Костанайской области от 18 января 2016 года № 366
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік ставкаларды айқындау туралы
