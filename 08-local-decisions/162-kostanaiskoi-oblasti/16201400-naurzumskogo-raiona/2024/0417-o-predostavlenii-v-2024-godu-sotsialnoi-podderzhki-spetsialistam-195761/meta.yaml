act_code: '195761'
requisite: Решение маслихата Наурзумского района Костанайской области от 17 апреля 2024 года № 103
title:
  rus: О предоставлении в 2024 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Наурзумского района
  kaz: Науырзым ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсызданыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2024 жылға әлеуметтік қолдау көрсету туралы
