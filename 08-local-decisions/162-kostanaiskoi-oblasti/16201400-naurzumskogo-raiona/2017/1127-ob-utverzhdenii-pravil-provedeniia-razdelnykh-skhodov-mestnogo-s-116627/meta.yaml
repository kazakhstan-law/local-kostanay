  title:
    rus: О внесении изменений в решение маслихата от 27 ноября 2017 года № 132 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села для участия в сходе местного сообщества села Буревестник Наурзумского района Костанайской области»
    kaz: Мәслихаттың 2017 жылғы 27 қарашадағы № 132 «Қостанай облысы Науырзым ауданы Буревестник ауылының бөлек жергілікті қоғамдастық жиындарын өткізу қағидасын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
