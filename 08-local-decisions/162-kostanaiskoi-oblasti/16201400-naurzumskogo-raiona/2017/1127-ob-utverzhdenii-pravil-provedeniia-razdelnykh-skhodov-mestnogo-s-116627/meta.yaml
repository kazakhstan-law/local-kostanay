requisite: Решение маслихата Наурзумского района Костанайской области от 27 ноября 2017 года № 132. Зарегистрировано Департаментом юстиции Костанайской области 11 декабря 2017 года № 7360. Утратило силу решением маслихата Наурзумского района Костанайской области от 23 ноября 2023 года № 56 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
