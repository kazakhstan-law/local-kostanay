act_code: '147101'
requisite: Решение маслихата Наурзумского района Костанайской области от 30 сентября 2020 года № 390. Зарегистрировано Департаментом юстиции Костанайской области 6 октября 2020 года № 9483
title:
  rus: О предоставлении в 2020 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов прибывшим для работы и проживания в сельские населенные пункты Наурзумского района
  kaz: Науырзым ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2020 жылға әлеуметтік қолдау көрсету туралы
