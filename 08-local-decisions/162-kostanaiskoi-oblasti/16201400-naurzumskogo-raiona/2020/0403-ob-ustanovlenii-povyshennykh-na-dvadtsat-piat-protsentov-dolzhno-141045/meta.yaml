requisite: Решение маслихата Наурзумского района Костанайской области от 3 апреля 2020 года № 347. Зарегистрировано Департаментом юстиции Костанайской области 3 апреля 2020 года № 9079. Утратило силу решением маслихата Наурзумского района Костанайской области от 3 февраля 2021 года № 12 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры и спорта, являющимся гражданскими служащими и работающим в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерді белгілеу туралы
