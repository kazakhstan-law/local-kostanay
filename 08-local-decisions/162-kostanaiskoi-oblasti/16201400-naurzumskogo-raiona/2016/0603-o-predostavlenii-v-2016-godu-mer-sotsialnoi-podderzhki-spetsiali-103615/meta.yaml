requisite: Решение маслихата Наурзумского района Костанайской области от 3 июня 2016 года № 31. Зарегистрировано Департаментом юстиции Костанайской области 21 июня 2016 года № 6482
title:
  rus: О предоставлении в 2016 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты
  kaz: Ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2016 жылы әлеуметтік қолдау шараларын көрсету туралы
