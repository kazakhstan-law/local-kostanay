act_code: '121446'
requisite: Решение маслихата Наурзумского района Костанайской области от 24 апреля 2018 года № 184. Зарегистрировано Департаментом юстиции Костанайской области 4 мая 2018 года № 7734
title:
  rus: О предоставлении в 2018 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Наурзумского района
  kaz: Науырзым ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылы әлеуметтік қолдау шараларын көрсету туралы
