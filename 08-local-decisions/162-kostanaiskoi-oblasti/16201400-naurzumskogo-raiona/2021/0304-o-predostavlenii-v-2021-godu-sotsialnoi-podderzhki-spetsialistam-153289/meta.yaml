act_code: '153289'
requisite: Решение маслихата Наурзумского района Костанайской области от 4 марта 2021 года № 17. Зарегистрировано Департаментом юстиции Костанайской области 9 марта 2021 года № 9803
title:
  rus: О предоставлении в 2021 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Наурзумского района
  kaz: Науырзым ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2021 жылға әлеуметтік қолдау көрсету туралы
