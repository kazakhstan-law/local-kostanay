  requisite: Решение маслихата Наурзумского района Костанайской области от 26 ноября 2025 года № 249
  title:
    rus: О внесении изменений в решение Наурзумского районного маслихата от 3 февраля 2021 года № 12 «Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения и культуры, являющимся гражданскими служащими и работающим в сельской местности»
    kaz: Науырзым аудандық мәслихатының 2021 жылғы 03 ақпандағы № 12 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру және мәдениет саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерді белгілеу туралы» шешіміне өзгерістер енгізу туралы
