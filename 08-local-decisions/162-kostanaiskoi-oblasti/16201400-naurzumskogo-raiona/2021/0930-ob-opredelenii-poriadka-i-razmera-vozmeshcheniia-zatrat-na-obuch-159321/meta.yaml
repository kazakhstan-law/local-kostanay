  title:
    rus: О внесении изменений в решение маслихата от 30 сентября 2021 года № 63 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Наурзумском районе»
    kaz: Мәслихаттың 2021 жылғы 30 қыркүйектегі № 63 «Науырзым ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
