act_code: '131040'
requisite: Решение маслихата Наурзумского района Костанайской области от 30 апреля 2019 года № 280. Зарегистрировано Департаментом юстиции Костанайской области 2 мая 2019 года № 8393
title:
  rus: О предоставлении в 2019 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Наурзумского района
  kaz: Науырзым ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылы әлеуметтік қолдау шараларын көрсету туралы
