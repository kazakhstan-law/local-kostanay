title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей микрорайонов, улиц для участия в сходе местного сообщества поселка Качар города Рудный Костанайской области
  kaz: Қостанай облысы Рудный қаласының Қашар кентінің жергілікті қоғамдастығының бөлек жиындарын өткізудің және жергілікті қоғамдастық жиынына қатысу үшін шағынаудандар, көшелер тұрғындары өкілдерінің санын айқындаудың тәртібін бекіту туралы
