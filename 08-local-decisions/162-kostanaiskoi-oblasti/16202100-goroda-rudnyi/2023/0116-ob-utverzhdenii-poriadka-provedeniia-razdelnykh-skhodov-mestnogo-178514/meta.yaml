requisite: Решение маслихата города Рудного Костанайской области от 16 января 2023 года № 187. Отменено решением маслихата города Рудного Костанайской области от 31 декабря 2024 года № 193 (вводится в действие со дня официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей микрорайонов, улиц для участия в сходе местного сообщества поселка Качар города Рудный Костанайской области
  kaz: Қостанай облысы Рудный қаласының Қашар кентінің жергілікті қоғамдастығының бөлек жиындарын өткізудің және жергілікті қоғамдастық жиынына қатысу үшін шағын аудандар, көшелер тұрғындары өкілдерінің санын айқындаудың тәртібін бекіту туралы
