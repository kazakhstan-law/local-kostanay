  title:
    rus: О внесении изменений в решение маслихата от 10 сентября 2021 года № 65 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в городе Рудном»
    kaz: Мәслихаттың 2021 жылғы 10 қыркүйектегі № 65 «Рудный қаласында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
