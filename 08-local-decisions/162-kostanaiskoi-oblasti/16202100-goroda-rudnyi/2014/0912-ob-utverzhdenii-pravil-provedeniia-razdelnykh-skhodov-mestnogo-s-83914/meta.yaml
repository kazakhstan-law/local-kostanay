  title:
    rus: О внесении изменения в решение маслихата от 12 сентября 2014 года № 319 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей для участия в сходе местного сообщества поселка Качар города Рудного Костанайской области»
    kaz: Мәслихаттың 2014 жылғы 12 қыркүйектегі № 319 «Қостанай облысы Рудный қаласының Қашар кентінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін тұрғындар өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгеріс енгізу туралы
