title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей для участия в сходе местного сообщества поселка Качар города Рудного Костанайской области
  kaz: Қостанай облысы Рудный қаласының Қашар кентінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін тұрғындар өкілдерінің сандық құрамын бекіту туралы
