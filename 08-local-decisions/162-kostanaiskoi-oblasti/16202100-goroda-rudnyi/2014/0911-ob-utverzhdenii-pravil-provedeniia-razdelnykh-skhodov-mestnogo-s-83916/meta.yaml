    kaz: Мәслихаттың 2014 жылғы 12 қыркүйектегі № 320 «Қостанай облысы Рудный қаласының Горняцк кентінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін тұрғындар өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
