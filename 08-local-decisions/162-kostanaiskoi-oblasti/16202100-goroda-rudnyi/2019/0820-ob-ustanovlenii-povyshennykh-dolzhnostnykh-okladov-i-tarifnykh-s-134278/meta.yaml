act_code: '134278'
requisite: Решение маслихата города Рудного Костанайской области от 20 августа 2019 года № 399. Зарегистрировано Департаментом юстиции Костанайской области 23 августа 2019 года № 8636. Утратило силу решением маслихата города Рудного Костанайской области от 15 марта 2021 года № 22 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении повышенных должностных окладов и тарифных ставок специалистам в области здравоохранения, образования являющихся гражданскими служащими и работающим в селе Перцевка города Рудного
  kaz: Азаматтық қызметшілер болып табылатын және Рудный қаласының Перцев ауылында жұмыс істейтін денсаулық сақтау, білім беру саласындағы мамандарға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерді белгілеу туралы
