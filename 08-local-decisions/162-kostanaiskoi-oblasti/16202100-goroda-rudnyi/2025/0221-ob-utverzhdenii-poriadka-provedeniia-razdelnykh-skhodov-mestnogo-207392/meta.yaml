act_code: '207392'
requisite: Решение маслихата города Рудного Костанайской области от 21 февраля 2025 года № 201
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улиц для участия в сходе местного сообщества поселка Горняцкий города Рудный Костанайской области
  kaz: Қостанай облысы Рудный қаласының Горняцк кентінің жергілікті қоғамдастығының бөлек жиындарын өткізудің және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көшелер тұрғындары өкілдерінің санын айқындаудың тәртібін бекіту туралы
