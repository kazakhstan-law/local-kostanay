act_code: '31592'
requisite: Қостанай облысы Рудный қаласы мәслихатының 2007 жылғы 15 қаңтардағы № 402 шешімі. Қостанай облысы Рудный қаласы Әділет басқармасында 2007 жылғы 29 қаңтарда № 9-2-71 болып тіркелді. Шешімнің қолданылу мерзімі 2008 жылдың 1 қаңтарына дейін
title:
