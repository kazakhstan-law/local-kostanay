requisite: Решение маслихата Амангельдинского района Костанайской области от 25 декабря 2025 года № 190
title:
  rus: О предоставлении в 2026 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов села, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Амангельдинского района
  kaz: Амангелді ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауыл, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2026 жылы әлеуметтік қолдау көрсету туралы
