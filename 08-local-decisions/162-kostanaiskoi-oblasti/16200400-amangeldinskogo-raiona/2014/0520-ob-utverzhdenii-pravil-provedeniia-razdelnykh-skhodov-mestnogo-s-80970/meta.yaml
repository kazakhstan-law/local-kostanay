requisite: Решение маслихата Амангельдинского района Костанайской области от 20 мая 2014 года № 250. Зарегистрировано Департаментом юстиции Костанайской области 30 июня 2014 года № 4884. Утратило силу решением маслихата Амангельдинского района Костанайской области от 22 мая 2020 года № 385 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества села Тасты Амангельдинского района Костанайской области
  kaz: Қостанай облысы Амангелді ауданының Тасты ауылында бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиындарына қатысатын ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
