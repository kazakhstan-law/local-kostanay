requisite: Решение маслихата Амангельдинского района Костанайской области от 20 мая 2014 года № 251. Зарегистрировано Департаментом юстиции Костанайской области 30 июня 2014 года № 4880. Утратило силу решением маслихата Амангельдинского района Костанайской области от 12 марта 2020 года № 368 (вводится в действие по истечении десяти  календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Карынсалдинского сельского округа Амангельдинского района Костанайской области
