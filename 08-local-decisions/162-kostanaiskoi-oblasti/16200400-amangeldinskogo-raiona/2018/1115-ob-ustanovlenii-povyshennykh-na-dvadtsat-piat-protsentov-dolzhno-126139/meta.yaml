act_code: '126139'
requisite: Решение маслихата Амангельдинского района Костанайской области от 15 ноября 2018 года № 252. Зарегистрировано Департаментом юстиции Костанайской области 16 ноября 2018 года № 8095. Утратило силу решением маслихата Амангельдинского района Костанайской области от 2 апреля 2021 года № 30 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении повышенных на двадцать  пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерді белгілеу туралы
