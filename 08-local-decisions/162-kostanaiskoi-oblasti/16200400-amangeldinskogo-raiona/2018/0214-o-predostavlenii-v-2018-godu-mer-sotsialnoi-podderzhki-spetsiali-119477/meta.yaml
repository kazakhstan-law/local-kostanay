act_code: '119477'
requisite: Решение маслихата Амангельдинского района Костанайской области от 14 февраля 2018 года № 190. Зарегистрировано Департаментом юстиции Костанайской области 7 марта 2018 года № 7587
title:
  rus: О предоставлении в 2018 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Амангельдинского района
  kaz: Амангелді ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылы әлеуметтік қолдау шараларын көрсету туралы
