requisite: Решение маслихата Амангельдинского района Костанайской области от 28 апреля 2018 года № 208. Зарегистрировано Департаментом юстиции Костанайской области 23 мая 2018 года № 7782. Утратило силу решением маслихата Амангельдинского района Костанайской области от 30 декабря 2019 года № 336 (вводится в действие для сельского округа с численностью населения более двух тысяч человек с 1 января 2018 года и для села, сельских округов с численностью населения две тысячи и менее человек с 1 января 2020 года)
