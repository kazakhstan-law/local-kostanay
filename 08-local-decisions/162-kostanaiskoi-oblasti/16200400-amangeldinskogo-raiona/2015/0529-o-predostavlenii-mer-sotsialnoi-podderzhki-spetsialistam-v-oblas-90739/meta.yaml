act_code: '90739'
requisite: Решение от 29.05.2015 №325, Маслихат Амангельдинского района
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района на 2015 год
  kaz: Ауданның ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2015 жылға әлеуметтік қолдау шараларын ұсыну туралы
