requisite: Решение маслихата Амангельдинского района Костанайской области от 22 мая 2020 года № 385. Зарегистрировано Департаментом юстиции Костанайской области 29 мая 2020 года № 9227. Утратило силу решением маслихата Амангельдинского района Костанайской области от 2 августа 2023 года № 31 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Тастинского сельского округа Амангельдинского района Костанайской области
  kaz: Қостанай облысы Амангелді ауданы Тасты ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
