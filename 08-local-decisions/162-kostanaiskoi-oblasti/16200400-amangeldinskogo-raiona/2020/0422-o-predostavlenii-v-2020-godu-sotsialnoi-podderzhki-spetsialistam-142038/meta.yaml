act_code: '142038'
requisite: Решение маслихата Амангельдинского района Костанайской области от 22 апреля 2020 года № 377. Зарегистрировано Департаментом юстиции Костанайской области 22 апреля 2020 года № 9149. Утратило силу решением маслихата Амангельдинского района Костанайской области от 14 декабря 2020 года № 416 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении в 2020 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Амангельдинского района
  kaz: Амангелді ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы әлеуметтік қолдау көрсету туралы
