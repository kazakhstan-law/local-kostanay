requisite: Қостанай облысы Аманкелді ауданы мәслихатының 2009 жылғы 21 сәуірдегі № 109 шешімі. Қостанай облысы Аманкелді ауданының Әділет басқармасында 2009 жылы 18 мамырда № 9-6-94 тіркелді. Күші жойылды - Қостанай облысы Аманкелді ауданы мәслихатының 2012 жылғы 20 желтоқсандағы № 97 шешімімен
title:
