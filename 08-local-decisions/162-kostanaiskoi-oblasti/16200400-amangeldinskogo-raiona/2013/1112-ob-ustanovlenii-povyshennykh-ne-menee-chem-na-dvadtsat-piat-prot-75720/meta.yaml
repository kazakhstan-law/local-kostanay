requisite: Решение маслихата Амангельдинского района Костанайской области от 12 ноября 2013 года № 176. Зарегистрировано Департаментом юстиции Костанайской области 5 декабря 2013 года № 4331. Утратило силу - Решением маслихата Амангельдинского района Костанайской области от 28 марта 2014 года № 221
title:
  rus: Об установлении повышенных не менее чем на двадцать пять процентов должностных окладов и тарифных ставок гражданским служащим социального обеспечения, образования, культуры, работающим в сельской местности
  kaz: Ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет саласының азаматтық қызметшілеріне кемінде жиырма бес процентке жоғары лауазымдық жалақылар мен тарифтік ставкаларды белгілеу туралы
