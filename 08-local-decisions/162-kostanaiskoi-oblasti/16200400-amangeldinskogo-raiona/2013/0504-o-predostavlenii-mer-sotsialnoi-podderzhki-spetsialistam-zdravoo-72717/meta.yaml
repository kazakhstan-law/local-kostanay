act_code: '72717'
requisite: Решение маслихата Амангельдинского района Костанайской области от 4 мая 2013 года № 130. Зарегистрировано Департаментом юстиции Костанайской области 17 мая 2013 года № 4131. Утратило силу в связи с истечением срока действия (письмо маслихата Амангельдинского района Костанайской области от 27 января 2014 года № 8)
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты района на 2013 год
  kaz: Ауданның ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2013 жылға әлеуметтік қолдау шараларын ұсыну туралы
