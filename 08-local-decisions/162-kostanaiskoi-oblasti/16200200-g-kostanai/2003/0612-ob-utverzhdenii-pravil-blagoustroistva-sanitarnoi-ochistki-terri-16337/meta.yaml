  title:
    rus: О внесении изменений в решение Костанайского городского маслихата от 13 июня 2003 года № 254 "Об утверждении Правил благоустройства, санитарной очистки территории, содержания, защиты и сноса зеленых насаждений в городе Костанае и персонального состава комиссии по вопросам благоустройства в городе Костанае"
    kaz: '"Қостанай қаласындағы аумақты көріктендіру, санитарлық тазалау, жасыл желектерді күтіп ұстау, қорғау және шығарып тастау ережелері мен Қостанай қаласын көріктендіру мәселелері жөніндегі комиссияның дербес құрамын бекіту туралы" Қостанай қалалық мәслихатының 2003 жылғы 13 маусымдағы № 254 шешіміне өзгерістер енгізу туралы'
