title:
  rus: Об установлении «Коммунальному государственному предприятию «Затобольская теплоэнергетическая компания» акимата Костанайского района государственного учреждения «Отдел жилищно-коммунального хозяйства, пассажирского транспорта и автомобильных дорог» публичного сервитута на земельный участок
  kaz: «Тұрғын ұй-коммуналдық шаруашылық, жолаушылар көлігі және автомобиль жолдары бөлімі» мемлекеттік мекемесінің Қостанай ауданы әкімдігінің «Затобол жылу энергетикалық компаниясы» коммуналдық мемлекеттік кәсіпорны жер учаскесіне қауымдық сервитутты белгілеу туралы
