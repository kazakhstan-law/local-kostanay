requisite: Решение маслихата Федоровского района Костанайской области от 25 декабря 2007 года № 28. Зарегистрировано Управлением юстиции Федоровского района Костанайской области 28 января 2008 года № 9-20-65. Утратило силу решением маслихата Федоровского района Костанайской области от 16 апреля 2008 года № 57
title:
  rus: О согласовании перечня должностей специалистов социального обеспечения, образования, культуры, работающих в аульной (сельской) местности, имеющих право на повышенные на двадцать пять процентов должностные оклады и тарифные ставки
  kaz: Жиырма бес процентке жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар, ауылдық (селолық) мекендерде жұмыс істейтін әлеуметтік қамтамасыз ету, білім беру, мәдениет мамандары лауазымдарының тізбесін келістіру туралы
