requisite: Решение маслихата Федоровского района Костанайской области от 22 декабря 2016 года № 82. Зарегистрировано Департаментом юстиции Костанайской области 26 января 2017 года № 6813. Утратило силу решением маслихата Федоровского района Костанайской области от 14 сентября 2023 года № 53 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села для участия в сходе местного сообщества села Новошумное Федоровского района Костанайской области
  kaz: Қостанай облысы Федоров ауданы Новошумный ауылының жергілікті қоғамдастығының бөлек жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
