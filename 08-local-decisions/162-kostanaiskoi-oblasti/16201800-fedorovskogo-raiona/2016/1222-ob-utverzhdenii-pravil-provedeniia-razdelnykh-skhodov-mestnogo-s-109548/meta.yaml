  title:
    rus: О внесении изменений в решение маслихата от 22 декабря 2016 года № 82 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества села Новошумное Федоровского района Костанайской области»
    kaz: Мәслихаттың 2016 жылғы 22 желтоқсандағы № 82 «Қостанай облысы Федоров ауданы Новошумный ауылының бөлек жергілікті қоғамдастық жиындарын өткізу қағидасын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
