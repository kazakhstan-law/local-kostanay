  requisite: Решение маслихата Федоровского района Костанайской области от 26 ноября 2024 года № 148
  title:
    rus: О внесении изменения в решение маслихата от 7 февраля 2024 года № 99 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов села, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Федоровского района в 2024 году»
    kaz: Мәслихаттың 2024 жылғы 7 ақпандағы № 99 «Федоров ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауыл, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2024 жылы әлеуметтік қолдау шараларын көрсету туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/203231/rus
