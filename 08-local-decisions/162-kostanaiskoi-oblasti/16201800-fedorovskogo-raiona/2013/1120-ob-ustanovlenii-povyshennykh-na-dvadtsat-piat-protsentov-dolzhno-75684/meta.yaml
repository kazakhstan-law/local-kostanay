requisite: Решение маслихата Федоровского района Костанайской области от 20 ноября 2013 года № 171. Зарегистрировано Департаментом юстиции Костанайской области 5 декабря 2013 года № 4330. Утратило силу решением маслихата Федоровского района Костанайской области от 7 августа 2014 года № 257
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок гражданским служащим социального обеспечения, образования, культуры, работающим в сельской местности
