act_code: '147450'
requisite: Решение маслихата Федоровского района Костанайской области от 8 октября 2020 года № 469. Зарегистрировано Департаментом юстиции Костанайской области 15 октября 2020 года № 9493
title:
  rus: О предоставлении в 2020 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов села, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Федоровского района
  kaz: Федоров ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауыл, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2020 жылы әлеуметтік қолдау көрсету туралы
