act_code: '140179'
requisite: Решение маслихата Федоровского района Костанайской области от 10 марта 2020 года № 416. Зарегистрировано Департаментом юстиции Костанайской области 13 марта 2020 года № 9019. Утратило силу решением маслихата Федоровского района Костанайской области от 8 октября 2020 года № 469 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении в 2020 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Федоровского района
  kaz: Федоров ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы әлеуметтік қолдау көрсету туралы
