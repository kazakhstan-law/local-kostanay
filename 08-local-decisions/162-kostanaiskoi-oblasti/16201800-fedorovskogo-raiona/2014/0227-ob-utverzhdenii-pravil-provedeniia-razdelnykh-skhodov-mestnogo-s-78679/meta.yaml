  title:
    rus: О внесении изменения в решение маслихата от 27 февраля 2014 года № 205 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Камышинского сельского округа Федоровского района Костанайской области»
    kaz: Мәслихаттың 2014 жылғы 27 ақпандағы № 205 «Қостанай облысы Федоров ауданы Камышин ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидасын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгеріс енгізу туралы
