  title:
    rus: О внесении изменений в решение маслихата от 27 февраля 2014 года № 203 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Вишневого сельского округа Федоровского района Костанайской области»
    kaz: Мәслихаттың 2014 жылғы 27 ақпандағы № 203 «Қостанай облысы Федоров ауданы Вишневый ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидасын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
