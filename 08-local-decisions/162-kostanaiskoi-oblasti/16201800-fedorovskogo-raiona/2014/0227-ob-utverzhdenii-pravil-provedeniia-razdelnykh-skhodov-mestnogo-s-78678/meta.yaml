act_code: '78678'
requisite: Решение маслихата Федоровского района Костанайской области от 27 февраля 2014 года № 203. Зарегистрировано Департаментом юстиции Костанайской области 8 апреля 2014 года № 4568. Утратило силу решением маслихата Федоровского района Костанайской области от 14 сентября 2023 года № 53 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Вишневого сельского округа Федоровского района Костанайской области
  kaz: Қостанай облысы Федоров ауданы Вишневый ауылдық округінің жергілікті қоғамдастығының бөлек жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
