requisite: Решение маслихата Федоровского района Костанайской области от 12 мая 2011 года № 448. Зарегистрировано Управлением юстиции Федоровского района Костанайской области 17 мая 2011 года № 9-20-195. Прекращено действие по истечении срока, на который решение было принято (письмо маслихата Федоровского района Костанайской области от 10 января 2012 года № 02-33/2)
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты района на 2011 год
  kaz: Ауданның ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына 2011 жылға әлеуметтік қолдау шараларын ұсыну туралы
