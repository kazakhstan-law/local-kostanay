act_code: '131008'
requisite: Решение маслихата Федоровского района Костанайской области от 26 апреля 2019 года № 340. Зарегистрировано Департаментом юстиции Костанайской области 30 апреля 2019 года № 8379. Утратило силу решением маслихата Федоровского района Костанайской области от 3 апреля 2020 года № 424 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт және ветеринария саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк мөлшерлемелерді белгiлеу туралы
