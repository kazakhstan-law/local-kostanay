  title:
    rus: О внесении изменений в решение маслихата от 20 января 2021 года № 12 «Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, культуры и спорта, являющимся гражданскими служащими и работающим в сельской местности»
    kaz: Мәслихаттың 2021 жылғы 20 қаңтардағы № 12 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, мәдениет және спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк мөлшерлемелерді белгiлеу туралы» шешіміне өзгерістер енгізу туралы
