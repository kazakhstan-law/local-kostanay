  title:
    rus: О внесении дополнения в решение от 29 января 2009 года № 155 "Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок гражданским служащим социального обеспечения, образования, культуры, работающим в аульной (сельской) местности"
    kaz: '"Ауылдық (селолық) жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамтамасыздандыру, білім беру, мәдениет азаматтық қызметшілеріне жиырма бес пайызға жоғары лауазымдық жалақылар мен тарифтік ставкаларды белгілеу туралы" 2009 жылғы 29 қаңтардағы № 155 шешіміне толықтыру енгізу туралы'
