  requisite: Решение маслихата района Беимбета Майлина Костанайской области от 23 декабря 2024 года № 135
  title:
    rus: О внесении изменения в решение маслихата района от 27 декабря 2023 года № 71 «О предоставлении в 2024 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов поселка, сельских округов, прибывшим для работы и проживания в сельские населенные пункты района Беимбета Майлина»
    kaz: Аудан мәслихатының 2023 жылғы 27 желтоқсандағы № 71 «2024 жылы ауданның ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, кент, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/204568/rus
