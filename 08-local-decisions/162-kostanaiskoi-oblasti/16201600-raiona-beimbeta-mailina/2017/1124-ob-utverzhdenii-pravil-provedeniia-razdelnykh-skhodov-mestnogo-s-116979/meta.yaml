requisite: Решение маслихата Тарановского района Костанайской области от 24 ноября 2017 года № 136. Зарегистрировано Департаментом юстиции Костанайской области 20 декабря 2017 года № 7406. Утратило силу решением маслихата района Беимбета Майлина Костанайской области от 9 января 2020 года № 339 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
