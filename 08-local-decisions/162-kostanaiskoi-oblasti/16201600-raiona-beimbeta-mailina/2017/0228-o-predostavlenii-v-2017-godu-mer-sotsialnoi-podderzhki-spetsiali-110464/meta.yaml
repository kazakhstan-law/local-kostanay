requisite: Решение маслихата Тарановского района Костанайской области от 28 февраля 2017 года № 76. Зарегистрировано Департаментом юстиции Костанайской области 15 марта 2017 года № 6905
title:
  rus: О предоставлении в 2017 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Тарановского района
  kaz: Таран ауданының ауылдық елді мекендеріне жұмыс істеуге  және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы  мамандарға 2017 жылы әлеуметтік қолдау шараларын көрсету туралы
