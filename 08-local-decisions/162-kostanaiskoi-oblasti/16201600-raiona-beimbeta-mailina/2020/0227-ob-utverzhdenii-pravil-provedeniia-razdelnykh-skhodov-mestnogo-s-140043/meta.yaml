requisite: Решение маслихата района Беимбета Майлина Костанайской области от 27 февраля 2020 года № 362. Зарегистрировано Департаментом юстиции Костанайской области 6 марта 2020 года № 9006. Утратило силу решением маслихата района Беимбета Майлина Костанайской области от 15 сентября 2023 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Калининского сельского округа района Беимбета Майлина Костанайской области
  kaz: Қостанай облысы Бейімбет Майлин ауданы Калинин ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
