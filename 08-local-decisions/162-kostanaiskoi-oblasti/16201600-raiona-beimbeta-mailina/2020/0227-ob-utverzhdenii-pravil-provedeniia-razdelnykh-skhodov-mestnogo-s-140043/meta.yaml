  title:
    rus: О внесении изменений в решение маслихата от 27 февраля 2020 года № 362 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Калининского сельского округа района Беимбета Майлина Костанайской области»
    kaz: Мәслихаттың 2020 жылғы 27 ақпандағы № 362 «Қостанай облысы Бейімбет Майлин ауданы Калинин ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
