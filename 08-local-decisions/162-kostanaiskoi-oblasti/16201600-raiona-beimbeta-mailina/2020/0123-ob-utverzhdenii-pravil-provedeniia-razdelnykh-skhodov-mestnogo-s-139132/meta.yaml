  title:
    rus: О внесении изменения в решение маслихата от 23 января 2020 года № 349 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Набережного сельского округа района Беимбета Майлина Костанайской области»
    kaz: Мәслихаттың 2020 жылғы 23 қаңтардағы № 349 «Қостанай облысы Бейімбет Майлин ауданы Набережный ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгеріс енгізу туралы
