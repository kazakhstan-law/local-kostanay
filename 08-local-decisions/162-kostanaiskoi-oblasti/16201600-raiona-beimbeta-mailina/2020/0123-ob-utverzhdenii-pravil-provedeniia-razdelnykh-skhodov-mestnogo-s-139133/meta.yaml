requisite: Решение маслихата района Беимбета Майлина Костанайской области от 23 января 2020 года № 347. Зарегистрировано Департаментом юстиции Костанайской области 29 января 2020 года № 8927. Утратило силу решением маслихата района Беимбета Майлина Костанайской области от 15 сентября 2023 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Белинского сельского округа района Беимбета Майлина Костанайской области
  kaz: Қостанай облысы Бейімбет Майлин ауданы Белинский ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
