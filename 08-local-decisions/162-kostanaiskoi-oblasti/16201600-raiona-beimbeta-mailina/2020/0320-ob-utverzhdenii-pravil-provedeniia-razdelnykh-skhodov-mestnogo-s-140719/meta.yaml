requisite: Решение маслихата района Беимбета Майлина Костанайской области от 20 марта 2020 года № 366. Зарегистрировано Департаментом юстиции Костанайской области 30 марта 2020 года № 9058. Утратило силу решением маслихата района Беимбета Майлина Костанайской области от 15 сентября 2023 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села, поселка для участия в сходе местного сообщества поселка Тобол района Беимбета Майлина Костанайской области
  kaz: Қостанай облысы Бейімбет Майлин ауданы Тобыл кентінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
