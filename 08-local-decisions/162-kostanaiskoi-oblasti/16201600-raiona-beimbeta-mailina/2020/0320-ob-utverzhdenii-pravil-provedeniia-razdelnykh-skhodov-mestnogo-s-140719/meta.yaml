  title:
    rus: О внесении изменений в решение маслихата от 20 марта 2020 года № 366 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества поселка Тобол района Беимбета Майлина Костанайской области»
    kaz: Мәслихаттың 2020 жылғы 20 наурыздағы № 366 «Қостанай облысы Бейімбет Майлин ауданы Тобыл кентінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
