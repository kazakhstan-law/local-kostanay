act_code: '140723'
requisite: Решение маслихата района Беимбета Майлина Костанайской области от 20 марта 2020 года № 368. Зарегистрировано Департаментом юстиции Костанайской области 30 марта 2020 года № 9059. Утратило силу решением маслихата района Беимбета Майлина Костанайской области от 30 апреля 2021 года № 32 (вводится в действие по истечении десяти календарных дней после дня первого официального опубликования)
title:
  rus: Об установлении специалистам в области здравоохранения, социального обеспечения, образования, культуры и спорта, являющимся гражданскими служащими и работающими в сельской местности, повышенных на двадцать пять процентов должностных окладов и тарифных ставок по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандарға қызметтiң осы түрлерiмен қалалық жағдайда айналысатын азаматтық қызметшiлердiң айлықақыларымен және мөлшерлемелерімен салыстырғанда кемiнде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк мөлшерлемелерді белгілеу туралы
