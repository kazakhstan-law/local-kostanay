act_code: '142396'
requisite: Решение маслихата района Беимбета Майлина Костанайской области от 29 апреля 2020 года № 379. Зарегистрировано Департаментом юстиции Костанайской области 30 апреля 2020 года № 9155. Утратило силу решением маслихата района Беимбета Майлина Костанайской области от 19 августа 2020 года № 407 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении в 2020 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района Беимбета Майлина
  kaz: Бейімбет Майлин ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы әлеуметтік қолдау көрсету туралы
