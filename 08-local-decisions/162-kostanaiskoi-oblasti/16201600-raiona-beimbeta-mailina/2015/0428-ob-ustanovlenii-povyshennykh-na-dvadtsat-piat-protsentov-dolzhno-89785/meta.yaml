requisite: Решение маслихата Тарановского района Костанайской области от 28 апреля 2015 года № 278. Зарегистрировано Департаментом юстиции Костанайской области 22 мая 2015 года № 5615. Утратило силу решением маслихата Тарановского района Костанайской области от 18 января 2016 года № 332
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими, работающим в сельской местности
  kaz: Азаматтық қызметші болып табылатын, ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік ставкаларды белгілеу туралы
