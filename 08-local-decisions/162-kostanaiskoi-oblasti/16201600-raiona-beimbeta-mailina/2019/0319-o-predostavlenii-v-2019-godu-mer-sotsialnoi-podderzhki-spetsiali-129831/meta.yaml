  title:
    rus: О внесении изменений в решение маслихата от 19 марта 2019 года № 262 «О предоставлении в 2019 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Тарановского района»
    kaz: Мәслихаттың 2019 жылғы 19 наурыздағы № 262 «Таран ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылы әлеуметтік қолдау шараларын көрсету туралы» шешіміне өзгерістер енгізу туралы
