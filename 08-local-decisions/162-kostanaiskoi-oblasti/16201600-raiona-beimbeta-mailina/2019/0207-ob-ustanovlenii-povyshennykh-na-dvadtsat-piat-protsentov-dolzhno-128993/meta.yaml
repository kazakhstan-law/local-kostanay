act_code: '128993'
requisite: Решение маслихата Тарановского района Костанайской области от 7 февраля 2019 года № 252. Зарегистрировано Департаментом юстиции Костанайской области 8 февраля 2019 года № 8253. Утратило силу решением маслихата района Беимбета Майлина Костанайской области от 20 марта 2020 года № 368 (вводится в действие по истечении десяти календарных дней после дня первого официального опубликования)
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерді белгілеу туралы
