  title:
    rus: О внесении изменения в решение маслихата от 18 декабря 2019 года № 331 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества сельского округа Әйет района Беимбета Майлина Костанайской области»
    kaz: Мәслихаттың 2019 жылғы 18 желтоқсандағы № 331 «Қостанай облысы Бейімбет Майлин ауданы Әйет ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгеріс енгізу туралы
