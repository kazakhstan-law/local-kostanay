act_code: '37194'
requisite: Решение маслихата Тарановского района Костанайской области от 21 декабря 2007 года № 34. Зарегистрировано Управлением юстиции Тарановского района Костанайской области 28 января 2008 года № 9-18-58
title:
  rus: О согласовании перечня должностей специалистов социального обеспечения, образования, культуры, работающих в аульной (сельской) местности, имеющих право на повышенные на двадцать пять процентов должностные оклады и тарифные ставки
  kaz: Ауылдық (селолық) жерлерде жұмыс істейтін жиырма бес пайызға көтеру үшін лауазымдық жалақылары мен тарифтік мөлшерлемелерге құқығы бар мамандықтар әлеуметтік қамтамасыз ету, білім, мәдениет лауазымдарының тізімі келісімімен анықтау туралы
