requisite: Решение маслихата Тарановского района Костанайской области от 21 апреля 2016 года № 21. Зарегистрировано Департаментом юстиции Костанайской области 16 мая 2016 года № 6365
title:
  rus: О предоставлении в 2016 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Тарановского района
  kaz: Таран ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2016 жылы әлеуметтік қолдау шараларын көрсету туралы
