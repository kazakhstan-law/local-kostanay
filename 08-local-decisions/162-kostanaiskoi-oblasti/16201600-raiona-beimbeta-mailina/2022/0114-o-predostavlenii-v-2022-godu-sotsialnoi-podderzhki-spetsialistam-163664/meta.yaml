act_code: '163664'
requisite: Решение маслихата района Беимбета Майлина Костанайской области от 14 января 2022 года № 84
title:
  rus: О предоставлении в 2022 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов поселка, сельских округов, прибывшим для работы и проживания в сельские населенные пункты района Беимбета Майлина
  kaz: Бейімбет Майлин ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, кент, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2022 жылы әлеуметтік қолдау көрсету туралы
