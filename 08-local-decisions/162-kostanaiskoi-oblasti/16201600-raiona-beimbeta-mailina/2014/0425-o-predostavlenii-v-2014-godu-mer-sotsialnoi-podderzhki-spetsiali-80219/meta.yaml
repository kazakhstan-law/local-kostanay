requisite: Решение маслихата Тарановского района Костанайской области от 25 апреля 2014 года № 195. Зарегистрировано Департаментом юстиции Костанайской области 22 мая 2014 года № 4744
title:
  rus: О предоставлении в 2014 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Тарановского района
  kaz: Таран ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына әлеуметтік қолдау шараларын 2014 жылы ұсыну туралы
