requisite: Решение маслихата Тарановского района Костанайской области от 22 июля 2014 года № 222. Зарегистрировано Департаментом юстиции Костанайской области 20 августа 2014 года № 5030. Утратило силу решением маслихата района Беимбета Майлина Костанайской области от 18 декабря 2019 года № 331 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Тарановского сельского округа Тарановского района Костанайской области
  kaz: Қостанай облысы Таран ауданы Таран ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
