requisite: Решение маслихата Тарановского района Костанайской области от 22 июля 2014 года № 223. Зарегистрировано Департаментом юстиции Костанайской области 20 августа 2014 года № 5031. Утратило силу решением маслихата района Беимбета Майлина Костанайской области от 20 марта 2020 года № 366 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей для участия в сходе местного сообщества поселка Тобол Тарановского района Костанайской области
  kaz: Қостанай облысы Таран ауданы Тобыл кентінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін тұрғындар өкілдерінің сандық құрамын бекіту туралы
