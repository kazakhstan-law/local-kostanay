  title:
    rus: О внесении изменений в решение маслихата от 15 октября 2021 года № 55 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в районе Беимбета Майлина»
    kaz: «Бейімбет Майлин ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» 2021 жылғы 15 қазандағы № 55 мәслихат шешіміне өзгерістер енгізу туралы
