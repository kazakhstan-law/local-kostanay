  title:
    rus: О внесении изменений в решение маслихата от 30 апреля 2021 года № 32 «Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения и культуры, являющимся гражданскими служащими и работающим в сельской местности»
    kaz: Мәслихаттың 2021 жылғы 30 сәуірдегі № 32 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру және мәдениет саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк мөлшерлемелерді белгілеу туралы» шешіміне өзгерістер енгізу туралы
