title:
  rus: Об установлении государственному учреждению «Аппарат акима Узункольского сельского округа Узункольского района» публичного сервитута на земельный участок с правом постоянного землепользование для размещения и обслуживания стеллы
  kaz: Ұзынкөл ауданының Ұзынкөл ауылдық округі әкімінің аппараты» мемлекеттік мекемесіне стелланы орналастыру және күтіп ұстау үшін, тұрақты жер пайдалану құқығымен жер учаскесіне жария сервитут белгілеу туралы
