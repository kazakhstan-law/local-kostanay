requisite: Решение акима сельского округа имени Ильяса Омарова Алтынсаринского района Костанайской области от 7 марта 2014 года № 3. Зарегистрировано Департаментом юстиции Костанайской области 19 марта 2014 года № 4518. Утратило силу решением акима сельского округа имени Ильяса Омарова Алтынсаринского района Костанайской области от 29 октября 2015 года № 1
title:
  rus: Об установлении ограничительных мероприятий на территории животноводческой фермы товарищества с ограниченной ответственностью "Беляевка" сельского округа имени Ильяса Омарова Алтынсаринского района
