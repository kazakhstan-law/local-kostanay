requisite: Решение маслихата Денисовского района Костанайской области от 11 января 2008 года № 30. Зарегистрировано управлением юстиции Денисовского района Костанайской области 30 января 2008 года № 9-8-88. Утратило силу решением маслихата Денисовского района Костанайской области от 20 сентября 2013 года № 61
title:
  rus: Об установлении повышенных на двадцать пять процентов, должностных окладов и тарифных ставок гражданским служащим социального обеспечения, образования, культуры, работающим в аульной (сельской) местности, за счет средств районного бюджета
  kaz: Ауылдық (селолық) жерлерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет азаматтық қызметшілеріне 2008 жылға арналған аудандық бюджет қаражаты есебінен жиырма бес процентке жоғары лауазымдық жалақылар мен тарифтік ставкаларды белгілеу туралы
