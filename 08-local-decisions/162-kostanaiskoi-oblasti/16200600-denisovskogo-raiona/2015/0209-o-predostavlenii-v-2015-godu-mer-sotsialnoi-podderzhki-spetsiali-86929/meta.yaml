act_code: '86929'
requisite: Решение маслихата Денисовского района Костанайской области от 9 февраля 2015 года № 7. Зарегистрировано Департаментом юстиции Костанайской области 20 февраля 2015 года № 5376. Утратило силу в связи с истечением срока действия (письмо маслихата Денисовского района Костанайской области от 11 января 2016 года № 7)
title:
  rus: О предоставлении в 2015 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты
  kaz: Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын 2015 жылы ұсыну туралы
