act_code: '127404'
requisite: Решение маслихата Денисовского района Костанайской области от 24 декабря 2018 года № 239. Зарегистрировано Департаментом юстиции Костанайской области 26 декабря 2018 года № 8195. Утратило силу решением маслихата Денисовского района Костанайской области от 12 мая 2021 года № 33 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры и спорта, являющимся гражданскими служащими и работающим в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет және спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк мөлшерлемелерді белгiлеу туралы
