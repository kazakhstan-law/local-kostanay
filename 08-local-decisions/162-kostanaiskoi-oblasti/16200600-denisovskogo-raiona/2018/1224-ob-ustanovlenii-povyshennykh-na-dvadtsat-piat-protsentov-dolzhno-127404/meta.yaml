  title:
    rus: О внесении изменений в решение маслихата от 24 декабря 2018 года № 239 «Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельских населенных пунктах»
    kaz: Мәслихаттың 2018 жылғы 24 желтоқсандағы № 239 «Азаматтық қызметші болып табылатын және ауылдық елді мекендерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт және ветеринария саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк мөлшерлемелерді белгiлеу туралы» шешіміне өзгерістер енгізу туралы
