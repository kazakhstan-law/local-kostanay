act_code: '192899'
requisite: Решение акима Красноармейского сельского округа Денисовского района Костанайской области от 26 января 2024 года № 5
title:
  rus: Об установлении публичного сервитута государственному учреждению «Отдел архитектуры, градостроительства и строительства акимата Денисовского района» для использования земельного участка в целях обслуживания и эксплуатации распределительной сети водоснабжения к объекту «Строительство распределительных сетей и сооружений водоснабжения сел Фрунзенское и Красноармейское Денисовского района Костанайской области»
  kaz: '"Денисов ауданы әкімдігінің сәулет, қала құрылысы және құрылыс бөлімі" мемлекеттік мекемесіне "Қостанай облысы Денисов ауданы Фрунзе және Красноармейское ауылдарын сумен жабдықтаудың тарату желілері мен құрылыстарын салу" объектісіне сумен жабдықтаудың тарату желісіне қызмет көрсету және пайдалану мақсатында жер учаскесін пайдалану үшін қауымдық сервитут белгілеу туралы'
