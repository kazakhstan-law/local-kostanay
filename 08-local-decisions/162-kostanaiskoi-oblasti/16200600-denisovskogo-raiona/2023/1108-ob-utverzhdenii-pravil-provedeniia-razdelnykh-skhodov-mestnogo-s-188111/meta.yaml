requisite: Решение маслихата Денисовского района Костанайской области от 8 ноября 2023 года № 67
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села для участия в сходе местного сообщества села Крымское Денисовского района Костанайской области
  kaz: Қостанай облысы Денисов ауданы Қырым аулының бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
