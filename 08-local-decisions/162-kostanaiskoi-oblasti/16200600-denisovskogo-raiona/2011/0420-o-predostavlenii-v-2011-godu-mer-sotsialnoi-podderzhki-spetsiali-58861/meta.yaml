act_code: '58861'
requisite: Решение маслихата Денисовского района Костанайской области от 20 апреля 2011 года № 24. Зарегистрировано Управлением юстиции Денисовского района Костанайской области 17 мая 2011 года № 9-8-176. Утратило силу в связи с истечением срока действия - письмо маслихата Денисовского района Костанайской области от 16 января 2012 года № 9
title:
  rus: О предоставлении в 2011 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты
  kaz: Ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына әлеуметтік қолдау шараларын 2011 жылы ұсыну туралы
