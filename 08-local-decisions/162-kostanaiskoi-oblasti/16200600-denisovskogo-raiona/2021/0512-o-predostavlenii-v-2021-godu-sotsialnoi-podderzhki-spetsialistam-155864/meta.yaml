act_code: '155864'
requisite: Решение маслихата Денисовского района Костанайской области от 12 мая 2021 года № 34. Зарегистрировано Департаментом юстиции Костанайской области 14 мая 2021 года № 9912
title:
  rus: О предоставлении в 2021 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Денисовского района
  kaz: Денисов ауданының ауылдық елдi мекендеріне жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2021 жылы әлеуметтік қолдау көрсету туралы
