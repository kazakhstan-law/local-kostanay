requisite: Решение маслихата Денисовского района Костанайской области от 23 июня 2022 года № 61. Отменено решением маслихата Денисовского района Костанайской области от 8 ноября 2023 года № 66 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Красноармейского сельского округа Денисовского района Костанайской области
  kaz: Қостанай облысы Денисов ауданы Красноармейск ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
