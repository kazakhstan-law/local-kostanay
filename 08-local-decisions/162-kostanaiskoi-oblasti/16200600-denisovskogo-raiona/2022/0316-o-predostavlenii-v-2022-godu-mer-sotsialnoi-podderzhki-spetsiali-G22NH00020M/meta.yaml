act_code: '165684'
requisite: Решение маслихата Денисовского района Костанайской области от 16 марта 2022 года № 20
title:
  rus: О предоставлении в 2022 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Денисовского района
  kaz: 2022 жылы Денисов ауданының ауылдық елдi мекендерге жұмыс iстеуге және тұру үшін келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтiк қолдау шараларын ұсыну туралы
