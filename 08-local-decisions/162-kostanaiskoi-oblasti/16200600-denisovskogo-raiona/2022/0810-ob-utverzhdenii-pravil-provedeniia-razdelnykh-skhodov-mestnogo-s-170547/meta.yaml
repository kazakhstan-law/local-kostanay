requisite: Решение маслихата Денисовского района Костанайской области от 10 августа 2022 года № 73. Отменено решением маслихата Денисовского района Костанайской области от 8 ноября 2023 года № 71 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Свердловского сельского округа Денисовского района Костанайской области
  kaz: Қостанай облысы Денисов ауданы Свердлов ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидасын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
