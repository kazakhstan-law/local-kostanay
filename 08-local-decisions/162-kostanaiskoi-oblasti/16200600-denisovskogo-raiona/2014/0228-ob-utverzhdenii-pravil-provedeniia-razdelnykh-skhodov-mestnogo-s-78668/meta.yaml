title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села                         для участия в сходе местного сообщества Тобольского сельского округа Денисовского района Костанайской области
  kaz: Қостанай облысы Денисов ауданы Тобыл ауылдық округінің жергілікті қоғамдастықтың жиынына қатысу үшін бөлек жергілікті қоғамдастық жиындарын өткізу қағидасын және ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
