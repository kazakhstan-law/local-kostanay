    kaz: Денисов аудандық мәслихатының 2014 жылғы 28 ақпандағы № 30 "Қостанай облысы Денисов ауданы Тобыл ауылдық округінің жергілікті қоғамдастықтың жиынына қатысу үшін бөлек жергілікті қоғамдастық жиындарын өткізу қағидасын және ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы" шешіміне өзгерістер енгізу туралы
