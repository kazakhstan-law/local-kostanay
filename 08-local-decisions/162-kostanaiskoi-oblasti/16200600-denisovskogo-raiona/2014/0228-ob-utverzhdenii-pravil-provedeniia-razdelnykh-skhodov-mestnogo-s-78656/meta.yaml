  title:
    rus: О внесении изменения в решение Денисовского районного маслихата от 28 февраля 2014 года № 18 «Об утверждении Правил проведения раздельных                          сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Аршалинского сельского округа Денисовского района Костанайской области»
    kaz: Денисов аудандық мәслихатының 2014 жылғы 28 ақпандағы № 18 «Қостанай облысы Денисов ауданы Аршалы ауылдық округінің жергілікті қоғамдастықтың жиынына қатысу үшін бөлек жергілікті қоғамдастық жиындарын өткізу қағидасын және ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгеріс енгізу туралы
