    kaz: Денисов аудандық мәслихатының 2014 жылғы 28 ақпандағы № 23 "Қостанай облысы Денисов ауданы Красноармейск ауылдық округінің жергілікті қоғамдастықтың жиынына қатысу үшін бөлек жергілікті қоғамдастық жиындарын өткізу қағидасын және ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы" шешіміне өзгерістер енгізу туралы
