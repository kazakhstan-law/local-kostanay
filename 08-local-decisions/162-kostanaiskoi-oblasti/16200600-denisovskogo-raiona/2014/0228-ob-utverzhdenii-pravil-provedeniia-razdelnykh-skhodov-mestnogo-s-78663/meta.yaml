    kaz: Денисов аудандық мәслихатының 2014 жылғы 28 ақпандағы № 25 "Қостанай облысы Денисов ауданы Перелески ауылының жергілікті қоғамдастықтың жиынына қатысу үшін бөлек жергілікті қоғамдастық жиындарын өткізу қағидасын және ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы" шешіміне өзгерістер енгізу туралы
