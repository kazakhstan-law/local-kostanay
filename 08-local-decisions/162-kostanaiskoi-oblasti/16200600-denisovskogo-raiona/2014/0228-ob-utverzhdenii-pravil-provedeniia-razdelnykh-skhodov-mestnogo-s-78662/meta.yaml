  title:
    rus: О внесении изменений в решение Денисовского районного маслихата Костанайской области от 28 февраля 2014 года № 24 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Крымского сельского округа Денисовского района Костанайской области»
    kaz: Қостанай облысы Денисов аудандық мәслихатының 2014 жылғы 28 ақпандағы № 24 «Қостанай облысы Денисов ауданы Қырым ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізу Қағидаларын және жергілікті қоғамдастықтың жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
