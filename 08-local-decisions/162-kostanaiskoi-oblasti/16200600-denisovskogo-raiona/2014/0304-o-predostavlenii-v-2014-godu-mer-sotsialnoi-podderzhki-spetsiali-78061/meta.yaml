act_code: '78061'
requisite: Решение маслихата Денисовского района Костанайской области от 4 марта 2014 года № 34. Зарегистрировано Департаментом юстиции Костанайской области 14 марта 2014 года № 4497. Утратило силу в связи с истечением срока действия (письмо маслихата Денисовского района Костанайской области от 6 января 2015 года № 5)
title:
  rus: О предоставлении в 2014 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты
  kaz: Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына әлеуметтік қолдау шараларын 2014 жылы ұсыну туралы
