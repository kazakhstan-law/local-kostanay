requisite: Решение маслихата Денисовского района Костанайской области от 28 февраля 2014 года № 22. Зарегистрировано Департаментом юстиции Костанайской области 8 апреля 2014 года № 4550. Утратило силу решением маслихата Денисовского района Костанайской области от 31 октября 2019 года № 76 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села для участия в сходе местного сообщества Комаровского сельского округа Денисовского района Костанайской области
  kaz: Қостанай облысы Денисов ауданы Комаров ауылдық округінің жергілікті қоғамдастықтың жиынына қатысу үшін бөлек жергілікті қоғамдастық жиындарын өткізу қағидасын және ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
