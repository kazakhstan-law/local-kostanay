requisite: Решение маслихата Денисовского района Костанайской области от 28 февраля 2014 года № 17. Зарегистрировано Департаментом юстиции Костанайской области 8 апреля 2014 года № 4545. Утратило силу решением маслихата Денисовского района Костанайской области от 9 июня 2022 года № 44 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Архангельского сельского округа Денисовского района Костанайской области
  kaz: Қостанай облысы Денисов ауданы Архангельск ауылдық округінің жергілікті қоғамдастықтың жиынына қатысу үшін бөлек жергілікті қоғамдастық жиындарын өткізу қағидасын және ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
