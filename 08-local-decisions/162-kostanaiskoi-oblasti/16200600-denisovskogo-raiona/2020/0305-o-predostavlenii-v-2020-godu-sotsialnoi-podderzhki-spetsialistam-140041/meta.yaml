act_code: '140041'
requisite: Решение маслихата Денисовского района Костанайской области от 5 марта 2020 года № 18. Зарегистрировано Департаментом юстиции Костанайской области 6 марта 2020 года № 9004. Утратило силу решением маслихата Денисовского района Костанайской области от 19 октября 2020 года № 74 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении в 2020 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты
  kaz: Ауылдық елдi мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы әлеуметтiк қолдау көрсету туралы
