act_code: '147611'
requisite: Решение маслихата Денисовского района Костанайской области от 19 октября 2020 года № 74. Зарегистрировано Департаментом юстиции Костанайской области 21 октября 2020 года № 9501
title:
  rus: О предоставлении в 2020 году социальной поддержки специалистам  в области  здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты
  kaz: Ауылдық елдi мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2020 жылы әлеуметтік қолдау көрсету туралы
