requisite: Решение маслихата Денисовского района Костанайской области от 9 апреля 2019 года № 25. Зарегистрировано Департаментом юстиции Костанайской области 11 апреля 2019 года № 8339
title:
  rus: О предоставлении в 2019 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты
  kaz: Ауылдық елдi мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылы әлеуметтiк қолдау шараларын көрсету туралы
