requisite: Решение маслихата Денисовского района Костанайской области от 31 октября 2019 года № 75. Зарегистрировано Департаментом юстиции Костанайской области 3 декабря 2019 года № 8803. Утратило силу решением маслихата Денисовского района Костанайской области от 9 июня 2022 года № 44 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села для участия в сходе местного сообщества села Глебовка Денисовского района Костанайской области
  kaz: Қостанай облысы Денисов ауданы Глебовка ауылының бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
