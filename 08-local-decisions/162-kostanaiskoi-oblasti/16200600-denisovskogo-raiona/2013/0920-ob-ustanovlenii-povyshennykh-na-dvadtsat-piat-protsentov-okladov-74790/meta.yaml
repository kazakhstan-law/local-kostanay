requisite: Решение маслихата Денисовского района Костанайской области от 20 сентября 2013 года № 61. Зарегистрировано Департаментом юстиции Костанайской области 12 октября 2013 года № 4241. Утратило силу решением маслихата Денисовского района Костанайской области от 24 декабря 2018 года № 239 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельских населенных пунктах
  kaz: Азаматтық қызметші болып табылатын және ауылдық елді мекендерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік ставкаларды белгілеу туралы
