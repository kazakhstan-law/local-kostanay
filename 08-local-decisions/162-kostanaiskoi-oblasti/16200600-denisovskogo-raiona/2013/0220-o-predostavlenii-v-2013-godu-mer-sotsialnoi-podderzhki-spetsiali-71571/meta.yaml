act_code: '71571'
requisite: Решение маслихата Денисовского района Костанайской области от 20 февраля 2013 года № 9. Зарегистрировано Департаментом юстиции Костанайской области 15 марта 2013 года № 4065. Утратило силу в связи с истечением срока действия (письмо маслихата Денисовского района Костанайской области от 9 января 2014 года № 6)
title:
  rus: О предоставлении в 2013 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты
  kaz: Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын 2013 жылы ұсыну туралы
