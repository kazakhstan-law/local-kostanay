requisite: Решение маслихата Денисовского района Костанайской области от 3 февраля 2017 года № 82. Зарегистрировано Департаментом юстиции Костанайской области 23 февраля 2017 года № 6840
title:
  rus: О предоставлении в 2017 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты
  kaz: Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2017 жылы әлеуметтік қолдау шараларын көрсету туралы
