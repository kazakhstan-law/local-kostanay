requisite: Решение маслихата Денисовского района Костанайской области от 18 марта 2026 года № 11
title:
  rus: О предоставлении в 2026 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Денисовского района
  kaz: 2026 жылы Денисов ауданының ауылдық елдi мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне, әлеуметтiк қолдау шараларын ұсыну туралы
