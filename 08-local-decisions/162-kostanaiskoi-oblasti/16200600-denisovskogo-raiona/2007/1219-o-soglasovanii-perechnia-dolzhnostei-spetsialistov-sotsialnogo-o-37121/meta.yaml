act_code: '37121'
requisite: Решение маслихата Денисовского района Костанайской области от 19 декабря 2007 года № 19. Зарегистрировано Управлением юстиции Денисовского района Костанайской области 25 января 2008 года № 9-8-84. Утратило силу решением маслихата Денисовского района Костанайской области от 31 марта 2008 года № 42
title:
  rus: О согласовании перечня должностей специалистов социального обеспечения, образования, культуры, работающих в аульной (сельской) местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки
  kaz: Жиырма бес процентке жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар ауылдық (селолық) жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет мамандары лауазымдарының тізбесінің келістіру туралы
