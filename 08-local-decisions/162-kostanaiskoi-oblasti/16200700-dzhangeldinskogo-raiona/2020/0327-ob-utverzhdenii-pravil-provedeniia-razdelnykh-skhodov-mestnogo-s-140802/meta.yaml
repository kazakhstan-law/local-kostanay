requisite: Решение маслихата Джангельдинского района Костанайской области от 27 марта 2020 года № 291. Зарегистрировано Департаментом юстиции Костанайской области 31 марта 2020 года № 9068. Утратило силу решением маслихата Джангельдинского района Костанайской области от 31 мая 2022 года № 110 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Шилийского сельского округа Джангельдинского района Костанайской области
  kaz: Қостанай облысы Жангелдин ауданы Шилі ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
