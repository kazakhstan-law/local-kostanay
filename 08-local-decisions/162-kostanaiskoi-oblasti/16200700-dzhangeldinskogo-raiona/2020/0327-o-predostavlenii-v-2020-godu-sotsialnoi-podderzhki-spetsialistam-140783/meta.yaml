act_code: '140783'
requisite: Решение маслихата Джангельдинского района Костанайской области от 27 марта 2020 года № 292. Зарегистрировано Департаментом юстиции Костанайской области 31 марта 2020 года № 9066. Утратило силу решением маслихата Джангельдинского района Костанайской области от 28 октября 2020 года № 326 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении в 2020 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Джангельдинского района
  kaz: Жангелдин ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы әлеуметтік қолдау көрсету туралы
