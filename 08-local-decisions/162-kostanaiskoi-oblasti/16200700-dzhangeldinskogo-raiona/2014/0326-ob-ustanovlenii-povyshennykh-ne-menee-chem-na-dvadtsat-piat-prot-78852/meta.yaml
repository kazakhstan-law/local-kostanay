requisite: Решение маслихата Джангельдинского района Костанайской области от 26 марта 2014 года № 163. Зарегистрировано Департаментом юстиции Костанайской области 14 апреля 2014 года № 4598. Утратило силу решением маслихата Джангельдинского района Костанайской области от 30 июля 2015 года № 231
title:
  rus: Об установлении повышенных не менее чем на двадцать пять процентов должностные оклады и тарифные ставки по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях специалистам в области социального обеспечения, образования, культуры и ветеринарии являющимся гражданскими служащими и работающим в сельской местности
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және ветеринария саласындағы мамандарға қызметтің осы түрлерімен қалалық жағдайда айналысатын азаматтық қызметшілердің айлықақыларымен және ставкаларымен салыстырғанда кемінде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік ставкаларды белгілеу туралы
