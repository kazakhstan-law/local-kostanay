requisite: Решение маслихата Джангельдинского района Костанайской области от 28 февраля 2014 года № 149. Зарегистрировано Департаментом юстиции Костанайской области 10 апреля 2014 года № 4582. Утратило силу решением маслихата Джангельдинского района Костанайской области от 19 марта 2018 года № 162
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Амангельдинского сельского округа Джангельдинского района Костанайской области
  kaz: Қостанай облысы Жангелдин ауданының Амангелді ауылдық округінде бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиындарына қатысатын ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
