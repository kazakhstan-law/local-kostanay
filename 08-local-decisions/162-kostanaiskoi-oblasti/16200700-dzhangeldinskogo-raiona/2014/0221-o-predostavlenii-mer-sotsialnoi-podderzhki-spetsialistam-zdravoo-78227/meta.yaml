requisite: Решение маслихата Джангельдинского района Костанайской области от 21 февраля 2014 года № 143. Зарегистрировано Департаментом юстиции Костанайской области 19 марта 2014 года № 4510
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района на 2014 год
  kaz: Ауданның ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешенінің мамандарына 2014 жылға әлеуметтік қолдау шараларын ұсыну туралы
