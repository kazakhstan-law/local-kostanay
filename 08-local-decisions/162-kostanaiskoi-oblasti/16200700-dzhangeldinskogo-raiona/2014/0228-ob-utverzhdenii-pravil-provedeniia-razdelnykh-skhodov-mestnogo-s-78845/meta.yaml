requisite: Решение маслихата Джангельдинского района Костанайской области от 28 февраля 2014 года № 152. Зарегистрировано Департаментом юстиции Костанайской области 10 апреля 2014 года № 4585. Утратило силу решением маслихата Джангельдинского района Костанайской области от 31 мая 2022 года № 110 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Кызбельского сельского округа Джангельдинского района Костанайской области
  kaz: Қостанай облысы Жангелдин ауданының Қызбел ауылдық округінде бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиындарына қатысатын ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
