  requisite: Решение маслихата Джангельдинского района Костанайской области от 21 апреля 2026 года № 204
  title:
    rus: О внесении изменений в решение Джангельдинского районного маслихата от 26 марта 2021 года № 22 «Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, культуры и спорта, являющимся гражданскими служащими и работающим в сельской местности»
    kaz: Жангелдин аудандық мәслихатының 2021 жылғы 26 наурыздағы № 22 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, мәдениет және спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерді белгілеу туралы» шешіміне өзгерістер енгізу туралы
