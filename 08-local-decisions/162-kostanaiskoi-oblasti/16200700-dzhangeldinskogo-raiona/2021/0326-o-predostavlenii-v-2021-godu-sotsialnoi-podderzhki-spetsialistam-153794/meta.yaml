act_code: '153794'
requisite: Решение маслихата Джангельдинского района Костанайской области от 26 марта 2021 года № 21. Зарегистрировано Департаментом юстиции Костанайской области 26 марта 2021 года № 9833
title:
  rus: О предоставлении в 2021 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Джангельдинского района
  kaz: Жангелдин ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2021 жылы әлеуметтік қолдау көрсету туралы
