requisite: Решение маслихата Джангельдинского района Костанайской области от 27 февраля 2017 года № 72. Зарегистрировано Департаментом юстиции Костанайской области 3 марта 2017 года № 6869
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района на 2017 год
  kaz: Ауданның ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2017 жылға  әлеуметтік қолдау шараларын көрсету туралы
