requisite: Қостанай облысы Жангелдин ауданы әкімдігінің 2009 жылғы 8 сәуірдегі № 104 шешімі. Қостанай облысы Жангелдин ауданының Әділет басқармасында 2009 жылы 15 мамырда № 9-9-103 тіркелді. Күші жойылды - Қостанай облысы Жангелдин ауданы мәслихатының 2010 жылғы 22 желтоқсандағы № 206 шешімімен
