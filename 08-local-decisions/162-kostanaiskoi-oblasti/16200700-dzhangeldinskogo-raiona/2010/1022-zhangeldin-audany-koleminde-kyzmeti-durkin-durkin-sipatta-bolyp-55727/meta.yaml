requisite: Қостанай облысы Жангелдин ауданы мәслихатының 2010 жылғы 22 қазандағы № 198 шешімі. Қостанай облысы Жангелдин ауданының Әділет басқармасында 2010 жылғы 1 желтоқсанда № 9-9-125 тіркелді. Күші жойылды - Қостанай облысы Жангелдин ауданы мәслихатының 2012 жылғы 21 желтоқсандағы № 68 шешімімен
title:
