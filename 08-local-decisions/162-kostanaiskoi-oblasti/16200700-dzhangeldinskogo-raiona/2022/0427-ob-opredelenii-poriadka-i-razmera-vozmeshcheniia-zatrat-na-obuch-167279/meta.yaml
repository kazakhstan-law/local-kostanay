  title:
    rus: О внесении изменений в решение маслихата от 27 апреля 2022 года № 98 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Джангельдинском районе»
    kaz: Мәслихаттың 2022 жылғы 27 сәуірдегі № 98 «Жангелдин ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
