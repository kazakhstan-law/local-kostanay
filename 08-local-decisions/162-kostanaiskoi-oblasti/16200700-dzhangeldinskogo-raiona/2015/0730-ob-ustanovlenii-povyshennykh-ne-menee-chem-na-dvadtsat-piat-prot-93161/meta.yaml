requisite: Решение маслихата Джангельдинского района Костанайской области от 30 июля 2015 года № 231. Зарегистрировано Департаментом юстиции Костанайской области 25 августа 2015 года № 5838. Утратило силу решением маслихата Жангельдинского района Костанайской области от 18 января 2016 года № 253
title:
  rus: Об установлении повышенных не менее чем на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт және ветеринария саласындағы мамандарға кемінде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк ставкаларды белгiлеу туралы
