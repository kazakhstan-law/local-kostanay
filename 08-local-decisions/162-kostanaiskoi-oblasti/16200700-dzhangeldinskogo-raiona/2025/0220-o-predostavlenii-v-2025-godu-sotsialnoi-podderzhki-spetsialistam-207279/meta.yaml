act_code: '207279'
requisite: Решение маслихата Джангельдинского района Костанайской области от 20 февраля 2025 года № 126
title:
  rus: О предоставлении в 2025 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел и сельских округов, прибывшим для работы и проживания в сельские населенные пункты Джангельдинского района
  kaz: Жангелдин ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар және ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2025 жылы әлеуметтік қолдау шараларын көрсету туралы
