requisite: Решение маслихата Джангельдинского района Костанайской области от 19 марта 2018 года № 162. Зарегистрировано Департаментом юстиции Костанайской области 11 апреля 2018 года № 7691. Утратило силу решением маслихата Джангельдинского района Костанайской области от 31 мая 2022 года № 110 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села для участия в сходе местного сообщества села Шеген Джангельдинского района Костанайской области
  kaz: Қостанай облысы Жангелдин ауданы Шеген ауылының бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысатын ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
