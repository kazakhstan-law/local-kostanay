requisite: Решение маслихата Джангельдинского района Костанайской области от 15 февраля 2018 года № 153. Зарегистрировано Департаментом юстиции Костанайской области 2 марта 2018 года № 7562
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района на 2018 год
  kaz: Ауданның ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылға әлеуметтік қолдау шараларын көрсету туралы
