act_code: '147924'
requisite: Решение маслихата Камыстинского района Костанайской области от 28 октября 2020 года № 363. Зарегистрировано Департаментом юстиции Костанайской области 30 октября 2020 года № 9523
title:
  rus: О предоставлении в 2020 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Камыстинского района
  kaz: Қамысты ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2020 жылы әлеуметтік қолдау көрсету туралы
