act_code: '140228'
requisite: Решение маслихата Камыстинского района Костанайской области от 11 марта 2020 года № 306. Зарегистрировано Департаментом юстиции Костанайской области 16 марта 2020 года № 9024. Утратило силу решением маслихата Камыстинского района Костанайской области от 28 октября 2020 года № 363 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении в 2020 году специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты, подъемного пособия и социальной поддержки для приобретения или строительства жилья в Камыстинском районе
  kaz: Қамысты ауданында ауылдық елді мекендерге жұмыс істеуге және тұруға  келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтiк қолдау көрсету туралы
