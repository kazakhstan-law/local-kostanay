requisite: Решение маслихата Камыстинского района Костанайской области от 28 июля 2020 года № 341. Зарегистрировано Департаментом юстиции Костанайской области 3 августа 2020 года № 9353. Утратило силу решением маслихата Камыстинского района Костанайской области от 29 августа 2023 года № 74 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходах местного сообщества села Алтынсарино Камыстинского района Костанайской области
  kaz: Қостанай облысы Қамысты ауданы Алтынсарин ауылының бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиындарына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
