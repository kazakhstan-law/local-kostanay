  title:
    rus: О внесении изменений в решение Камыстинского районного маслихата от 28 июля 2020 года № 343 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходах местного сообщества сел Клочковского сельского округа Камыстинского района Костанайской области»
    kaz: Қамысты аудандық мәслихатының 2020 жылғы 28 шілдедегі № 343 «Қостанай облысы Қамысты ауданы Клочков ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
