requisite: Решение маслихата Камыстинского района Костанайской области от 28 июля 2020 года № 343. Зарегистрировано Департаментом юстиции Костанайской области 3 августа 2020 года № 9351. Утратило силу решением маслихата Камыстинского района Костанайской области от 29 августа 2023 года № 74 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Клочковского сельского округа Камыстинского района Костанайской области
  kaz: Қостанай облысы Қамысты ауданы Клочков ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
