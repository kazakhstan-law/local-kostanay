act_code: '193818'
requisite: Решение маслихата Камыстинского района Костанайской области от 26 февраля 2024 года № 158
title:
  rus: О предоставлении в 2024 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Камыстинского района
  kaz: Қамысты ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2024 жылы әлеуметтік қолдау көрсету туралы
