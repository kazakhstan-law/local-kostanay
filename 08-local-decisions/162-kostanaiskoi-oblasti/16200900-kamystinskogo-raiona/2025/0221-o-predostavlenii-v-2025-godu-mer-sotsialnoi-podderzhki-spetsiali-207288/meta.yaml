act_code: '207288'
requisite: Решение маслихата Камыстинского района Костанайской области от 21 февраля 2025 года № 288
title:
  rus: О предоставлении в 2025 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Камыстинского района
  kaz: Қамысты ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2025 жылы әлеуметтік қолдау шараларын ұсыну туралы
