act_code: '72101'
requisite: Решение маслихата Камыстинского района Костанайской области от 29 марта 2013 года № 110. Зарегистрировано Департаментом юстиции Костанайской области 17 апреля 2013 года № 4099. Утратило силу в связи с истечением срока действия (письмо маслихата Камыстинского района Костанайской области от 8 января 2014 года № 1-10/2)
title:
  rus: О предоставлении в 2013 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Камыстинского района
  kaz: Қамысты ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2013 жылы әлеуметтік қолдау шараларын ұсыну туралы
