requisite: Решение маслихата Камыстинского района Костанайской области от 6 августа 2014 года № 227. Зарегистрировано Департаментом юстиции Костанайской области 25 августа 2014 года № 5044. Утратило силу решением маслихата Камыстинского района Костанайской области от 19 января 2016 года № 424
title:
  rus: Об установлении повышенных не менее чем на двадцать пять процентов должностных окладов и тарифных ставок специалистам, в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности за счет средств районного бюджета
  kaz: Аудандық бюджет қаражаты есебінен азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға кемінде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік ставкаларды белгілеу туралы
