requisite: Решение маслихата Камыстинского района Костанайской области от 27 августа 2011 года № 319. Зарегистрировано Управлением юстиции Камыстинского района Костанайской области 6 сентября 2011 года № 9-11-123
title:
  rus: О предоставлении в 2011 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Камыстинского района
  kaz: Қамысты ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына әлеуметтік қолдау шараларын 2011 жылы ұсыну туралы
