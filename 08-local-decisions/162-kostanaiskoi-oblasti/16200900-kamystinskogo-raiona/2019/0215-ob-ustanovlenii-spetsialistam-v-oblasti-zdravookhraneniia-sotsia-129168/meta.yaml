act_code: '129168'
requisite: Решение маслихата Камыстинского района Костанайской области от 15 февраля 2019 года № 231. Зарегистрировано Департаментом юстиции Костанайской области 20 февраля 2019 года № 8266. Утратило силу решением маслихата Камыстинского района Костанайской области от 11 марта 2020 года № 310 (вводится в действие по истечении десяти календарных дней после дня первого официального опубликования)
title:
  rus: Об установлении специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающими в сельской местности, повышенных на двадцать пять процентов должностных окладов и тарифных ставок по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға қызметтiң осы түрлерiмен қалалық жағдайда айналысатын азаматтық қызметшiлердiң айлықақыларымен және мөлшерлемелерімен салыстырғанда кемiнде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк мөлшерлемелер белгілеу туралы
