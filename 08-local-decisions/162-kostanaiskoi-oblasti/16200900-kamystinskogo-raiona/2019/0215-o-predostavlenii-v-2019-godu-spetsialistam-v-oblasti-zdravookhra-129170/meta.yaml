act_code: '129170'
requisite: Решение маслихата Камыстинского района Костанайской области от 15 февраля 2019 года № 230. Зарегистрировано Департаментом юстиции Костанайской области 20 февраля 2019 года № 8265
title:
  rus: О предоставлении в 2019 году специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты, подъемного пособия и социальной поддержки для приобретения или строительства жилья в Камыстинском районе
  kaz: Қамысты ауданында ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылы көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтiк қолдау ұсыну туралы
