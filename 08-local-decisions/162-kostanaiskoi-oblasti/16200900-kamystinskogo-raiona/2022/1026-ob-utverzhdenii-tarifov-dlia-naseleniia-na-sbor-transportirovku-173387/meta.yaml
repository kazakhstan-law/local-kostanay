  title:
    rus: О внесении изменения в решение Камыстинского районного маслихата от 26 октября 2022 года № 181 «Об утверждении тарифов для населения на сбор, транспортировку, сортировку и захоронение твердых бытовых отходов по Камыстинскому району»
    kaz: Қамысты аудандық мәслихатының 2022 жылғы 26 қазандағы № 181 «Қамысты ауданы бойынша халық үшін тұрмыстық қатты қалдықтарды жинауға, тасымалдауға, сұрыптауға және көмуге арналған тарифтерді бекіту туралы» шешіміне өзгеріс енгізу туралы
