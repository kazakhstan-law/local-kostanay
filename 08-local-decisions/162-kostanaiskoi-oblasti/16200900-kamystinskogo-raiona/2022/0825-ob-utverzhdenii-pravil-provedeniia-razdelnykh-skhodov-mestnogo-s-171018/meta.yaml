requisite: Решение маслихата Камыстинского района Костанайской области от 25 августа 2022 года № 170. Отменено решением маслихата Камыстинского района Костанайской области от 29 августа 2023 года № 75 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел, для участия в сходе местного сообщества Аркинского сельского округа Камыстинского района Костанайской области
  kaz: Қостанай облысы Қамысты ауданы Арқа ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
