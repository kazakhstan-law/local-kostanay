act_code: '101785'
requisite: Решение маслихата Камыстинского района Костанайской области от 11 апреля 2016 года № 11. Зарегистрировано Департаментом юстиции Костанайской области 27 апреля 2016 года № 6306. Утратило силу решением маслихата Камыстинского района Костанайской области от 15 февраля 2019 года № 231 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении специалистам в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности, за счет средств районного бюджета, повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға аудандық бюджет қаражаты есебінен қызметтің осы түрлерімен қалалық жағдайда айналысатын азаматтық қызметшілердің айлықақыларымен және мөлшерлемелерімен салыстырғанда кемінде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
