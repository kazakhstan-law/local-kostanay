requisite: Решение маслихата Камыстинского района Костанайской области от 15 февраля 2018 года № 151. Зарегистрировано Департаментом юстиции Костанайской области 1 марта 2018 года № 7560
title:
  rus: О предоставлении в 2018 году специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты, подъемного пособия и социальной поддержки для приобретения или строительства жилья
  kaz: Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылы көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдауды көрсету туралы
