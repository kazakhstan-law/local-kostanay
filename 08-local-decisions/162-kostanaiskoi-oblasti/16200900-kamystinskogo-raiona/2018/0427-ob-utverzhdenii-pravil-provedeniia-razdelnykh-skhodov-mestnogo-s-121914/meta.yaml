  title:
    rus: О внесении изменения в решение маслихата от 27 апреля 2018 года № 163 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходах местного сообщества Камыстинского сельского округа Камыстинского района Костанайской области»
    kaz: Мәслихаттың 2018 жылғы 27 сәуірдегі № 163 «Қостанай облысы Қамысты ауданы Қамысты ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және ауылдардың жергілікті қоғамдастық жиындарына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгеріс енгізу туралы
