requisite: Решение маслихата Камыстинского района Костанайской области от 27 апреля 2018 года № 163. Зарегистрировано Департаментом юстиции Костанайской области 22 мая 2018 года № 7775. Утратило силу решением маслихата Камыстинского района Костанайской области от 29 августа 2023 года № 74 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходах местного сообщества сел Камыстинского сельского округа Камыстинского района Костанайской области
  kaz: Қостанай облысы Қамысты ауданы Қамысты ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және ауылдардың жергілікті қоғамдастық жиындарына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
