  title:
    rus: О внесении изменений в решение маслихата от 27 октября 2021 года № 66 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Камыстинском районе»
    kaz: Мәслихаттың 2021 жылғы 27 қазандағы № 66 «Қамысты ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
