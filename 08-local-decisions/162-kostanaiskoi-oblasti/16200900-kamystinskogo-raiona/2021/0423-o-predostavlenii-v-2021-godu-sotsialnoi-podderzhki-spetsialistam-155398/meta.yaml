act_code: '155398'
requisite: Решение маслихата Камыстинского района Костанайской области от 23 апреля 2021 года № 35. Зарегистрировано Департаментом юстиции Костанайской области 29 апреля 2021 года № 9886
title:
  rus: О предоставлении в 2021 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Камыстинского района
  kaz: Қамысты ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2021 жылы әлеуметтік қолдау көрсету туралы
