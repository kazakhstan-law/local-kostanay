  title:
    rus: О внесении изменений в решение маслихата от 23 апреля 2021 года № 36 «Об установлении специалистам в области здравоохранения, социального обеспечения, культуры и спорта, являющимся гражданскими служащими и работающим в сельской местности, повышенных на двадцать пять процентов должностных окладов и тарифных ставок по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях»
    kaz: Мәслихаттың 2021 жылғы 23 сәуірдегі № 36 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, мәдениет және спорт саласындағы мамандарға қызметтiң осы түрлерiмен қалалық жағдайда айналысатын азаматтық қызметшiлердiң айлықақыларымен және мөлшерлемелерімен салыстырғанда кемiнде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк мөлшерлемелерді белгілеу туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/210477/rus
