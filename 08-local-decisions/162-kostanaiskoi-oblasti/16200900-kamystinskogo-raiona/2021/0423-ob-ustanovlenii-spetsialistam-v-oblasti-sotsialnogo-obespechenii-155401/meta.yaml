act_code: '155401'
requisite: Решение маслихата Камыстинского района Костанайской области от 23 апреля 2021 года № 36. Зарегистрировано Департаментом юстиции Костанайской области 29 апреля 2021 года № 9887
title:
  rus: Об установлении специалистам в области социального обеспечения и культуры, являющимся гражданскими служащими и работающим в сельской местности, повышенных на двадцать пять процентов должностных окладов и тарифных ставок по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру және мәдениет саласындағы мамандарға қызметтiң осы түрлерiмен қалалық жағдайда айналысатын азаматтық қызметшiлердiң айлықақыларымен және мөлшерлемелерімен салыстырғанда кемiнде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк мөлшерлемелерді белгілеу туралы
