requisite: Решение маслихата Камыстинского района Костанайской области от 26 июля 2017 года № 104. Зарегистрировано Департаментом юстиции Костанайской области 16 августа 2017 года № 7164. Утратило силу решением маслихата Камыстинского района Костанайской области от 11 марта 2020 года № 307 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села для участия в сходах местного сообщества села Фрунзе Камыстинского района Костанайской области
  kaz: Қостанай облысы Қамысты ауданы Фрунзе ауылының бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиындарына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
