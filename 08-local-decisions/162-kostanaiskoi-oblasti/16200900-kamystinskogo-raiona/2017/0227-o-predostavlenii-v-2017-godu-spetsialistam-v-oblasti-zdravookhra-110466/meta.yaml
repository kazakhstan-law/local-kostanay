requisite: Решение маслихата Камыстинского района Костанайской области от 27 февраля 2017 года № 73. Зарегистрировано Департаментом юстиции Костанайской области 14 марта 2017 года № 6903
title:
  rus: О предоставлении в 2017 году специалистам в области здравоохранения, образования, социального  обеспечения, культуры, спорта и агропромышленного комплекса,прибывшим для работы и проживания в сельские населенные пункты, подъемного пособия и социальной поддержки для приобретения или строительства жилья
  kaz: Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2017 жылы көтерме жәрдемақы және тұрғын үй алу немесе салу үшін  әлеуметтік қолдау көрсету туралы
