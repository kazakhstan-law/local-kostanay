requisite: Решение маслихата Камыстинского района Костанайской области от 22 декабря 2015 года № 337. Зарегистрировано Департаментом юстиции Костанайской области 22 января 2016 года № 6163. Утратило силу решением маслихата Камыстинского района Костанайской области от 11 марта 2020 года № 307 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходах местного сообщества сел Жайылминского сельского округа Камыстинского района Костанайской области
  kaz: Қостанай облысы Қамысты ауданы Жайылма ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және ауылдардың жергілікті қоғамдастық жиындарына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
