requisite: Решение маслихата Камыстинского района Костанайской области от 22 декабря 2015 года № 336. Зарегистрировано Департаментом юстиции Костанайской области 22 января 2016 года № 6164. Утратило силу решением маслихата Камыстинского района Костанайской области от 27 апреля 2018 года № 163
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходах местного сообщества сел Свердловского сельского округа Камыстинского района Костанайской области
  kaz: Қостанай облысы Қамысты ауданы Свердлов ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және ауылдардың жергілікті қоғамдастық жиындарына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
