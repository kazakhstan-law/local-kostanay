requisite: Решение маслихата Камыстинского района Костанайской области от 22 декабря 2015 года № 338. Зарегистрировано Департаментом юстиции Костанайской области 22 января 2016 года № 6162. Утратило силу - решением маслихата Камыстинского района Костанайской области от 26 июля 2017 года № 104
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходах местного сообщества сел Богдановского сельского округа Камыстинского района Костанайской области
  kaz: Қостанай облысы Қамысты ауданы Богданов ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және ауылдардың жергілікті қоғамдастық жиындарына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
