requisite: Решение маслихата Камыстинского района Костанайской области от 22 декабря 2015 года № 410. Зарегистрировано Департаментом юстиции Костанайской области 22 января 2016 года № 6173. Утратило силу решением маслихата Камыстинского района Костанайской области от 11 марта 2020 года № 307 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села для участия в сходе местного сообщества села Ливановка Камыстинского района Костанайской области
  kaz: Қостанай облысы Қамысты ауданы Ливановка ауылының бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
