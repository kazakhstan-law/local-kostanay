requisite: Решение маслихата Камыстинского района Костанайской области от 22 декабря 2015 года № 404. Зарегистрировано Департаментом юстиции Костанайской области 22 января 2016 года № 6169. Утратило силу решением маслихата Камыстинского района Костанайской области от 29 августа 2023 года № 74 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села для участия в сходе местного сообщества села Бестобе Камыстинского района Костанайской области
  kaz: Қостанай облысы Қамысты ауданы Бестөбе ауылының жергілікті қоғамдастықтың бөлек жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
