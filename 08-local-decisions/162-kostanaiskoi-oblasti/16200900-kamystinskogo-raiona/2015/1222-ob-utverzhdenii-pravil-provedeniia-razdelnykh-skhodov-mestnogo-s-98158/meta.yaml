  title:
    rus: О внесении изменений в решение Камыстинского районного маслихата от 22 декабря 2015 года № 404 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села для участия в сходе местного сообщества села Бестобе Камыстинского района Костанайской области»
    kaz: Қамысты аудандық мәслихатының 2015 жылғы 22 желтоқсандағы № 404 «Қостанай облысы Қамысты ауданы Бестөбе ауылының бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
