requisite: Решение маслихата Узункольского района Костанайской области от 4 июня 2018 года № 207. Зарегистрировано Департаментом юстиции Костанайской области 19 июня 2018 года № 7866. Утратило силу решением маслихата Узункольского района Костанайской области от 17 января 2020 года № 343 (вводится в действие для сельского округа с численностью населения более двух тысяч человек с 1 января 2018 года и для сел, сельских округов с численностью населения две тысячи  и менее человек с 1 января 2020 года)
