requisite: Решение маслихата Узункольского района Костанайской области от 14 декабря 2007 года № 35. Зарегистрировано управлением юстиции Узункольского района Костанайской области 15 января 2008 года № 9-19-64. Утратило силу в связи с истечением срока применения - (письмо маслихата Узункольского района Костанайской области от 17 апреля 2013 года № 77)
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок гражданским служащим социального обеспечения, образования, культуры, работающим в аульной (сельской) местности
  kaz: Ауылдық (селолық) жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет саласының азаматтық қызметшілеріне, жиырма бес процентке жоғары лауазымдық жалақылар мен тарифтік ставкаларды белгілеу туралы
