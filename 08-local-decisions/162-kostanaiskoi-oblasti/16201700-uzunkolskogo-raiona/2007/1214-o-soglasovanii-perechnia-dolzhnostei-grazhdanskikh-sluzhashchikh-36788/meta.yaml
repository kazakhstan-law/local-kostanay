requisite: Решение маслихата Узункольского района Костанайской области от 14 декабря 2007 года № 36. Зарегистрировано Управлением юстиции Узункольского района Костанайской области 15 января 2008 года № 9-19-63. Утратило силу решением маслихата Узункольского района Костанайской области от 16 апреля 2008 года № 66
title:
  rus: О согласовании перечня должностей гражданских служащих социального обеспечения, образования, культуры, работающих в аульной (сельской) местности, имеющих право на повышенные на двадцать пять процентов должностные оклады и тарифные ставки
  kaz: Жиырма бес процентке жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар, ауылдық (селолық) жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет саласының азаматтық қызметшілер лауазымдарының тізбесін келістіру туралы
