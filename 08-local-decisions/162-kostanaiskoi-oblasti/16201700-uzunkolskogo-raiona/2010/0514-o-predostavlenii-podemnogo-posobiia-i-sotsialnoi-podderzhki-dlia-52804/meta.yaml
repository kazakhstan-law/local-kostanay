requisite: Решение маслихата Узункольского района Костанайской области от 14 мая 2010 года № 262. Зарегистрировано Управлением юстиции Узункольского района Костанайской области 1 июня 2010 года № 9-19-133. Утратило силу в связи с истечением срока применения - (письмо маслихата Узункольского района Костанайской области от 17 апреля 2013 года № 77)
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты района в 2010 году
  kaz: 2010 жылғы ауданның ауылдық елді мекендерге жұмыс істеуге және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына көтерме жәрдемақы және тұрғын үй сатып алу үшін әлеуметтік қолдау ұсыну туралы
