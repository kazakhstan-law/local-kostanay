requisite: Решение маслихата Узункольского района Костанайской области от 18 марта 2016 года № 413. Зарегистрировано Департаментом юстиции Костанайской области 12 апреля 2016 года № 6280. Утратило силу решением маслихата Узункольского района Костанайской области от 17 сентября 2018 года № 226
title:
  rus: Об установлении специалистам в области социального обеспечения, культуры, спорта и ветеринарии являющимся гражданскими служащими и работающим в сельской местности, повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға кемінде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
