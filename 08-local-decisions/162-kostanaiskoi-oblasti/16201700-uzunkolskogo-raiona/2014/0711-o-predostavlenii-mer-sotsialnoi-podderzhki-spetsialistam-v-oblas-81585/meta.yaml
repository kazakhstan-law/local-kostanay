act_code: '81585'
requisite: Решение маслихата Узункольского района Костанайской области от 11 июля 2014 года № 206. Зарегистрировано Департаментом юстиции Костанайской области 24 июля 2014 года № 4957. Утратило силу в связи с истечением срока действия (письмо маслихата Узункольского района Костанайской области от 9 января 2015 года № 5)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Узункольского района на 2014 год
  kaz: Ұзынкөл ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2014 жылға әлеуметтік қолдау шараларын ұсыну туралы
