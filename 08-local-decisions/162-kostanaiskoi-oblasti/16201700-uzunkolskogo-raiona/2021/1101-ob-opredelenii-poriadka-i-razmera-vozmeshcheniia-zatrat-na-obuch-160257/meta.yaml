  title:
    rus: О внесении изменений в решение Узункольского районного маслихата от 1 ноября 2021 года № 70 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Узункольском районе»
    kaz: Ұзынкөл аудандық мәслихаттың 2021 жылғы 1 қарашадағы № 70 «Ұзынкөл ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсалған шығындарын өндіріп алу мөлшері мен тәртібін айқындау туралы» шешіміне өзгерістер енгізу туралы
