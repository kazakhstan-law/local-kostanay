requisite: Решение маслихата Узункольского района Костанайской области от 24 декабря 2021 года № 91. Отменено решением маслихата Узункольского района Костанайской области от 24 августа 2023 года № 36 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Пресногорьковского сельского округа Узункольского района Костанайской области
  kaz: Қостанай облысы Ұзынкөл ауданы Пресногорьков ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
