  title:
    rus: О внесении изменений в решение маслихата от 12 февраля 2021 года № 13 «Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, культуры и спорта, являющимся гражданскими служащими и работающим в сельской местности»
    kaz: Мәслихаттың 2021 жылғы 12 ақпандағы № 13 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, мәдениет және спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерді белгілеу туралы» шешіміне өзгерістер енгізу туралы
