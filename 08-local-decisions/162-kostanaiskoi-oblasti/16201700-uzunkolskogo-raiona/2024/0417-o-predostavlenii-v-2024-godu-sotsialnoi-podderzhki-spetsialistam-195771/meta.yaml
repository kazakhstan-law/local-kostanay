act_code: '195771'
requisite: Решение маслихата Узункольского района Костанайской области от 17 апреля 2024 года № 84
title:
  rus: О предоставлении в 2024 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Узункольского района
  kaz: Ұзынкөл ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2024 жылы әлеуметтік қолдау көрсету туралы
