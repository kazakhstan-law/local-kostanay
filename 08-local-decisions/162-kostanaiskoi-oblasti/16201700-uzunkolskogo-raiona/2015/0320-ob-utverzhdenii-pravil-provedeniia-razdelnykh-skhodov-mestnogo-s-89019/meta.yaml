requisite: Решение маслихата Узункольского района Костанайской области от 20 марта 2015 года № 289. Зарегистрировано Департаментом юстиции Костанайской области 24 апреля 2015 года № 5540. Утратило силу решением маслихата Узункольского района Костанайской области от 3 марта 2020 года № 348 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Федоровского сельского округа Узункольского района Костанайской области
  kaz: Қостанай облысы Ұзынкөл ауданы Федоров ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
