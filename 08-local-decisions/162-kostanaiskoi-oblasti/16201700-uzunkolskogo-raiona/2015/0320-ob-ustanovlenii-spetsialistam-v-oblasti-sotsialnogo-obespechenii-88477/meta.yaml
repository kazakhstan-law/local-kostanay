act_code: '88477'
requisite: Решение маслихата Узункольского района Костанайской области от 20 марта 2015 года № 270. Зарегистрировано Департаментом юстиции Костанайской области 7 апреля 2015 года № 5504. Утратило силу решением маслихата Узункольского района Костанайской области от 10 февраля 2016 года № 391
title:
  rus: Об установлении специалистам в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности, повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға кемінде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік ставкалар белгілеу туралы
