requisite: Решение маслихата Узункольского района Костанайской области от 16 апреля 2015 года № 300. Зарегистрировано Департаментом юстиции Костанайской области 4 мая 2015 года № 5582
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Узункольского района на 2015 год
  kaz: Ұзынкөл ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2015 жылға әлеуметтiк қолдау шараларын ұсыну туралы
