requisite: Решение маслихата Узункольского района Костанайской области от 20 марта 2015 года № 280. Зарегистрировано Департаментом юстиции Костанайской области 27 апреля 2015 года № 5544. Утратило силу решением маслихата Узункольского района Костанайской области от 24 января 2022 года № 100 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Кировского сельского округа Узункольского района Костанайской области
