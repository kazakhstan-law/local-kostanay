title:
  rus: О признании утратившим силу решения маслихата Узункольского района Костанайской области от 19 марта 2018 года № 190 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат Узункольского районного маслихата»
  kaz: «Ұзынкөл аудандық мәслихатының аппараты» мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» Қостанай облысы Ұзынкөл ауданы мәслихатының 2018 жылғы 19 наурыздағы № 190 шешімінің күшін жою туралы
