act_code: '67599'
requisite: Решение маслихата Узункольского района Костанайской области от 29 августа 2012 года № 54. Зарегистрировано Департаментом юстиции Костанайской области 13 сентября 2012 года № 3831. Утратило силу в связи с истечением срока применения - (письмо маслихата Узункольского района Костанайской области от 17 апреля 2013 года № 77)
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты района на 2012 год
  kaz: Ауданның ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2012 жылға әлеуметтік қолдау шараларын ұсыну туралы
