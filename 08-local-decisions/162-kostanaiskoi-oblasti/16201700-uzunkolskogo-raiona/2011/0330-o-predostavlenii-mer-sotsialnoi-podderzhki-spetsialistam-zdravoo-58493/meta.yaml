requisite: Решение маслихата Узункольского района Костанайской области от 30 марта 2011 года № 368. Зарегистрировано Управлением юстиции Узункольского района Костанайской области 22 апреля 2011 года № 9-19-153. Утратило силу в связи с истечением срока применения - (письмо маслихата Узункольского района Костанайской области от 17 апреля 2013 года № 77)
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты района на 2011 год
