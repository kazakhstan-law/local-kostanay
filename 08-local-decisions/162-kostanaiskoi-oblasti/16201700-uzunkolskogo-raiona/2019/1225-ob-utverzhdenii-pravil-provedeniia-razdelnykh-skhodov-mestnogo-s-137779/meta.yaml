requisite: Решение маслихата Узункольского района Костанайской области от 25 декабря 2019 года № 332. Зарегистрировано Департаментом юстиции Костанайской области 31 декабря 2019 года № 8859. Утратило силу решением маслихата Узункольского района Костанайской области от 24 января 2022 года № 100 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества сельского округа Обаған Узункольского района Костанайской области
  kaz: Қостанай облысы Ұзынкөл ауданы Обаған ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
