requisite: Решение маслихата Узункольского района Костанайской области от 17 мая 2019 года № 282. Зарегистрировано Департаментом юстиции Костанайской области 22 мая 2019 года № 8462
title:
  rus: О предоставлении в 2019 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Узункольского района
  kaz: 2019 жылы Ұзынкөл ауданының ауылдық елді мекендеріне жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтiк қолдау шараларын көрсету туралы
