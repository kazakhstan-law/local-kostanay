requisite: Решение маслихата Узункольского района Костанайской области от 26 августа 2009 года № 203. Зарегистрировано Управлением юстиции Узункольского района Костанайской области 16 сентября 2009 года № 9-19-111. Утратило силу в связи с истечением срока применения - (письмо маслихата Узункольского района Костанайской области от 17 апреля 2013 года № 77)
title:
