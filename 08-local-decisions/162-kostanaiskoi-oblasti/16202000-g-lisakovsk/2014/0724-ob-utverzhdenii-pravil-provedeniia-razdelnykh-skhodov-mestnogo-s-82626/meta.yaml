    kaz: Мәслихаттың 2014 жылғы 24 шілдедегі № 236 «Қостанай облысы Лисаков қаласы Октябрь кентінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін көшелер тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгеріс енгізу туралы
