title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей улиц для участия в сходе местного сообщества поселка Октябрьский города Лисаковска Костанайской области
  kaz: Қостанай облысы Лисаков қаласы Октябрь кентінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін көшелер тұрғындары өкілдерінің сандық құрамын бекіту туралы
