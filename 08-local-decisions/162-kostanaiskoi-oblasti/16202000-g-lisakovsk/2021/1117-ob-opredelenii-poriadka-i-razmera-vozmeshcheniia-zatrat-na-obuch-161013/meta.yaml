  title:
    rus: О внесении изменений в решение маслихата от 17 ноября 2021 года № 82 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в городе Лисаковске»
    kaz: Мәслихаттың 2021 жылғы 17 қарашадағы № 82 «Лисаков қаласында жеке оқыту жоспары бойынша мүгедектер қатарындағы кемтар балаларды үйде оқытуға жұмсалған шығындарды өтеу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
