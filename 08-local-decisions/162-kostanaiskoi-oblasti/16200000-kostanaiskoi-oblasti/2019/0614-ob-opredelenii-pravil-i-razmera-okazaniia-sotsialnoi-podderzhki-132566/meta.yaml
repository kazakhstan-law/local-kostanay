requisite: Решение маслихата Костанайской области от 14 июня 2019 года № 407. Зарегистрировано Департаментом юстиции Костанайской области 20 июня 2019 года № 8544. Утратило силу решением маслихата Костанайской области от 9 октября 2020 года № 543 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении Правил и размера оказания социальной поддержки медицинским и фармацевтическим работникам, направленным для работы в сельскую местность Костанайской области, за счет средств областного бюджета
  kaz: Қостанай облысының ауылдық жеріне жұмысқа жіберілген медицина және фармацевтика қызметкерлеріне облыстық бюджет қаражаты есебінен әлеуметтік қолдау көрсетудің қағидалары мен мөлшерлерін айқындау туралы
