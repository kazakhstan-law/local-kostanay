act_code: '137639'
requisite: Решение маслихата Костанайской области от 24 декабря 2019 года № 466. Зарегистрировано Департаментом юстиции Костанайской области 30 декабря 2019 года № 8849
title:
  rus: Об утверждении Правил о порядке и условиях размещения наружной (визуальной) рекламы на открытом пространстве за пределами помещений в населенных пунктах, в полосе отвода автомобильных дорог общего пользования, на открытом пространстве за пределами помещений вне населенных пунктов и вне полосы отвода автомобильных дорог общего пользования по Костанайской области
  kaz: Сыртқы (көрнекі) жарнаманы Қостанай облысының елді мекендердегі үй-жайлардың шегінен тыс ашық кеңістікте, жалпыға ортақ пайдаланылатын автомобиль жолдарының бөлінген белдеуінде, елді мекендерден тыс жердегі үй-жайлардың шегінен тыс ашық кеңістікте және жалпыға ортақ пайдаланылатын автомобиль жолдарының бөлінген белдеуінен тыс жерде орналастыру тәртібі мен шарттары туралы қағидаларды бекіту туралы
