requisite: Решение акима Костанайской области от 9 декабря 1999 года № 250. Зарегистрировано Управлением юстиции Костанайской области 27 декабря 1999 года № 156.  Утратило силу решением акима Костанайской области от 9 декабря 2004 года № 53
title:
  rus: О реализации постановления Правительства Республики Казахстан от 7 сентября 1999 года № 1318 «О реализации Закона Республики Казахстан «Об амнистии в связи с Годом единства и преемственности поколений» в части адаптации амнистированных лиц»
  kaz: «Кешірім жасалған тұлғалардың бейімделу бөлігінде ұрпақтар бірлігі мен сабақтастығы жылына байланысты кешірім жасау» жөніндегі Қазақстан Республикасының Заңын жүзеге асыру туралы» Қазақстан Республикасы Үкіметінің 1999 жылғы 7 қыркүйектегі № 1318 қаулысын жүзеге асыру туралы
