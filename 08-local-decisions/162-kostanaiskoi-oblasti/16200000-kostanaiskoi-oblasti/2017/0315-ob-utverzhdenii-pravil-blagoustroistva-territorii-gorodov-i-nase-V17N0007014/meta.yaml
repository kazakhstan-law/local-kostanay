    kaz: Мәслихаттың 2017 жылғы 15 наурыздағы № 130 «Қостанай облысының қалалары мен елдi мекендерiнiң жасыл екпелерiн күтiп-ұстау және қорғау қағидаларын, аумақтарын абаттандыру қағидаларын бекiту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
