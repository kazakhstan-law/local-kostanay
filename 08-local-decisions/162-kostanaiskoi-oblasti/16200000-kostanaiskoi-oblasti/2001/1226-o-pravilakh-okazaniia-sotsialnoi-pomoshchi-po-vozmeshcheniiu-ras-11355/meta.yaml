title:
  rus: О Правилах оказания социальной помощи по возмещению расходов, связанных с проездом больных, направленных на лечение в лечебно-профилактические и другие учреждения здравоохранения за пределы территории Костанайской области по Республике  Казахстан
  kaz: Қазақстан Республикасы бойынша Қостанай облысы аумағынан тыс жерлерге емдеу-сауықтыру және басқа денсаулық сақтау мекемелеріне жіберілген ауруларға жол шығынын өтеу жөнінде әлеуметтік көмек көрсетудін Ережесі туралы
