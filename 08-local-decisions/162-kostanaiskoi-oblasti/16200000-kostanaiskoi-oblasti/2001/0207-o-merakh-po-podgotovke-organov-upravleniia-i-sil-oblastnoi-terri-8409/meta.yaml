act_code: '8409'
requisite: Решение акима Костанайской области от 7 февраля 2001 года № 32. Зарегистрировано Управлением юстиции Костанайской области 7 марта 2001 года № 645.  Прекратил действие в связи с истечением срока применения - письмо руководителя аппарата акима Костанайской области от 11 декабря 2006 года № 08-3/3087
title:
  rus: О мерах по подготовке органов управления и сил областной территориальной подсистемы государственной системы предупреждения и ликвидации чрезвычайных ситуаций и населения к действиям в чрезвычайных ситуациях на 2001 год
  kaz: Төтенше жағдайлардың алдын алу және жоюдың мемлекеттік жүйесінің басқару органдары мен облыстық аумақтық қосалқы жүйелерінің күштерін және халықты 2001 жылғы төтенше жағдайлардағы іс-қимылдарға даярлау жөніндегі шаралар туралы
