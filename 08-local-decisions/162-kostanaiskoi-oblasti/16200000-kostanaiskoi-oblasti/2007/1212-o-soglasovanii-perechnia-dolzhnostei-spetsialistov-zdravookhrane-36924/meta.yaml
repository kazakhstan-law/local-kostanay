act_code: '36924'
requisite: Решение Костанайского областного маслихата от 12 декабря 2007 года № 29. Зарегистрировано Департаментом юстиции Костанайской области 8 января 2008 года № 3585. Утратило силу решением Костанайского областного маслихата от 16 февраля 2008 года № 74
title:
  rus: О согласовании перечня должностей специалистов здравоохранения, социального обеспечения, образования, культуры и спорта, работающих в аульной (сельской) местности, имеющих право на повышенные на двадцать пять процентов должностные оклады и тарифные ставки
  kaz: Жиырма бес процентке жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар, ауылдық (селолық) жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт мамандары лауазымдарының тізбесін келістіру туралы
