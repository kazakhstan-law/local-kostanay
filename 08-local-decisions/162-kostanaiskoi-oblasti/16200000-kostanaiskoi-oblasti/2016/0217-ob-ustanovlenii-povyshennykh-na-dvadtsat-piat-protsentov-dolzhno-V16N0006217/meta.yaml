  title:
    rus: О внесении изменений в решение маслихата от 17 февраля 2016 года № 502 «Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры и лесного хозяйства, являющимся гражданскими служащими и работающим в сельской местности»
    kaz: Мәслихаттың 2016 жылғы 17 ақпандағы № 502 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және орман шаруашылығы саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк мөлшерлемелерді белгілеу туралы» шешіміне өзгерістер енгізу туралы
