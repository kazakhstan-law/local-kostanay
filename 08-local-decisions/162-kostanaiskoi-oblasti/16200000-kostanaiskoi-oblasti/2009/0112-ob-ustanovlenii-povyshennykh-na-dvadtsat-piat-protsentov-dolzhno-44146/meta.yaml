requisite: Решение маслихата Костанайской области от 12 января 2009 года № 158. Зарегистрировано Департаментом юстиции Костанайской области 12 февраля 2009 года № 3668. Утратило силу решением маслихата Костанайской области от 31 июля 2015 года № 422
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок гражданским служащим здравоохранения, социального обеспечения, образования, культуры и спорта, работающим в сельской местности
  kaz: Ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласының азаматтық қызметшілеріне жиырма бес процентке жоғары лауазымдық жалақылар мен тарифтік ставкаларды белгілеу туралы
