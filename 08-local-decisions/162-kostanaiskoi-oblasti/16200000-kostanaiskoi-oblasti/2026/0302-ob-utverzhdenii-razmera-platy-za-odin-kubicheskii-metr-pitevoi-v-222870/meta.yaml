title:
  rus: Об утверждении размера платы за один кубический метр питьевой воды, поданной из систем водоснабжения, включенных в перечень систем водоснабжения, стоимость услуг по подаче питьевой воды которых подлежит субсидированию в Костанайской области
  kaz: Қостанай облысында ауыз суды беру жөніндегі қызметтердің құны субсидиялауға жататын сумен жабдықтау жүйелерінің тізбесіне енгізілген сумен жабдықтау жүйелерінен берілген ауыз судың бір текше метріне төленетін төлемақының мөлшерін бекіту туралы
