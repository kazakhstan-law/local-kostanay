  kaz: Қазақстан Республикасы бойынша Қостанай облысы аумағынан тыс жерлерге емдеу-профилактикалық және басқа денсаулық сақтау мекемелеріне жіберген азаматтарға тегін немесе жеңілдікпен жол жүрулеріне көмек көрсету туралы
