title:
  rus: Об определении Правил и размера оказания социальной поддержки медицинских и фармацевтических работников, направленных для работы в сельской местности и поселках, городах районного и областного значения Костанайской области, за счет средств областного бюджета
  kaz: Қостанай облысының ауылдық жеріне және кенттеріне, аудандық және облыстық маңызы бар қалаларына жұмысқа жіберілген медицина және фармацевтика қызметкерлеріне облыстық бюджет қаражаты есебінен әлеуметтік қолдау көрсетудің қағидалары мен мөлшерін айқындау туралы
