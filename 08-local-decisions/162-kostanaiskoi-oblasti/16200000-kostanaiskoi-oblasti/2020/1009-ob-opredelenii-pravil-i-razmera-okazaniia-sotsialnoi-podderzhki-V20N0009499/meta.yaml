    kaz: Мәслихаттың 2020 жылғы 9 қазандағы № 543 «Қостанай облысының ауылдық жеріне және кенттеріне, аудандық және облыстық маңызы бар қалаларына жұмысқа жіберілген медицина және фармацевтика қызметкерлеріне облыстық бюджет қаражаты есебінен әлеуметтік қолдау көрсетудің қағидалары мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
