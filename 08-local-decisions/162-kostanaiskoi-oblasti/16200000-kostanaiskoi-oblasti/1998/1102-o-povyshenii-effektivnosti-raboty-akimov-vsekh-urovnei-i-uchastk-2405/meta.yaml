title:
  rus: О повышении эффективности работы акимов всех уровней и участковых инспекторов полиции органов внутренних дел области в организации борьбы с преступностью и укреплению правопорядка на подведомственных территориях
  kaz: Қылмыспен күресті үйымдастыру және ведомстволык бағыныштағы аумақтарында қүқык тәртібін нығайтудағы барлық денгейдегі әкімдер мен облыстың ішкі істер органдары полициясының учаскелік инспекторларының жұмыс тиімділігін арттыру туралы
