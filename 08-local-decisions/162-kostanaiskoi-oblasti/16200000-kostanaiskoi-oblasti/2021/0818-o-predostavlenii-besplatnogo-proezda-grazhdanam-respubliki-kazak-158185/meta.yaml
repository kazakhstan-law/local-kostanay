act_code: '158185'
requisite: Решение маслихата Костанайской области от 18 августа 2021 года № 81. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 августа 2021 года № 24137
title:
  rus: О предоставлении бесплатного проезда гражданам Республики Казахстан проживающим в Костанайской области за пределы населенного пункта постоянного проживания для получения высокотехнологичных медицинских услуг в рамках гарантированного объема бесплатной медицинской помощи и (или) медицинской помощи в системе обязательного социального медицинского страхования
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде жоғары технологиялық медициналық көрсетілетін қызметтерді және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмекті алу үшін Қостанай облысында тұратын Қазақстан Республикасының азаматтарына тұрақты тұратын елді мекеннен тысқары жерлерге тегін жол жүруді ұсыну туралы
