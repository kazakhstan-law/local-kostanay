  title:
    rus: О внесении дополнений в решение маслихата от 9 июля 2021 года № 75 «О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан Республики Казахстан при амбулаторном лечении бесплатно»
    kaz: Мәслихаттың 2021 жылғы 9 шілдедегі № 75 «Қазақстан Республикасы азаматтарының жекелеген санаттарына амбулаториялық емдеу кезінде тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, арнайы емдік өнімдерді, медициналық бұйымдарды қосымша беру туралы» шешіміне толықтырулар енгізу туралы
