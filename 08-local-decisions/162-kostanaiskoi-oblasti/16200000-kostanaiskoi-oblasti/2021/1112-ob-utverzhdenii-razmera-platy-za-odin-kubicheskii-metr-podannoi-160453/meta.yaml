  title:
    rus: О внесении изменения в решение Костанайского областного маслихата от 12 ноября 2021 года № 117 «Об утверждении размера платы за один кубический метр поданной питьевой воды населению из особо важных групповых и локальных систем водоснабжения, являющихся безальтернативными источниками питьевого водоснабжения в Костанайской области»
    kaz: Қостанай облыстық мәслихатының 2021 жылғы 12 қарашадағы № 117 «Қостанай облысында ауызсумен жабдықтаудың баламасыз көздері болып табылатын сумен жабдықтаудың ерекше маңызды топтық және оқшау жүйелерінен халыққа берілген ауызсудың бір текше метрі үшін төлемақы мөлшерін бекіту туралы» шешіміне өзгеріс енгізу туралы
