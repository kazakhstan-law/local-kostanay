act_code: '160453'
requisite: Решение маслихата Костанайской области от 12 ноября 2021 года № 117. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 ноября 2021 года № 25291. Утратило силу решением маслихата Костанайской области от 2 марта 2026 года № 273 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении размера платы за один кубический метр поданной питьевой воды населению из особо важных групповых и локальных систем водоснабжения, являющихся безальтернативными источниками питьевого водоснабжения в Костанайской области
  kaz: Қостанай облысында ауызсумен жабдықтаудың баламасыз көздері болып табылатын сумен жабдықтаудың ерекше маңызды топтық және оқшау жүйелерінен халыққа берілген ауызсудың бір текше метрі үшін төлемақы мөлшерін бекіту туралы
