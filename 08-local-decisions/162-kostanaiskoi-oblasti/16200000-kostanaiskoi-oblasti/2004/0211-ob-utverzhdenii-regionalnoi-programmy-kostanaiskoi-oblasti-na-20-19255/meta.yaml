requisite: Решение маслихата Костанайской области от 11 февраля 2004 года № 33. Зарегистрировано Управлением юстиции Костанайской области 15 марта 2004 года № 2811. Прекратило действие в связи с истечением срока применения - письмо секретаря маслихата Костанайской области от 1 июня 2007 года № 313
title:
