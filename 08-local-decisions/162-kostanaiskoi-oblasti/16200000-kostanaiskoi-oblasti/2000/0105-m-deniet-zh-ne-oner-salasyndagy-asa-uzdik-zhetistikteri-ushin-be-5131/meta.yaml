requisite: Қостанай облысы әкімінің 2000 жылғы 5 қаңтардағы № 1 шешімі. Қостанай облысының Әділет басқармасында 2000 жылғы 13 қаңтарда № 169 болып тіркелді. Қабылданған мерзімінің өтуіне байланысты қолданылуы тоқтатылды - Қостанай облысы әкімінің аппарат басшысының 2007 жылғы 24 сәуірдегі № 08-3/1038 хаты
