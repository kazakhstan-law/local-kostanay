  kaz: Қостанай облыстық мәслихаты 2000 жылғы 14 маусымдағы (2 шақырылған кезектен тыс сессиясының) "2000 жылға арналған Қостанай облысының облыстық бюджетiне өзгертулер мен толықтырулар енгiзу туралы" шешiмiн iске асыру туралы
