requisite: Решение акима Костанайской области от 3 июля 2000 года № 138. Зарегистрировано управлением юстиции Костанайской области 14 июля 2000 года за № 343. Утратило силу в связи с истечением срока применения - письмо акимата Костанайской области от 10 ноября 2010 года № 08-08/3045
title:
