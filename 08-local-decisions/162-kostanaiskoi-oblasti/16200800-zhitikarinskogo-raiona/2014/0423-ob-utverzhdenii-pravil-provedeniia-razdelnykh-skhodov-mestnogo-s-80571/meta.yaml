title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села для участия в сходе местного сообщества села Милютинка Житикаринского района Костанайской области
  kaz: Қостанай облысы Жітіқара ауданы Милютин ауылының жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
