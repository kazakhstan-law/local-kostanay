  title:
    rus: О внесении изменения в решение маслихата от 23 апреля 2014 года № 226 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села для участия в сходе местного сообщества села Милютинка Житикаринского района Костанайской области»
    kaz: Мәслихаттың 2014 жылғы 23 сәуірдегі № 226 «Қостанай облысы Жітіқара ауданы Милютин ауылының бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгеріс енгізу туралы
