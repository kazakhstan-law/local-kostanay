requisite: Решение маслихата Житикаринского района Костанайской области от 23 апреля 2014 года № 231. Зарегистрировано Департаментом юстиции Костанайской области 3 июня 2014 года № 4797. Утратило силу решением маслихата Житикаринского района Костанайской области от 17 октября 2017 года № 144
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села для участия в сходе местного сообщества села Тимирязево Житикаринского района Костанайской области
  kaz: Қостанай облысы Жітіқара ауданы Тимирязев ауылының бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
