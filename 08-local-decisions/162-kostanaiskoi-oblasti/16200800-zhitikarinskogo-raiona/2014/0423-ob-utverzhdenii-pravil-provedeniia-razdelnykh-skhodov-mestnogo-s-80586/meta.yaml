act_code: '80586'
requisite: Решение маслихата Житикаринского района Костанайской области от 23 апреля 2014 года № 221. Зарегистрировано Департаментом юстиции Костанайской области 3 июня 2014 года № 4801. Утратило силу решением маслихата Житикаринского района Костанайской области от 30 ноября 2023 года № 84 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей города для участия в сходе местного сообщества города Житикара Житикаринского района Костанайской области
  kaz: Қостанай облысы Жітіқара ауданы Жітіқара қаласы жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және қатысу үшін қала тұрғындары өкілдерінің сандық құрамын бекіту туралы
