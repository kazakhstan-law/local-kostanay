  title:
    rus: О внесении изменений в решение маслихата от 23 апреля 2014 года № 221 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей улиц, многоквартирных жилых домов для участия в сходе местного сообщества города Житикары Житикаринского района Костанайской области»
    kaz: Мәслихаттың 2014 жылғы 23 сәуірдегі № 221 «Қостанай облысы Жітіқара ауданы Жітіқара қаласының бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін көшелер, көппәтерлі тұрғын үйлер тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
