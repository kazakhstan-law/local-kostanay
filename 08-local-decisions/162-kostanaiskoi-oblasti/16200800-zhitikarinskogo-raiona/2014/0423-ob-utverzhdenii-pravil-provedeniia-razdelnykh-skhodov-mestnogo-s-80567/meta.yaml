  title:
    rus: О внесении изменений в решение маслихата от 23 апреля 2014 года № 229 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села для участия в сходе местного сообщества села Пригородное Житикаринского района Костанайской области»
    kaz: Мәслихаттың 2014 жылғы 23 сәуірдегі № 229 «Қостанай облысы Жітіқара ауданы Пригородный ауылының бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
