requisite: Решение маслихата Житикаринского района Костанайской области от 19 марта 2014 года № 204. Зарегистрировано Департаментом юстиции Костанайской области 18 апреля 2014 года № 4625. Прекращено действие по истечении срока, на который решение было принято - (письмо Аппарата Житикаринского районного маслихата Костанайской области от 20 февраля 2015 года № 49)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты на 2014 год
  kaz: Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2014 жылға әлеуметтік қолдау шараларын ұсыну туралы
