  title:
    rus: О внесении изменений в решение маслихата от 23 апреля 2014 года № 223 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Большевистского сельского округа Житикаринского района Костанайской области»
    kaz: Мәслихаттың 2014 жылғы 23 сәуірдегі № 223 «Қостанай облысы Жітіқара ауданы Большевик ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
