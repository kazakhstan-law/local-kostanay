requisite: Решение маслихата Житикаринского района Костанайской области от 17 октября 2017 года № 144. Зарегистрировано Департаментом юстиции Костанайской области 13 ноября 2017 года № 7299. Утратило силу решением маслихата Житикаринского района Костанайской области от 27 февраля 2020 года № 385 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Тимирязевского сельского округа Житикаринского района Костанайской области
  kaz: Қостанай облысы Жітіқара ауданы Тимирязев ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
