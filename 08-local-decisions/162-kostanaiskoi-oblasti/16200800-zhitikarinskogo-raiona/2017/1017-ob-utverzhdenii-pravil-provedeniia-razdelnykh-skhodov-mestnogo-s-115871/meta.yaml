requisite: Решение маслихата Житикаринского района Костанайской области от 17 октября 2017 года № 145. Зарегистрировано Департаментом юстиции Костанайской области 13 ноября 2017 года № 7300. Утратило силу решением маслихата Житикаринского района Костанайской области от 27 февраля 2020 года № 385 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села для участия в сходе местного сообщества села Муктиколь Житикаринского района Костанайской области
  kaz: Қостанай облысы Жітіқара ауданы Мүктікөл ауылының бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
