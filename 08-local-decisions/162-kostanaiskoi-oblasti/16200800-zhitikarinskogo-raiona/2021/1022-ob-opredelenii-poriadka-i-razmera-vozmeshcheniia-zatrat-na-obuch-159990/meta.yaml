  title:
    rus: О внесении изменений в решение Житикаринского районного маслихата от 22 октября 2021 года № 71 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа лиц с инвалидностью по индивидуальному учебному плану в Житикаринском районе»
    kaz: Жітіқара аудандық мәслихатының 2021 жылғы 22 қазандағы № 71 «Жітіқара ауданында мүгедектігі бар адамдар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі және мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
