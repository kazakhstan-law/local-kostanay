act_code: '139238'
requisite: Решение маслихата Житикаринского района Костанайской области от 28 января 2020 года № 381. Зарегистрировано Департаментом юстиции Костанайской области 31 января 2020 года № 8939. Утратило силу решением маслихата Житикаринского района Костанайской области от 23 октября 2020 года № 444 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении в 2020 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Житикаринского района
  kaz: Жітіқара ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы әлеуметтік қолдау көрсету туралы
