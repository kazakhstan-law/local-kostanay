act_code: '143912'
requisite: Решение маслихата Житикаринского района Костанайской области от 8 июня 2020 года № 414. Зарегистрировано Департаментом юстиции Костанайской области 18 июня 2020 года № 9275. Утратило силу решением маслихата Житикаринского района Костанайской области от 14 мая 2021 года № 45 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении специалистам в области здравоохранения, социального обеспечения, образования, культуры и спорта, являющимся гражданскими служащими и работающим в сельской местности, повышенных на двадцать пять процентов должностных окладов и тарифных ставок
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерді белгілеу туралы
