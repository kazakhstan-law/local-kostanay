  title:
    rus: О внесении изменений в решение маслихата от 9 апреля 2020 года № 394 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Муктикольского сельского округа Житикаринского района Костанайской области»
    kaz: Мәслихаттың 2020 жылғы 9 сәуірдегі № 394 «Қостанай облысы Жітіқара ауданы Мүктікөл ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
