requisite: Решение маслихата Житикаринского района Костанайской области от 9 апреля 2020 года № 394. Зарегистрировано Департаментом юстиции Костанайской области 15 апреля 2020 года № 9120. Утратило силу решением маслихата Житикаринского района Костанайской области от 30 ноября 2023 года № 84 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
