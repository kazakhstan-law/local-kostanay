act_code: '87520'
requisite: Решение маслихата Житикаринского района Костанайской области от 19 февраля 2015 года № 294. Зарегистрировано Департаментом юстиции Костанайской области 10 марта 2015 года № 5403. Утратило силу в связи с истечением срока действия (письмо маслихата Житикаринского района Костанайской области от 14 января 2016 года № 02-32/18)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты на 2015 год
  kaz: Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2015 жылға әлеуметтік қолдау шараларын ұсыну туралы
