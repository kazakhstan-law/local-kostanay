act_code: '133998'
requisite: Решение маслихата Житикаринского района Костанайской области от 9 августа 2019 года № 329. Зарегистрировано Департаментом юстиции Костанайской области 14 августа 2019 года № 8620
title:
  rus: О предоставлении в 2019 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Житикаринского района
  kaz: Жітіқара ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылы әлеуметтік қолдау шараларын көрсету туралы
