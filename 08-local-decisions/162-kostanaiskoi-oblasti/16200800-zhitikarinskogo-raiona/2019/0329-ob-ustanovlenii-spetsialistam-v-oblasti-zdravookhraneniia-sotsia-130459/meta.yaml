act_code: '130459'
requisite: Решение маслихата Житикаринского района Костанайской области от 29 марта 2019 года № 284. Зарегистрировано Департаментом юстиции Костанайской области 15 апреля 2019 года № 8353. Утратило силу решением маслихата Житикаринского района Костанайской области от 8 июня 2020 года № 414 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности, повышенных на двадцать пять процентов должностных окладов и тарифных ставок
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерді белгілеу туралы
