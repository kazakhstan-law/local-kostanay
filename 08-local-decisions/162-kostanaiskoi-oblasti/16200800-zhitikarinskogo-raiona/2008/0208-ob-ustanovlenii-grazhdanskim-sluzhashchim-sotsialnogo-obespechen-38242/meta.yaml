act_code: '38242'
requisite: Решение маслихата Житикаринского района Костанайской области от 8 февраля 2008 года № 54. Зарегистрировано Управлением юстиции Житикаринского района Костанайской области 7 марта 2008 года № 9-10-93
title:
  rus: Об установлении гражданским служащим социального обеспечения, образования, работающим в аульной (сельской) местности, повышения на двадцать пять процентов должностных окладов и тарифных ставок по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях, за счёт средств районного бюджета
  kaz: Ауылдық (селолық) жерлерде жұмыс істейтіндердің лауазымдық жалақылары мен тарифтік ставкілері теңестіріліп, аудандық бюджет қаржысы есебінен қызметтің осы түрлерімен айналысушы қала жағдайында өмір сүретін әлеуметтік қамтамасыз ету, білім беру салаларындағы қызметші азаматтардың жалақыларын жиырма бес пайызға көтеруді белгілеу туралы
