act_code: '71609'
requisite: Решение маслихата Житикаринского района Костанайской области от 18 февраля 2013 года № 103. Зарегистрировано Департаментом юстиции Костанайской области 14 марта 2013 года № 4063. Утратило силу в связи с истечением срока применения - (письмо маслихата Житикаринского района Костанайской области от 31 января 2014 года № 02-32/34)
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты района на 2013 год
  kaz: Ауданның ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2013 жылға әлеуметтік қолдау шараларын ұсыну туралы
