act_code: '102453'
requisite: Решение маслихата Житикаринского района Костанайской области от 28 апреля 2016 года № 26. Зарегистрировано Департаментом юстиции Костанайской области 20 мая 2016 года № 6393. Утратило силу решением маслихата Житикаринского района Костанайской области от 29 марта 2019 года № 284 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении специалистам в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности, повышенных на двадцать пять процентов должностных окладов и тарифных ставок
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерді белгілеу туралы
