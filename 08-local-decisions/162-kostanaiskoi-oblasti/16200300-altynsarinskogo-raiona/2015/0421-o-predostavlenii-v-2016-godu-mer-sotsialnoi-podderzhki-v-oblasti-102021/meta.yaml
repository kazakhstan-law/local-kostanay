requisite: Решение маслихата Алтынсаринского района Костанайской области от 21 апреля 2016 года № 22. Зарегистрировано Департаментом юстиции Костанайской области 6 мая 2016 года № 6341
title:
  rus: О предоставлении в 2016 году мер социальной поддержки в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района
  kaz: Ауданның ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2016 жылы әлеуметтік қолдау шараларын көрсету туралы
