requisite: Решение маслихата Алтынсаринского района Костанайской области от 4 мая 2018 года № 173. Зарегистрировано Департаментом юстиции Костанайской области 24 мая 2018 года № 7786. Утратило силу решением маслихата Алтынсаринского района Костанайской области от 29 января 2020 года № 288 (вводится в действие для сельского округа с численностью населения более двух тысяч человек с 1 января 2018 года и для сел, сельских округов с численностью населения две тысячи и менее человек с 1 января 2020 года)
title:
  rus: Об утверждении Регламента собрания местного сообщества сельского округа имени Мариям Хәкімжановой Алтынсаринского района Костанайской области
  kaz: Костанай облысы Алтынсарин ауданы Мариям Хәкімжанова атындағы ауылдық округінің жергілікті қоғамдастық жиналысының регламентін бекіту туралы
