title:
  rus: Об организации и обеспечении проведения приписки граждан Республики Казахстан мужского пола к призывному участку государственного учреждения "Объединенный отдел по делам обороны Костанайского района"
  kaz: '"Қостанай ауданының қорғаныс iстерi жөнiндегi бiрiктiрiлген бөлiмi" мемлекеттік мекемесінің шақыру учаскесiне Қазақстан Республикасының еркек жынысты азаматтарының тiркеуiн өткізуді ұйымдастыру және қамтамасыз ету туралы'
