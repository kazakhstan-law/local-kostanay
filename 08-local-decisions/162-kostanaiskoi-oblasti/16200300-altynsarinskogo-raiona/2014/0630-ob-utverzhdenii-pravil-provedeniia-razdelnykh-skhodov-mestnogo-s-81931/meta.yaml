requisite: Решение маслихата Алтынсаринского района Костанайской области от 30 июня 2014 года № 223. Зарегистрировано Департаментом юстиции Костанайской области 8 августа 2014 года № 4983. Утратило силу решением маслихата Алтынсаринского района Костанайской области от 16 января 2020 года № 285 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Щербаковского сельского округа Алтынсаринского района Костанайской области
  kaz: Қостанай облысы Алтынсарин ауданының Щербаков ауылдық округінде бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиындарына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
