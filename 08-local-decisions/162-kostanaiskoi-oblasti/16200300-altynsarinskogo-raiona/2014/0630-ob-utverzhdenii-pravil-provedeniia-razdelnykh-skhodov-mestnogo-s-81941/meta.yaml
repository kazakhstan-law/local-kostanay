title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей для участия в сходе местного сообщества села Свердловка Алтынсаринского района Костанайской области
  kaz: Қостанай облысы Алтынсарин ауданы Свердловка ауылының жергілікті қоғамдастығының бөлек жиынын өткізудің қағидасын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
