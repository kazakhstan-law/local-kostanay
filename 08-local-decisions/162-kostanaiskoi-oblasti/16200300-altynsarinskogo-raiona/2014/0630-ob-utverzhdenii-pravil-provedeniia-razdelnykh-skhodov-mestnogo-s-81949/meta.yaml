title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Убаганского сельского округа Алтынсаринского района Костанайской области
  kaz: Қостанай облысы Алтынсарин ауданы Обаған ауылдық округінің жергілікті қоғамдастығының бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
