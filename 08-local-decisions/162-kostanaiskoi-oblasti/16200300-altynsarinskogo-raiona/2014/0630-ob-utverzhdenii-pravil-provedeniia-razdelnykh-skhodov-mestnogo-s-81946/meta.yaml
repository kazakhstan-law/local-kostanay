    kaz: Мәслихаттың «Қостанай облысы Алтынсарин ауданы Димитров ауылдық округінде бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиындарына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы» 2014 жылғы 30 маусымдағы № 214 шешіміне өзгерістер енгізу туралы
