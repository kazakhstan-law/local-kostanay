title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности за счет средств районного бюджета
  kaz: Аудандық бюджет қаражаты есебінен азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және ветеринария саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік ставкалар белгілеу туралы
