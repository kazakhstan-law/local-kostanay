  title:
    rus: О внесении изменения в решение маслихата от 19 июня 2014 года № 207 "Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры и ветеринарии являющимся гражданскими служащими и работающим в сельской местности за счет средств районного бюджета
    kaz: Мәслихаттың 2014 жылғы 19 шілдегі № 207 "Аудандық бюджет қаражаты есебінен азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және ветеринария саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік ставкалар берілеу туралы" шешіміне өзгеріс енгізу туралы
