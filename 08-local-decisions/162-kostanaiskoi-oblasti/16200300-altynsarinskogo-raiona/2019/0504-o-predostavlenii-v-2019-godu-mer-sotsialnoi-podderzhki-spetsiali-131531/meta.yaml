act_code: '131531'
requisite: Решение маслихата Алтынсаринского района Костанайской области от 4 мая 2019 года № 236. Зарегистрировано Департаментом юстиции Костанайской области 6 мая 2019 года № 8410
title:
  rus: О предоставлении в 2019 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Алтынсаринского района
  kaz: Алтынсарин ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылы әлеуметтік қолдау шараларын көрсету туралы
