act_code: '103432'
requisite: Решение маслихата Алтынсаринского района Костанайской области от 17 мая 2016 года № 28. Зарегистрировано Департаментом юстиции Костанайской области 17 июня 2016 года № 6471. Утратило силу решением маслихата Алтынсаринского района Костанайской области от 8 октября 2019 года № 262 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры, спорта и ветеринарии являющихся гражданскими служащими и работающих в сельской местности за счет средств районного бюджета
  kaz: Аудандық бюджет қаражаты есебінен азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерді белгілеу туралы
