    kaz: Мәслихаттың «Қостанай облысы Алтынсарин ауданы Новоалексеев ауылының бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» 2020 жылғы 16 қаңтардағы № 286 шешіміне өзгерістер енгізу туралы
