title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходах местного сообщества сельского округа имени Омара Шипина Алтынсаринского района Костанайской области
  kaz: Қостанай облысы Алтынсарин ауданы Омар Шипин атындағы ауылдық округтің жергілікті қоғамдастығының бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
