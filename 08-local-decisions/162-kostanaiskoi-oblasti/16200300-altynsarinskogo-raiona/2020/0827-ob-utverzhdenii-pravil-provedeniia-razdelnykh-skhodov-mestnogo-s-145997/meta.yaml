title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходах местного сообщества сельского округа имени Ильяса Омарова Алтынсаринского района Костанайской области
  kaz: Қостанай облысы Алтынсарин ауданы Ілияс Омаров атындағы ауылдық округтің жергілікті қоғамдастығының бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
