act_code: '72781'
requisite: Решение маслихата Алтынсаринского района Костанайской области от 25 апреля 2013 года № 96. Зарегистрировано Департаментом юстиции Костанайской области 28 мая 2013 года № 4141. Утратило силу решением маслихата Алтынсаринского района Костанайской области от 12 декабря 2013 года № 149
title:
  rus: О предоставлении в 2013 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты района
  kaz: Ауданның ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2013 жылға әлеуметтік қолдау шараларын ұсыну туралы
