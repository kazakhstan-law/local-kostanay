  kaz: '"Қостанай облысы Қостанай ауданының қорғаныс істері жөніндегі біріктірілген бөлімі" мемлекеттік мекемесінің шақыру учаскесіне Қазақстан Республикасының еркек жынысты азаматтарының тіркеуін өткізуді ұйымдастыру және қамтамасыз ету туралы'
