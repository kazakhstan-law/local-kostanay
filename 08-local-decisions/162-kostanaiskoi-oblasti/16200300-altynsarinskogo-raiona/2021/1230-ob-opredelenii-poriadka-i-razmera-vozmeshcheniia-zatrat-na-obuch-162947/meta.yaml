    kaz: Мәслихаттың 2021 жылғы 30 желтоқсандағы № 65 «Алтынсарин ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгеріс енгізу туралы
