act_code: '155558'
requisite: Решение маслихата Алтынсаринского района Костанайской области от 29 апреля 2021 года № 23. Зарегистрировано Департаментом юстиции Костанайской области 4 мая 2021 года № 9891
title:
  rus: О предоставлении в 2021 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сёл и сельских округов, прибывшим для работы и проживания в сельские населенные пункты Алтынсаринского района
  kaz: Алтынсарин ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар және ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2021 жылы әлеуметтік қолдау көрсету туралы
