title:
  rus: О предоставлении в 2012 году подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты
  kaz: Ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2012 жылы көтерме жәрдемақы және тұрғын үй алу немесе салу үшін бюджеттік кредит ұсыну туралы
