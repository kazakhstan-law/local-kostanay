  title:
    rus: О внесении изменений в решение маслихата от 29 марта 2021 года № 21 «Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, культуры и спорта, являющимся гражданскими служащими и работающим в сельской местности»
    kaz: Мәслихаттың 2021 жылғы 29 наурыздағы № 21 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, мәдениет және спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерді белгілеу туралы» шешіміне өзгерістер енгізу туралы
