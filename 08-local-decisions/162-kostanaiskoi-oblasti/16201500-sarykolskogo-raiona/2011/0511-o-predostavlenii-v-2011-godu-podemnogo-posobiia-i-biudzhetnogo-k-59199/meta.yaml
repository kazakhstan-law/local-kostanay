act_code: '59199'
requisite: Решение маслихата Сарыкольского района Костанайской области от 11 мая 2011 года № 248. Зарегистрировано Управлением юстиции Сарыкольского района Костанайской области 9 июня 2011 года № 9-17-120. Прекращено действие по истечении срока, на который решение было принято (письмо маслихата Сарыкольского района Костанайской области от 19 ноября 2012 года № 132)
title:
  rus: О предоставлении в 2011 году подъемного пособия и бюджетного кредита на приобретение жилья специалистам здравоохранения, образования, социального   обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты
  kaz: Ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына 2011 жылы көтерме жәрдемақы және тұрғын үй сатып алу үшін бюджеттік несие ұсыну туралы
