requisite: Решение маслихата Сарыкольского района Костанайской области от 22 декабря 2011 года № 310. Зарегистрировано Управлением юстиции Сарыкольского района Костанайской области 30 декабря 2011 года № 9-17-131. Утратило силу решением маслихата Сарыкольского района Костанайской области от 29 августа 2014 года № 205
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок гражданским служащим социального обеспечения, образования, культуры и спорта, работающим в сельской местности
  kaz: Ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласының азаматтық қызметшілеріне жиырма бес процентке жоғары лауазымдық жалақылар мен тарифтік ставкаларды белгілеу туралы
