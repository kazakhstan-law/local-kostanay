title:
  rus: О предоставлении в 2010 году подъемного пособия и бюджетного кредита на приобретение жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты
  kaz: Ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына 2010 жылы көтерме жәрдемақы және тұрғын үй сатып алу үшін бюджеттік несие ұсыну туралы
