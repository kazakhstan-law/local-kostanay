requisite: Решение маслихата Сарыкольского района Костанайской области от 21 июня 2018 года № 173. Зарегистрировано Департаментом юстиции Костанайской области 3 июля 2018 года № 7918
title:
  rus: О предоставлении в 2018 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные  пункты  Сарыкольского района
  kaz: Сарыкөл ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылы әлеуметтік қолдау шараларын көрсету туралы
