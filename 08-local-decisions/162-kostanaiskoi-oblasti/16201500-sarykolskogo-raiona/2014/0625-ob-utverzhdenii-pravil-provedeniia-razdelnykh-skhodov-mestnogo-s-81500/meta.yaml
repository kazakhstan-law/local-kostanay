    kaz: Мәслихаттың 2014 жылғы 25 маусымдағы № 182 «Қостанай облысы Сарыкөл ауданының Севастополь ауылдық округінде бөлек жергілікті қоғамдастық жиындарын өткізудің Қағидаларын және жергілікті қоғамдастық жиындарына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
