requisite: Решение маслихата Сарыкольского района Костанайской области от 8 августа 2014 года № 200. Зарегистрировано Департаментом юстиции Костанайской области 19 августа 2014 года № 5015. Утратило силу решением маслихата Сарыкольского района Костанайской области от 23 января 2020 года № 315 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
