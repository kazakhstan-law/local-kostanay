    kaz: Мәслихаттың 2014 жылғы 8 тамыздағы № 202 «Қостанай облысы Сарыкөл ауданы Сарыкөл кентінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін кент тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
