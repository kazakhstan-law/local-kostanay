title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей поселка для участия в сходах местного сообщества поселка Сарыколь Сарыкольского района Костанайской области
  kaz: Қостанай облысы Сарыкөл ауданы Сарыкөл кентінің жергілікті қоғамдастығының бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін кент тұрғындары өкілдерінің сандық құрамын бекіту туралы
