requisite: Решение маслихата Сарыкольского района Костанайской области от 25 июня 2014 года № 184. Зарегистрировано Департаментом юстиции Костанайской области 21 июля 2014 года № 4948. Утратило силу решением маслихата Сарыкольского района Костанайской области от 17 сентября 2019 года № 281 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходах местного сообщества Тимирязевского сельского округа Сарыкольского района Костанайской области
  kaz: Қостанай облысы Сарыкөл ауданының Тимирязев ауылдық округінде бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиындарына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
