requisite: Решение маслихата Сарыкольского района Костанайской области от 8 августа 2014 года № 199. Зарегистрировано Департаментом юстиции Костанайской области 19 августа 2014 года № 5014. Утратило силу решением маслихата Сарыкольского района Костанайской области от 17 апреля 2020 года № 331 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходах местного сообщества Краснознаменского сельского округа Сарыкольского района Костанайской области
  kaz: Қостанай облысы Сарыкөл ауданының Краснознамен ауылдық округінде бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиындарына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
