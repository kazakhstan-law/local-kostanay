  title:
    rus: О внесении изменений в решение маслихата от 25 июня 2014 года № 182 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Севастопольского сельского округа Сарыкольского района Костанайской области»
    kaz: Мәслихаттың 2014 жылғы 25 маусымдағы № 182 «Қостанай облысы Сарыкөл ауданы Севастополь ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
