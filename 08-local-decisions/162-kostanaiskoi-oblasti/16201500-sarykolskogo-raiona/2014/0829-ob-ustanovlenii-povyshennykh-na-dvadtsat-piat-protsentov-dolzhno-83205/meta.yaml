requisite: Решение маслихата Сарыкольского района Костанайской области от 29 августа 2014 года № 205. Зарегистрировано Департаментом юстиции Костанайской области 16 сентября 2014 года № 5081. Утратило силу решением маслихата Сарыкольского района Костанайской области от 1 марта 2016 года № 316
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт және ветеринария саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк ставкаларды белгiлеу туралы
