requisite: Решение маслихата Сарыкольского района Костанайской области от 25 июня 2014 года № 181. Зарегистрировано Департаментом юстиции Костанайской области 21 июля 2014 года № 4945. Утратило силу решением маслихата Сарыкольского района Костанайской области от 1 апреля 2020 года № 324 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходах местного сообщества Ленинградского сельского округа Сарыкольского района Костанайской области
  kaz: Қостанай облысы Сарыкөл ауданының Ленинград ауылдық округінде бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиындарына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
