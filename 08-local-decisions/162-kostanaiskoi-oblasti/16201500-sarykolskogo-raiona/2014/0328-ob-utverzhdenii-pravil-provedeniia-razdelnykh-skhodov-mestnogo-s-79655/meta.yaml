  title:
    rus: О внесении изменений в решение маслихата от 28 марта 2014 года № 153 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Сорочинского сельского округа Сарыкольского района Костанайской области»
    kaz: Мәслихаттың 2014 жылғы 28 наурыздағы № 153 «Қостанай облысы Сарыкөл ауданы Сорочин ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
