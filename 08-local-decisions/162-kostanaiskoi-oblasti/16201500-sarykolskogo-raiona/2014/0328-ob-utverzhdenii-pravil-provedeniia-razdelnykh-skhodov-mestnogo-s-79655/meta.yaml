requisite: Решение маслихата Сарыкольского района Костанайской области от 28 марта 2014 года № 153. Зарегистрировано Департаментом юстиции Костанайской области 6 мая 2014 года № 4676. Утратило силу решением маслихата Сарыкольского района Костанайской области от 25 сентября 2023 года № 59 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходах местного сообщества Сорочинского сельского округа Сарыкольского района Костанайской области
  kaz: Қостанай облысы Сарыкөл ауданы Сорочин ауылдық округінің жергілікті қоғамдастығының бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
