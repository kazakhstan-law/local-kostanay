    kaz: Мәслихаттың 2014 жылғы 28 наурыздағы № 153 «Қостанай облысы Сарыкөл ауданының Сорочин ауылдық округінде бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
