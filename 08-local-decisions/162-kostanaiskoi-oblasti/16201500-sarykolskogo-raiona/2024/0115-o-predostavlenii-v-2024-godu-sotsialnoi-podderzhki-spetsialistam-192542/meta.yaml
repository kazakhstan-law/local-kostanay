  title:
    rus: О внесении изменения в решение маслихата от 15 января 2024 года № 138 «О предоставлении в 2024 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселка, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Сарыкольского района»
    kaz: Мәслихаттың 2024 жылғы 15 қаңтардағы № 138 «2024 жылы Сарыкөл ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауыл, кент, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
