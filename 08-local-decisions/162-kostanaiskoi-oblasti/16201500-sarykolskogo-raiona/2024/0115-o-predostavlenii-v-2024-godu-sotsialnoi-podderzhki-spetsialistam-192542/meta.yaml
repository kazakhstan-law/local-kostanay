act_code: '192542'
requisite: Решение маслихата Сарыкольского района Костанайской области от 15 января 2024 года № 138
title:
  rus: О предоставлении в 2024 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселка, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Сарыкольского района
  kaz: 2024 жылы Сарыкөл ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауыл, кент, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау көрсету туралы
