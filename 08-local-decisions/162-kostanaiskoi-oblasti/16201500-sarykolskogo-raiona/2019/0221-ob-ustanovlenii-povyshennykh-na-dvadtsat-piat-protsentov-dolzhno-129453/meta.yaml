act_code: '129453'
requisite: Решение маслихата Сарыкольского района Костанайской области от 21 февраля 2019 года № 244. Зарегистрировано Департаментом юстиции Костанайской области 27 февраля 2019 года № 8274. Утратило силу решением маслихата Сарыкольского района Костанайской области от 29 марта 2021 года № 21 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и  тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, являющимся гражданскими служащими и работающим в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерді белгілеу туралы
