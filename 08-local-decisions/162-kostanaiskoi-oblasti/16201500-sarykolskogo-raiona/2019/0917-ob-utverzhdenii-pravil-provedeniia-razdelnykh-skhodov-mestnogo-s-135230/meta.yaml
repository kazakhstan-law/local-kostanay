title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села для участия в сходах местного сообщества села Тимирязевка Сарыкольского района Костанайской области
  kaz: Қостанай облысы Сарыкөл ауданы Тимирязев ауылының жергілікті қоғамдастығының бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
