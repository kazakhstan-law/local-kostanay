  title:
    rus: О внесении изменений в решение маслихата от 17 сентября 2019 года № 281 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села для участия в сходе местного сообщества села Тимирязевка Сарыкольского района Костанайской области»
    kaz: Мәслихаттың 2019 жылғы 17 қыркүйектегі № 281 «Қостанай облысы Сарыкөл ауданы Тимирязев ауылының бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
