requisite: Решение маслихата Сарыкольского района Костанайской области от 17 сентября 2019 года № 281. Зарегистрировано Департаментом юстиции Костанайской области 11 октября 2019 года № 8699. Утратило силу решением маслихата Сарыкольского района Костанайской области от 25 сентября 2023 года № 59 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
