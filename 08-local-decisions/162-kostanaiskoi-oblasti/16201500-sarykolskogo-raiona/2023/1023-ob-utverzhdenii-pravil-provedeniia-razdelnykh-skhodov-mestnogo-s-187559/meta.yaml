title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Сорочинского сельского округа Сарыкольского района Костанайской области
  kaz: Қостанай облысы Сарыкөл ауданы Сорочин ауылдық округінің жергілікті қоғамдастық бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
