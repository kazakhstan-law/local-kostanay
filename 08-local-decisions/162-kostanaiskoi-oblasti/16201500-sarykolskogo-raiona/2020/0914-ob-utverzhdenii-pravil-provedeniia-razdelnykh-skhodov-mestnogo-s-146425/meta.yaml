requisite: Решение маслихата Сарыкольского района Костанайской области от 14 сентября 2020 года № 360. Зарегистрировано Департаментом юстиции Костанайской области 18 сентября 2020 года № 9456. Утратило силу решением маслихата Сарыкольского района Костанайской области от 25 сентября 2023 года № 59 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
