    kaz: Мәслихаттың 2020 жылғы 23 қаңтардағы № 315 «Қостанай облысы Сарыкөл ауданы Большие Дубравы ауылының бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
