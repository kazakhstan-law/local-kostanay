title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села для участия в сходах местного сообщества села Большие Дубравы Сарыкольского района Костанайской области
  kaz: Қостанай облысы Сарыкөл ауданы Большие Дубравы ауылының жергілікті қоғамдастығының бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
