requisite: Решение маслихата Сарыкольского района Костанайской области от 13 января 2020 года № 312. Зарегистрировано Департаментом юстиции Костанайской области 17 января 2020 года № 8903. Утратило силу решением маслихата Сарыкольского района Костанайской области от 25 сентября 2023 года № 59 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
