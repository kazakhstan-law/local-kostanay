requisite: Решение маслихата Сарыкольского района Костанайской области от 9 апреля 2020 года № 328. Зарегистрировано Департаментом юстиции Костанайской области 17 апреля 2020 года № 9132
title:
  rus: О предоставлении в 2020 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Сарыкольского района
  kaz: Сарыкөл ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы әлеуметтік қолдау көрсету туралы
