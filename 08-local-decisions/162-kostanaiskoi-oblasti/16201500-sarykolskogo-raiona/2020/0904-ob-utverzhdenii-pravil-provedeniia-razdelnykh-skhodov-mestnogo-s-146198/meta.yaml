requisite: Решение маслихата Сарыкольского района Костанайской области от 4 сентября 2020 года № 358. Зарегистрировано Департаментом юстиции Костанайской области 10 сентября 2020 года № 9444. Утратило силу решением маслихата Сарыкольского района Костанайской области от 25 сентября 2023 года № 59 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села для участия в сходе местного сообщества села Златоуст Сарыкольского района Костанайской области
  kaz: Қостанай облысы Сарыкөл ауданы Златоуст ауылының жергілікті қоғамдастығының бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
