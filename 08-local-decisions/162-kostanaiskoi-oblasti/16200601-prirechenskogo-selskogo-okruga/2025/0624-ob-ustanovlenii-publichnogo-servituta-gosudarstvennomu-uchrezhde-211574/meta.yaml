title:
  rus: Об установлении публичного сервитута государственному учреждению «Отдел архитектуры, градостроительства и строительства акимата Денисовского района» на земельный участок в целях обслуживания и эксплуатации распределительной сети водоснабжения в селе Приреченка
  kaz: «Денисов ауданы әкімдігінің сәулет, қала құрылысы және құрылыс бөлімі» мемлекеттік мекемесіне Приреченка ауылында сумен жабдықтаудың тарату желісіне қызмет көрсету және пайдалану мақсатында жер учаскесіне қауымдық сервитут белгілеу туралы
