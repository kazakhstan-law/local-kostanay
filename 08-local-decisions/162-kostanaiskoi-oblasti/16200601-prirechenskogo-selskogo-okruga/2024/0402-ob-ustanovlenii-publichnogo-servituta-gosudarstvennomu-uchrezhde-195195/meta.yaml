act_code: '195195'
requisite: Решение акима Свердловского сельского округа Денисовского района Костанайской области от 2 апреля 2024 года № 5
title:
  rus: Об установлении публичного сервитута государственному учреждению «Отдел архитектуры, градостроительства и строительства акимата Денисовского района» для использования земельного участка в целях обслуживания и эксплуатации магистрального водовода к объекту «Строительство водоснабжения села Свердловка Денисовского района Костанайской области»
  kaz: '"Денисов ауданы әкімдігінің сәулет, қала құрылысы және құрылыс бөлімі" мемлекеттік мекемесіне "Қостанай облысы Денисов ауданы Свердловка ауылын сумен жабдықтау құрылысы" объектісіне магистральдық су құбырына қызмет көрсету және пайдалану мақсатында жер учаскесін пайдалану үшін қауымдық сервитут белгілеу туралы'
