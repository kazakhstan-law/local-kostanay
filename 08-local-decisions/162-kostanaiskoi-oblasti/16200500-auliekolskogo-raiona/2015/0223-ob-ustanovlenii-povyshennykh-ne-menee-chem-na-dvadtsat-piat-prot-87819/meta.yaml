requisite: Решение маслихата Аулиекольского района Костанайской области от 23 февраля 2015 года № 215. Зарегистрировано Департаментом юстиции Костанайской области 18 марта 2015 года № 5434. Утратило силу решением маслихата Аулиекольского района Костанайской области от 5 февраля 2016 года № 305
title:
  rus: Об установлении повышенных не менее чем на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға кемінде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік ставкаларды белгілеу туралы
