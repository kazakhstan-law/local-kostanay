act_code: '36513'
requisite: Решение маслихата Аулиекольского района Костанайской области от 19 декабря 2007 года № 15. Зарегистрировано Управлением юстиции Аулиекольского района Костанайской области 29 декабря 2007 года № 9-7-63
title:
  rus: О согласовании перечня должностей специалистов социального обеспечения, образования, культуры, работающих в аульной (сельской) местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки
  kaz: Кемінде жиырма бес процентке жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар, ауылдық (селолық) жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет мамандары лауазымдарының тізбесін келістіру туралы
