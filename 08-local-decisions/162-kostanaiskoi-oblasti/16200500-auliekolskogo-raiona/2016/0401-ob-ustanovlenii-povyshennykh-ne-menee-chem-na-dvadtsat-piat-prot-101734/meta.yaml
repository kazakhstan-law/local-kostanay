act_code: '101734'
requisite: Решение маслихата Аулиекольского района Костанайской области от 1 апреля 2016 года № 9. Зарегистрировано Департаментом юстиции Костанайской области 27 апреля 2016 года № 6303. Утратило силу решением маслихата Аулиекольского района Костанайской области от 2 апреля 2019 года № 288 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении повышенных не менее чем на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға кемінде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
