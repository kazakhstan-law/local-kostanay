requisite: Решение маслихата Аулиекольского района Костанайской области от 1 ноября 2023 года № 76
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходах местного сообщества Диевского сельского округа Аулиекольского района Костанайской области
  kaz: Қостанай облысы Әулиекөл ауданы Диев ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиындарына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
