title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходах местного сообщества Новоселовского сельского округа Аулиекольского района Костанайской области
  kaz: Қостанай облысы Әулиекөл ауданы Новоселов ауылдық округінің жергілікті қоғамдастықтың жиынына қатысу үшін бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
