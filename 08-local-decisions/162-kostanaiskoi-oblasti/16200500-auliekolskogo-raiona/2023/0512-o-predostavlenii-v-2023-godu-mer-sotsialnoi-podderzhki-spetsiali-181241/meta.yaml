act_code: '181241'
requisite: Решение маслихата Аулиекольского района Костанайской области от 12 мая 2023 года № 40
title:
  rus: О предоставлении в 2023 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселка, сельских округов, прибывшим для работы и проживания в сельские населенные пункты района
  kaz: Ауданның ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кент, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2023 жылы әлеуметтік қолдау көрсету туралы
