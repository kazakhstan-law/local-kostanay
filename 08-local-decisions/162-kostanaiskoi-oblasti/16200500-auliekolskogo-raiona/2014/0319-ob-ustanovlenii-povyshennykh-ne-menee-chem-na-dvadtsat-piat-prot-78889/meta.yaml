requisite: Решение маслихата Аулиекольского района Костанайской области от 19 марта 2014 года № 137. Зарегистрировано Департаментом юстиции Костанайской области 14 апреля 2014 года № 4596. Утратило силу решением маслихата Аулиекольского района Костанайской области от 23 февраля 2015 года № 215
title:
  rus: Об установлении повышенных не менее чем на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры и ветеринарии, являющимся гражданскими служащими и работающим в сельских населенных пунктах района
  kaz: Азаматтық қызметші болып табылатын және ауданның ауылдық елді мекендерінде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және ветеринария саласындағы мамандарға кемінде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік ставкаларды белгілеу туралы
