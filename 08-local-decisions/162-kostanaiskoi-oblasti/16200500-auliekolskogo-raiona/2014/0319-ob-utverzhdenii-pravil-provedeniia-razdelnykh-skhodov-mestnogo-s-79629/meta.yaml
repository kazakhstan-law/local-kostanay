  title:
    rus: О внесении изменений в решение маслихата от 19 марта 2014 года № 147 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходах местного сообщества Москалевского сельского округа Аулиекольского района Костанайской области»
    kaz: Мәслихаттың «Қостанай облысы Әулиекөл ауданы Москалев ауылдық округінің  жергілікті қоғамдастықтың жиынына қатысу үшін бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» 2014 жылғы 19 наурыздағы № 147 шешіміне өзгерістер енгізу туралы
