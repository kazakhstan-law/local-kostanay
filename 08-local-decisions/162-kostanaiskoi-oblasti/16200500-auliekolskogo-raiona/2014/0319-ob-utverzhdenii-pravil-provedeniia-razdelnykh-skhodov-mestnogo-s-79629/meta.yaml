title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей для участия в сходе местного сообщества Москалевского сельского округа Аулиекольского района Костанайской области
  kaz: Қостанай облысы Әулиекөл ауданы Москалев ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиындарына қатысу үшін тұрғындар өкілдерінің сандық құрамын бекіту туралы
