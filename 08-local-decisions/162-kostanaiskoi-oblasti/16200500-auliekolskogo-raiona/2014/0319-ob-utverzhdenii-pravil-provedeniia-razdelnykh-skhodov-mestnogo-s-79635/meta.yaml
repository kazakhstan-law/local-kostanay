requisite: Решение маслихата Аулиекольского района Костанайской области от 19 марта 2014 года № 148. Зарегистрировано Департаментом юстиции Костанайской области 29 апреля 2014 года № 4662. Утратило силу решением маслихата Аулиекольского района Костанайской области от 19 сентября 2023 года № 67 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей для участия в сходе местного сообщества Новонежинского сельского округа Аулиекольского района Костанайской области
  kaz: Қостанай облысы Әулиекөл ауданы Новонежин ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиындарына қатысу үшін тұрғындар өкілдерінің сандық құрамын бекіту туралы
