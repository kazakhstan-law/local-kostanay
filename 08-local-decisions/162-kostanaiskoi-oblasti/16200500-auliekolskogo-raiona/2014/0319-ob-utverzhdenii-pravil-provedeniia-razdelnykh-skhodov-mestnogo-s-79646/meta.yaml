requisite: Решение маслихата Аулиекольского района Костанайской области от 19 марта 2014 года № 152. Зарегистрировано Департаментом юстиции Костанайской области 29 апреля 2014 года № 4666. Утратило силу решением маслихата Аулиекольского района Костанайской области от 17 января 2020 года № 376 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества села имени К.Тургумбаева Аулиекольского района Костанайской области
  kaz: Қостанай облысы Әулиекөл ауданы Қ.Тұрғынбаев атындағы ауылының жергілікті қоғамдастықтың жиынына қатысу үшін бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
