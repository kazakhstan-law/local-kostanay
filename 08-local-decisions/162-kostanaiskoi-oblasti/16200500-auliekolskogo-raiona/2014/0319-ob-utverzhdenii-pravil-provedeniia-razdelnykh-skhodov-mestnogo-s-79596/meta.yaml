title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Диевского сельского округа Аулиекольского района Костанайской области
  kaz: Қостанай облысы Әулиекөл ауданы Диев ауылдық округінің жергілікті қоғамдастықтың жиынына қатысу үшін бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
