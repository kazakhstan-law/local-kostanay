  title:
    rus: О внесении изменений в решение маслихата от 26 января 2021 года № 8 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходах местного сообщества Диевского сельского округа Аулиекольского района Костанайской области»
    kaz: Мәслихаттың «Қостанай облысы Әулиекөл ауданы Диев ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиындарына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы» 2021 жылғы 26 қаңтардағы № 8 шешіміне өзгерістер енгізу туралы
