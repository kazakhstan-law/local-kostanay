requisite: Решение маслихата Аулиекольского района Костанайской области от 15 июня 2012 года № 26. Зарегистрировано Управлением юстиции Аулиекольского района Костанайской области 20 июня 2012 года № 9-7-163. Утратило силу в связи с истечением срока применения - (письмо маслихата Аулиекольского района Костанайской области от 7 марта 2013 года № 38)
