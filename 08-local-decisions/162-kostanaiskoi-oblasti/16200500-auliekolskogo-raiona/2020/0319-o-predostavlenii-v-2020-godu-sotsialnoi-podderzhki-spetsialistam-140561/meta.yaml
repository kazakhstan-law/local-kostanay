act_code: '140561'
requisite: Решение маслихата Аулиекольского района Костанайской области от 19 марта 2020 года № 390. Зарегистрировано Департаментом юстиции Костанайской области 26 марта 2020 года № 9045. Утратило силу решением маслихата Аулиекольского района Костанайской области от 13 октября 2020 года № 423 (вводится в действие по истечении десяти календарных  дней  после  дня  его  первого официального  опубликования)
title:
  rus: О предоставлении в 2020 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района
  kaz: Ауданның ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы әлеуметтік қолдау көрсету туралы
