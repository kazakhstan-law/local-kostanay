act_code: '147659'
requisite: Решение маслихата Аулиекольского района Костанайской области от 13 октября 2020 года № 423. Зарегистрировано Департаментом юстиции Костанайской области 22 октября 2020 года № 9502
title:
  rus: О предоставлении в 2020 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселка, сельских округов, прибывшим для работы и проживания в сельские населенные пункты района
  kaz: Ауданның ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кент, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2020 жылы әлеуметтік қолдау көрсету туралы
