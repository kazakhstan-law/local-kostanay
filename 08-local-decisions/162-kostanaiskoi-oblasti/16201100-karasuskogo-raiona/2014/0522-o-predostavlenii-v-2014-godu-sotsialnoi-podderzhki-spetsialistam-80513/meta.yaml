act_code: '80513'
requisite: Решение маслихата Карасуского района Костанайской области от 22 мая 2014 года № 218. Зарегистрировано Департаментом юстиции Костанайской области 5 июня 2014 года № 4811
title:
  rus: О предоставлении в 2014 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и  агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Карасуского района
  kaz: Қарасу ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын 2014 жылы ұсыну туралы
