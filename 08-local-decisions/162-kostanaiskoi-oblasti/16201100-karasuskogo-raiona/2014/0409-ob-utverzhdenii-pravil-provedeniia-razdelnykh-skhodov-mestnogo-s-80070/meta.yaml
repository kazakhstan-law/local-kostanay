requisite: Решение маслихата Карасуского района Костанайской области от 9 апреля 2014 года № 204. Зарегистрировано Департаментом юстиции Костанайской области 16 мая 2014 года № 4726. Утратило силу решением маслихата Карасуского района Костанайской области от 27 декабря 2019 года № 362 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходах местного сообщества Целинного сельского округа Карасуского района Костанайской области
  kaz: Қостанай облысы Қарасу ауданы Целинный ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиындарына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
