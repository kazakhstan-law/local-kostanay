requisite: Решение маслихата Карасуского района Костанайской области от 9 апреля 2014 года № 187. Зарегистрировано Департаментом юстиции Костанайской области 16 мая 2014 года № 4720.  Утратило силу решением маслихата Карасуского района Костанайской области от 15 сентября 2017 года № 143
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходах местного сообщества Белорусского сельского округа Карасуского района Костанайской области
  kaz: Қостанай облысы Қарасу ауданы Белорус ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиындарына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
