requisite: Решение маслихата Карасуского района Костанайской области от 9 апреля 2014 года № 202. Зарегистрировано Департаментом юстиции Костанайской области 16 мая 2014 года № 4717. Утратило силу решением маслихата Карасуского района Костанайской области от 29 апреля 2022 года № 120 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходах местного сообщества Черняевского сельского округа Карасуского района Костанайской области
  kaz: Қостанай облысы Қарасу ауданы Черняев ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиындарына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
