requisite: Решение маслихата Карасуского района Костанайской области от 21 декабря 2007 года № 23. Зарегистрировано Управлением юстиции Карасуского района Костанайской области 29 января 2008 года № 9-13-51. Утратило силу решением маслихата Карасуского района Костанайской области от 12 марта 2008 года № 47
title:
  rus: О согласовании перечня должностей гражданскнх служащих социального обеспечения, образования, культуры, работающих в аульной (сельской) местности, имеющих право на повышенные на двадцать пять процентов должностные оклады и тарифные ставки, за счет средств районного бюджета на 2008 год
  kaz: 2008 жылға арналған аудандық бюджеттің қаражаттары есебінен жиырма бес процентке жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар, ауылдық (селолық) жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет саласының азаматтық қызметшілер лауазымдарының тізбесін келістіру туралы
