act_code: '59421'
requisite: Решение маслихата Карасуского района Костанайской области от 14 июня 2011 года № 344. Зарегистрировано Управлением юстиции Карасуского района Костанайской области 27 июня 2011 года № 9-13-131. Утратило силу в связи с истечением срока применения (письмо маслихата Карасуского района Костанайской области от 23 июня 2014 года № 02-4-128)
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Карасуского района на 2011 год
  kaz: Қарасу ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына 2011 жылға әлеуметтік қолдау шараларын ұсыну туралы
