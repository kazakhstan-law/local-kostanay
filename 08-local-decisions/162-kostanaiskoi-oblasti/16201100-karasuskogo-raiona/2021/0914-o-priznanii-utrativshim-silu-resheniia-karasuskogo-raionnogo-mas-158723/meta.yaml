title:
  rus: О признании утратившим силу решения Карасуского районного маслихата от 21 декабря 2017 года № 182 «Об утверждении Правил управления бесхозяйными отходами, признанными решением суда поступившими в коммунальную собственность»
  kaz: Қарасу аудандық мәслихаттың 2017 жылғы 21 желтоқсандағы № 182 «Сот шешімімен коммуналдық меншікке түскен болып танылған иесіз қалдықтарды басқару қағидаларын бекіту туралы» шешімінің күшін жою деп тану туралы
