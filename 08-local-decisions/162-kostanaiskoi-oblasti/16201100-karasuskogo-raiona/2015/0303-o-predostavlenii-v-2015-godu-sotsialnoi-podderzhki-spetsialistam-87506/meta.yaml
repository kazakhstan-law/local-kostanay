requisite: Решение маслихата Карасуского района Костанайской области от 3 марта 2015 года № 263. Зарегистрировано Департаментом юстиции Костанайской области 17 марта 2015 года № 5426
title:
  rus: О предоставлении в 2015 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Карасуского района
  kaz: Қарасу ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын 2015 жылы ұсыну туралы
