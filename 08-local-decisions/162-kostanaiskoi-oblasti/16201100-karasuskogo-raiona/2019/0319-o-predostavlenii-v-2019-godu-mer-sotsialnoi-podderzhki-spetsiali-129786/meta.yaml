requisite: Решение маслихата Карасуского района Костанайской области от 19 марта 2019 года № 310. Зарегистрировано Департаментом юстиции Костанайской области 26 марта 2019 года № 8308
title:
  rus: О предоставлении в 2019 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Карасуского района
  kaz: Қарасу ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылы әлеуметтік қолдау шараларын көрсету туралы
