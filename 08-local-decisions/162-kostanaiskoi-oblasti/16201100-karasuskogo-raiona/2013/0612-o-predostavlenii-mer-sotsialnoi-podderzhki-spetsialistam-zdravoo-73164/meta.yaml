act_code: '73164'
requisite: Решение маслихата Карасуского района Костанайской области от 12 июня 2013 года № 121. Зарегистрировано Департаментом юстиции Костанайской области 25 июня 2013 года № 4156. Утратило силу в связи с истечением срока применения (письмо маслихата Карасуского района Костанайской области от 23 июня 2014 года № 02-4-128)
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии прибывшим для работы и проживания в сельские населенные пункты Карасуского района на 2013 год
  kaz: Қарасу ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын 2013 жылы ұсыну туралы
