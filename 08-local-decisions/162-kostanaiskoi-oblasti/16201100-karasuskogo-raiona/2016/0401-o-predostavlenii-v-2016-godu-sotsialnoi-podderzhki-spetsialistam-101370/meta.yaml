act_code: '101370'
requisite: Решение маслихата Карасуского района Костанайской области от 1 апреля 2016 года № 12. Зарегистрировано Департаментом юстиции Костанайской области 15 апреля 2016 года № 6286
title:
  rus: О предоставлении в 2016 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Карасуского района
  kaz: Қарасу ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2016 жылы әлеуметтік қолдауын көрсету туралы
