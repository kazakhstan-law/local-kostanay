act_code: '139716'
requisite: Решение маслихата Карасуского района Костанайской области от 17 февраля 2020 года № 381. Зарегистрировано Департаментом юстиции Костанайской области 21 февраля 2020 года № 8982. Утратило силу решением маслихата Карасуского района Костанайской области от 30 сентября 2020 года № 431 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении в 2020 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Карасуского района
  kaz: Қарасу ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы әлеуметтік қолдау көрсету туралы
