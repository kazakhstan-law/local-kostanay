requisite: Решение маслихата Карасуского района Костанайской области от 23 февраля 2017 года № 91. Зарегистрировано Департаментом юстиции Костанайской области 9 марта 2017 года № 6882
title:
  rus: О предоставлении в 2017 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим  для   работы и проживания в сельские населенные пункты Карасуского  района
  kaz: Қарасу ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік    кешен  саласындағы мамандарға  2017  жылы  әлеуметтік қолдау  көрсету  туралы
