act_code: '125521'
requisite: Решение маслихата Карасуского района Костанайской области от 11 октября 2018 года № 267. Зарегистрировано Департаментом юстиции Костанайской области 26 октября 2018 года № 8071. Утратило силу решением маслихата Карасуского района Костанайской области от 18 марта 2020 года № 391 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
