act_code: '118872'
requisite: Решение маслихата Карасуского района Костанайской области от 2 февраля 2018 года № 199. Зарегистрировано Департаментом юстиции Костанайской области 20 февраля 2018 года № 7521
title:
  rus: О предоставлении в 2018 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Карасуского района
  kaz: Қарасу ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылы әлеуметтік қолдау шараларын көрсету туралы
