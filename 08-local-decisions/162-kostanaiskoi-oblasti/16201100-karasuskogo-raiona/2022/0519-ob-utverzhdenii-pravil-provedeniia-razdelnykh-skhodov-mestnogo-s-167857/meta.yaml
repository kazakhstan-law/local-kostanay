requisite: Решение маслихата Карасуского района Костанайской области от 19 мая 2022 года № 125. Отменено решением маслихата Карасуского района Костанайской области от 21 августа 2023 года № 59 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села для участия в сходе местного сообщества села Жалгыскан Карасуского района Костанайской области
  kaz: Қостанай облысы Қарасу ауданы Жалғысқан ауылы жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
