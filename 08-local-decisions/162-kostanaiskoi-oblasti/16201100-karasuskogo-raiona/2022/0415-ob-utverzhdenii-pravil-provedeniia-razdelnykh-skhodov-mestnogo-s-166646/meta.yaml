requisite: Решение маслихата Карасуского района Костанайской области от 15 апреля 2022 года № 115. Отменено решением маслихата Карасуского района Костанайской области от 21 августа 2023 года № 59 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Октябрьского сельского округа Карасуского района Костанайской области
  kaz: Қостанай облысы Қарасу ауданы Октябрь ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
