title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел, улиц для участия в сходе местного сообщества  Ждановского сельского округа Костанайского района Костанайской области
  kaz: Қостанай облысы Қостанай ауданы Жданов ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар, көшелер тұрғындары өкілдерінің сандық құрамын бекіту туралы
