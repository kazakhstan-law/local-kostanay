act_code: '191070'
requisite: Решение маслихата Костанайского района Костанайской области от 22 декабря 2023 года № 116
title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества и количественного представителей жителей сел, микрорайонов, улиц для участия в сходе местного сообщества Майкольского сельского округа Костанайского района Костанайской области
  kaz: Қостанай облысы Қостанай ауданы Майкөл ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар, шағын аудандар, көшелер тұрғындары өкілдерінің сандық құрамын бекіту туралы
