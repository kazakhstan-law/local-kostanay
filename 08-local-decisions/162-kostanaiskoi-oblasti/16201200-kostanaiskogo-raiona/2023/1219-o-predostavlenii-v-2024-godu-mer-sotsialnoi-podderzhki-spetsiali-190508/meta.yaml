act_code: '190508'
requisite: Решение маслихата Костанайского района Костанайской области от 19 декабря 2023 года № 100
title:
  rus: О предоставлении в 2024 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Костанайского района
  kaz: Қостанай ауданының ауылдық елдi мекендерiне жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсiптiк кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2024 жылы әлеуметтiк қолдау шараларын көрсету туралы
