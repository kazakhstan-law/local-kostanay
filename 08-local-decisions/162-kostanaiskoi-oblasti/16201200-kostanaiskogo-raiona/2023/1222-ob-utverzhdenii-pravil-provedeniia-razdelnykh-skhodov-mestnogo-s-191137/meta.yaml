act_code: '191137'
requisite: Решение маслихата Костанайского района Костанайской области от 22 декабря 2023 года № 117
title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел, микрорайонов, улиц, многоквартирных жилых домов для участия в сходе местного сообщества Мичуринского сельского округа Костанайского района Костанайской области
  kaz: Қостанай облысы Қостанай ауданы Мичурин ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар, шағын аудандар, көшелер, көппәтерлі тұрғын үйлер тұрғындары өкілдерінің сандық құрамын бекіту туралы
