act_code: '191064'
requisite: Решение маслихата Костанайского района Костанайской области от 22 декабря 2023 года № 115
title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел, микрорайона, улиц, многоквартирных жилых домов для участия в сходе местного сообщества Заречного сельского округа Костанайского района Костанайской области
  kaz: Қостанай облысы Қостанай ауданы Заречный ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар, шағын аудан, көшелер, көппәтерлі тұрғын үйлер тұрғындары өкілдерінің сандық құрамын бекіту туралы
