requisite: Решение маслихата Костанайского района Костанайской области от 30 ноября 2017 года № 193. Зарегистрировано Департаментом юстиции Костанайской области 15 декабря 2017 года № 7395. Утратило силу решением маслихата Костанайского района Костанайской области от 27 января 2020 года № 473 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села для участия в сходе местного сообщества села Половниковка Костанайского района Костанайской области
  kaz: Қостанай облысы Қостанай ауданы Половниковка ауылының бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
