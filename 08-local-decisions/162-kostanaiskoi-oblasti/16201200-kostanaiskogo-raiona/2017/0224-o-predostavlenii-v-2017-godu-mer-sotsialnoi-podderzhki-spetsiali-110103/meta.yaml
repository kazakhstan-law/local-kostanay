requisite: Решение маслихата Костанайского района Костанайской области от 24 февраля 2017 года № 110. Зарегистрировано Департаментом юстиции Костанайской области 3 марта 2017 года № 6868
title:
  rus: О предоставлении в 2017 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Костанайского района
  kaz: Қостанай ауданының ауылдық елдi мекендерiне жұмыс iстеуге және тұруға келген  денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсiптiк кешен саласындағы мамандарға 2017 жылы әлеуметтiк қолдау шараларын көрсету туралы
