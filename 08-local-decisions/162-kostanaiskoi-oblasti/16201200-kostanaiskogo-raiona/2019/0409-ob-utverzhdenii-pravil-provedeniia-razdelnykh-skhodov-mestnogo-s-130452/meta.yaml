requisite: Решение маслихата Костанайского района Костанайской области от 9 апреля 2019 года № 381. Зарегистрировано Департаментом юстиции Костанайской области 11 апреля 2019 года № 8341. Утратило силу решением маслихата Костанайского района Костанайской области от 24 марта 2022 года № 145 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Озерного сельского округа Костанайского района Костанайской области
  kaz: Қостанай облысы Қостанай ауданы Озерный ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
