  title:
    rus: О внесении изменения в решение маслихата от 9 апреля 2019 года № 380 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Айсаринского сельского округа Костанайского района Костанайской области»
    kaz: Мәслихаттың 2019 жылғы 9 сәуірдегі № 380 «Қостанай облысы Қостанай ауданы Айсары ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгеріс енгізу туралы
