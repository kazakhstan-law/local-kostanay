act_code: '147115'
requisite: Решение маслихата Костанайского района Костанайской области от 2 октября 2020 года № 566. Зарегистрировано Департаментом юстиции Костанайской области 7 октября 2020 года № 9486
title:
  rus: О предоставлении в 2020 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Костанайского района
  kaz: Қостанай ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2020 жылы әлеуметтiк қолдау көрсету туралы
