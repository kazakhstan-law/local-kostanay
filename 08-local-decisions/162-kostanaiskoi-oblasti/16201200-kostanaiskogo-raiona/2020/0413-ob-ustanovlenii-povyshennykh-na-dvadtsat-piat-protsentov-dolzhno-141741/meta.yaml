  title:
    rus: О внесении изменений в решение маслихата от 13 апреля 2020 года № 512 «Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры и спорта, являющимся гражданскими служащими и работающим в сельской местности»
    kaz: Мәслихаттың 2020 жылғы 13 сәуірдегі № 512 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерді белгілеу туралы» шешіміне өзгерістер енгізу туралы
