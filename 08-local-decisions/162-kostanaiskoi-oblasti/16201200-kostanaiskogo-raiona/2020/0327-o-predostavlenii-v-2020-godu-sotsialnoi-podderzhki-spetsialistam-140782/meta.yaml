act_code: '140782'
requisite: Решение маслихата Костанайского района Костанайской области от 27 марта 2020 года № 508. Зарегистрировано Департаментом юстиции Костанайской области 31 марта 2020 года № 9065. Утратило силу решением маслихата Костанайского района Костанайской области от 2 октября 2020 года № 566 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении в 2020 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Костанайского района
  kaz: Қостанай ауданының ауылдық елдi мекендерiне жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсiптiк кешен саласындағы мамандарға 2020 жылы әлеуметтiк қолдау көрсету туралы
