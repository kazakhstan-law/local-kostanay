requisite: Решение маслихата Костанайского района Костанайской области от 29 мая 2020 года № 536. Зарегистрировано Департаментом юстиции Костанайской области 3 июня 2020 года № 9241. Утратило силу решением маслихата Костанайского района Костанайской области от 24 марта 2022 года № 145 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей улиц, многоквартирных жилых домов для участия в сходе местного сообщества города Тобыл Костанайского района Костанайской области
  kaz: Қостанай облысы Қостанай ауданы Тобыл қаласының бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және көшелер, көппәтерлі тұрғын үйлер тұрғындары өкілдерінің жергілікті қоғамдастық жиынына қатысу үшін сандық құрамын бекіту туралы
