act_code: '42364'
requisite: Решение маслихата Костанайского района Костанайской области от 10 ноября 2008 года № 119. Зарегистрировано Управлением юстиции Костанайского района Костанайской области 18 ноября 2008 года № 9-14-90
title:
  rus: Об установлении повышенных, не менее чем на двадцать пять процентов, должностных окладов и тарифных ставок гражданским служащим социального обеспечения, образования, культуры работающим в аульной (сельской) местности, за счет средств районного бюджета на 2008 год
  kaz: Ауылдық (селолық) мекенде жұмыс істейтін әлеуметтік қамтамасыз ету, білім, мәдениет азаматтық қызметкерлерінің жиырма бес пайыздан кем емес көтерілген лауазымдық еңбекақы мен тарифтік мөлшерін 2008 жылға арналған аудандық бюджет қаражаты есебінен белгілеу туралы
