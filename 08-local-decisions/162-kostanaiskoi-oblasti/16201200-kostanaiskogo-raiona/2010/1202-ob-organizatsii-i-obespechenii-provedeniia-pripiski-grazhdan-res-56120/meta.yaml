  kaz: '"Қостанай облысы Қостанай ауданының қорғаныс істері жөніндегі біріктірілген бөлімі" мемлекеттік мекемесінің шақыру учаскесіне Қазақстан Республикасының ер жынысты азаматтарының тіркеуін өткізу ұйымдастыру мен қамтамасыз ету туралы'
