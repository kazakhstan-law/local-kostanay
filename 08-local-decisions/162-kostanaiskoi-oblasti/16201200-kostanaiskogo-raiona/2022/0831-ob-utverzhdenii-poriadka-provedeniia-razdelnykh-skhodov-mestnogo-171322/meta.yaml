requisite: Решение маслихата Костанайского района Костанайской области от 31 августа 2022 года № 201. Отменено решением маслихата Костанайского района Костанайской области от 22 декабря 2023 года № 119 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей сел, улиц для участия в сходе местного сообщества Надеждинского сельского округа Костанайского района Костанайской области
  kaz: Қостанай облысы Қостанай ауданы Надеждин ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің және жергілікті қоғамдастық жиынына қатысу үшін ауылдар, көшелер тұрғындары өкілдерінің санын айқындаудың тәртібін бекіту туралы
