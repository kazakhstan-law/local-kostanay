requisite: Решение маслихата Костанайского района Костанайской области от 9 сентября 2022 года № 207. Отменено решением маслихата Костанайского района Костанайской области от 22 декабря 2023 года № 116 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей сел, микрорайонов, улиц для участия в сходе местного сообщества Майкольского сельского округа Костанайского района Костанайской области
  kaz: Қостанай облысы Қостанай ауданы Майкөл ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің және жергілікті қоғамдастық жиынына қатысу үшін ауылдар, шағын аудандар, көшелер тұрғындары өкілдерінің санын айқындаудың тәртібін бекіту туралы
