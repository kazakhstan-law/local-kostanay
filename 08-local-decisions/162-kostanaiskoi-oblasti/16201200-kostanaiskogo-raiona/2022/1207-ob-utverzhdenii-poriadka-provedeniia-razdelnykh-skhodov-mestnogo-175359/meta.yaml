requisite: Решение маслихата Костанайского района Костанайской области от 7 декабря 2022 года № 249. Отменено решением маслихата Костанайского района Костанайской области от 22 декабря 2023 года № 114 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей сел, улиц для участия в сходе местного сообщества Ждановского сельского округа Костанайского района Костанайской области
  kaz: Қостанай облысы Қостанай ауданы Жданов ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің және жергілікті қоғамдастық жиынына қатысу үшін ауылдар, көшелер тұрғындары өкілдерінің санын айқындаудың тәртібін бекіту туралы
