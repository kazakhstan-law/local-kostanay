act_code: '176238'
requisite: Решение маслихата Костанайского района Костанайской области от 21 декабря 2022 года № 259
title:
  rus: О предоставлении в 2023 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Костанайского района
  kaz: Қостанай ауданының ауылдық елдi мекендерiне жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсiптiк кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2023 жылы әлеуметтiк қолдау шараларын көрсету туралы
