requisite: Решение маслихата Костанайского района Костанайской области от 29 июля 2022 года № 192. Отменено решением маслихата Костанайского района Костанайской области от 22 декабря 2023 года № 110 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей сел для участия в сходе местного сообщества Александровского сельского округа Костанайского района Костанайской области
  kaz: Қостанай облысы Қостанай ауданы Александров ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің санын айқындаудың тәртібін бекіту туралы
