requisite: Решение маслихата Костанайского района Костанайской области от 31 августа 2022 года № 199. Отменено решением маслихата Костанайского района Костанайской области от 22 декабря 2023 года № 117 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей сел, микрорайонов, улиц, многоквартирных жилых домов для участия в сходе местного сообщества Мичуринского сельского округа Костанайского района Костанайской области
  kaz: Қостанай облысы Қостанай ауданы Мичурин ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің және жергілікті қоғамдастық жиынына қатысу үшін ауылдар, шағын аудандар, көшелер, көппәтерлі тұрғын үйлер тұрғындары өкілдерінің санын айқындаудың тәртібін бекіту туралы
