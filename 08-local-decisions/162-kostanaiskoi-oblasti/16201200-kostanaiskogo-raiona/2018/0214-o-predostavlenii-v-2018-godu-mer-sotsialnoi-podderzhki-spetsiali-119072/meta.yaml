act_code: '119072'
requisite: Решение маслихата Костанайского района Костанайской области от 14 февраля 2018 года № 221. Зарегистрировано Департаментом юстиции Костанайской области 26 февраля 2018 года № 7544
title:
  rus: О предоставлении в 2018 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Костанайского района
  kaz: Қостанай ауданының ауылдық елдi мекендерiне жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсiптiк кешен саласындағы мамандарға 2018 жылы әлеуметтiк қолдау шараларын көрсету туралы
