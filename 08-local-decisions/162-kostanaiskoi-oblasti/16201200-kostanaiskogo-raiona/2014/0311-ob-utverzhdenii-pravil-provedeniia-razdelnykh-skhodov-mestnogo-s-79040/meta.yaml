requisite: Решение маслихата Костанайского района Костанайской области от 11 марта 2014 года № 177. Зарегистрировано Департаментом юстиции Костанайской области 18 апреля 2014 года № 4612. Утратило силу решением маслихата Костанайского района Костанайской области от 9 апреля 2019 года № 380 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Глазуновского сельского округа Костанайского района Костанайской области
  kaz: Қостанай облысы Қостанай ауданы Глазунов ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
