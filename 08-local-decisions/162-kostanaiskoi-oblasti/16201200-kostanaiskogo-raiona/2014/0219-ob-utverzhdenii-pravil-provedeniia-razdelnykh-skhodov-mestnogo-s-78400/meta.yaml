    kaz: Мәслихаттың 2014 жылғы 19 ақпандағы № 163 «Қостанай облысы Қостанай ауданы Жамбыл ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидасын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгеріс енгізу туралы
