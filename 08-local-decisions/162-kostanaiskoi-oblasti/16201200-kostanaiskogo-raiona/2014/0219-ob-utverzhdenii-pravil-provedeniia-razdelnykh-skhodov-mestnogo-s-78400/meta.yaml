title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Жамбылского сельского округа Костанайского района Костанайской области
  kaz: Қостанай облысы Қостанай ауданы Жамбыл ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидасын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
