    kaz: Мәслихаттың 2014 жылғы 11 наурыздағы № 172 «Қостанай облысы Қостанай ауданы Александров ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгеріс енгізу туралы
