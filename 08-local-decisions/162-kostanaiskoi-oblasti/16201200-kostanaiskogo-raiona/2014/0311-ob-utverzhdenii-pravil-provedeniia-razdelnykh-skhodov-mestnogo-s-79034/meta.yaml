act_code: '79034'
requisite: Решение маслихата Костанайского района Костанайской области от 11 марта 2014 года № 185. Зарегистрировано Департаментом юстиции Костанайской области 18 апреля 2014 года № 4611. Утратило силу решением маслихата Костанайского района Костанайской области от 9 апреля 2019 года № 381 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села для участия в сходе местного сообщества села Озерное Костанайского района Костанайской области
  kaz: Қостанай облысы Қостанай ауданы Озерный ауылының бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
