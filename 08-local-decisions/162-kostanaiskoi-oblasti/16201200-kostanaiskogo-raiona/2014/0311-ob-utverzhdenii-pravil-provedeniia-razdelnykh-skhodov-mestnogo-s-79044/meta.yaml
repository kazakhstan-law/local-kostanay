    kaz: Мәслихаттың 2014 жылғы 11 наурыздағы № 180 «Қостанай облысы Қостанай ауданы Затобол кентінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін кент тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгеріс енгізу туралы
