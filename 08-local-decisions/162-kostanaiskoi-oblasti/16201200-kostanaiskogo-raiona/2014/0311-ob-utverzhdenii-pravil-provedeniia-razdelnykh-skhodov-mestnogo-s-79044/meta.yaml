title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей поселка для участия в сходе местного сообщества поселка Затобольск Костанайского района Костанайской области
  kaz: Қостанай облысы Қостанай ауданы Затобол кентінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін кент тұрғындары өкілдерінің сандық құрамын бекіту туралы
