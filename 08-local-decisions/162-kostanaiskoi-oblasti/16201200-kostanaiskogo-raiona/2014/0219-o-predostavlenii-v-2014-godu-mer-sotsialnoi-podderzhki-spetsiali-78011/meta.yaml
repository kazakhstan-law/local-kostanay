act_code: '78011'
requisite: Решение маслихата Костанайского района Костанайской области от 19 февраля 2014 года № 164. Зарегистрировано Департаментом юстиции Костанайской области 11 марта 2014 года № 4484. Утратило силу в связи с истечением срока действия (письмо Аппарата маслихата Костанайского района Костанайской области от 16 января 2015 года № 02-30-3)
title:
  rus: О предоставлении в 2014 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района
  kaz: Ауданның ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын 2014 жылы ұсыну туралы
