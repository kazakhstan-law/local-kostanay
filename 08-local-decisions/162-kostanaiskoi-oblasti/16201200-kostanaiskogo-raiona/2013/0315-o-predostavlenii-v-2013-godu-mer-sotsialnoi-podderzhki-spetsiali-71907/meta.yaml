act_code: '71907'
requisite: Решение маслихата Костанайского района Костанайской области от 15 марта 2013 года № 98. Зарегистрировано Департаментом юстиции Костанайской области 5 апреля 2013 года № 4084. Утратило силу в связи с истечением срока действия (письмо маслихата Костанайского района Костанайской области от 20 января 2014 года № 22)
title:
  rus: О предоставлении в 2013 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты района
  kaz: Ауданның ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын 2013 жылы ұсыну туралы
