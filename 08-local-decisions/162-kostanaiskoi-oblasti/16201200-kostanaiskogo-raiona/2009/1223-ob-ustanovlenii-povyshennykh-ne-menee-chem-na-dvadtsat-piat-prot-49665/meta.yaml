requisite: Решение маслихата Костанайского района Костанайской области от 23 декабря 2009 года № 256. Зарегистрировано Управлением юстиции Костанайского района Костанайской области 31 декабря 2009 года № 9-14-117
title:
  rus: Об установлении повышенных, не менее чем на двадцать пять процентов, должностных окладов и тарифных ставок гражданским служащим социального обеспечения, образования, культуры работающим в аульной (сельской) местности, за счет средств районного бюджета на 2010 год
  kaz: Ауылдық (селолық) мекенде жұмыс істейтін әлеуметтік қамтамасыз ету, білім, мәдениет азаматтық қызметкерлерінің жиырма бес пайыздан кем емес көтерілген лауазымдық жалақы мен тарифтік ставкалар мөлшерін 2010 жылға арналған аудандық бюджет қаражаты есебінен белгілеу туралы
