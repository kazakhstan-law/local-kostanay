title:
  rus: Об установлении повышенных, не менее чем на двадцать пять процентов, должностных окладов и тарифных ставок гражданским служащим социального обеспечения, образования, культуры работающим в аульной (сельской) местности, за счет средств районного бюджета на 2009 год
  kaz: Ауылдық (селолық) мекенде жұмыс істейтін әлеуметтік қамтамасыз ету, білім, мәдениет азаматтық қызметкерлерінің жиырма бес пайыздан кем емес көтерілген лауазымдық еңбекақы мен тарифтік мөлшерін 2009 жылға арналған аудандық бюджет қаражаты есебінен белгілеу туралы
