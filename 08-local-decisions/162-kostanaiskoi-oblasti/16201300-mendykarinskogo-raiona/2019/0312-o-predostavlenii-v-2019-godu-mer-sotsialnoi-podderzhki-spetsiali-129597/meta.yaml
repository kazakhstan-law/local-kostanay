act_code: '129597'
requisite: Решение маслихата Мендыкаринского района Костанайской области от 12 марта 2019 года № 270. Зарегистрировано Департаментом юстиции Костанайской области 14 марта 2019 года № 8298
title:
  rus: О предоставлении в 2019 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Мендыкаринского района
  kaz: Меңдіқара ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылы әлеуметтік қолдау шараларын қөрсету туралы
