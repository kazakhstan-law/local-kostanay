requisite: Решение маслихата Мендыкаринского района Костанайской области от 28 марта 2014 года № 235. Зарегистрировано Департаментом юстиции Костанайской области 24 апреля 2014 года № 4644. Утратило силу решением маслихата Мендыкаринского района Костанайской области от 28 апреля 2022 года № 113 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Ломоносовского сельского округа Мендыкаринского района Костанайской области
  kaz: Қостанай облысы Меңдіқара ауданы Ломоносов ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидасын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
