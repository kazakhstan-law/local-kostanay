requisite: Решение маслихата Мендыкаринского района Костанайской области от 22 апреля 2014 года № 253. Зарегистрировано Департаментом юстиции Костанайской области 15 мая 2014 года № 4711
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Мендыкаринского района на 2014 год
  kaz: Меңдіқара ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2014 жылға әлеуметтік қолдау шараларын ұсыну туралы
