  title:
    rus: О внесении изменений в решение маслихата от 28 марта 2014 года № 239 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Тенизовского сельского округа Мендыкаринского района Костанайской области»
    kaz: Мәслихаттың 2014 жылғы 28 наурыздағы № 239 «Қостанай облысы Меңдіқара ауданы Теңіз ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидасын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
