    kaz: Мәслихаттың 2014 жылғы 28 наурыздағы № 238 «Қостанай облысы Меңдіқара ауданы Соснов ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидасын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
