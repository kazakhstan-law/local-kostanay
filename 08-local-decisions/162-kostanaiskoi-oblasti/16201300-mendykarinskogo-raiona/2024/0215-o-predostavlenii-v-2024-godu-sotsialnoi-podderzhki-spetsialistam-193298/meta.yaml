  requisite: Решение маслихата Мендыкаринского района Костанайской области от 20 декабря 2024 года № 163
  title:
    rus: О внесении изменения в решение маслихата от 15 февраля 2024 года № 96 «О предоставлении в 2024 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Мендыкаринского района»
    kaz: Мәслихаттың 2024 жылғы 15 ақпандағы № 96 «Меңдіқара ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2024 жылы әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/204565/rus
