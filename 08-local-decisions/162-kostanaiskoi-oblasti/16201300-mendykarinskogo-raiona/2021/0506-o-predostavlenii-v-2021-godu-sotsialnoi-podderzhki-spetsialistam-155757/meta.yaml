act_code: '155757'
requisite: Решение маслихата Мендыкаринского района Костанайской области от 6 мая 2021 года № 25. Зарегистрировано Департаментом юстиции Костанайской области 12 мая 2021 года № 9906
title:
  rus: О предоставлении в 2021 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов села, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Мендыкаринского района
  kaz: Меңдіқара ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауыл, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2021 жылы әлеуметтік қолдау көрсету туралы
