  title:
    rus: О внесении изменений в решение маслихата от 13 октября 2023 года № 70 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Сосновского сельского округа Мендыкаринского района Костанайской области»
    kaz: Мәслихаттың 2023 жылғы 13 қазандағы № 70 «Қостанай облысы Меңдіқара ауданы Соснов ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
