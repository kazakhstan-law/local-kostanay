requisite: Решение маслихата Мендыкаринского района Костанайской области от 22 декабря 2010 года № 393. Зарегистрировано Управлением юстиции Мендыкаринского района Костанайской области 6 января 2011 года № 9-15-141
title:
  rus: О предоставлении в 2011 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты
  kaz: Ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына 2011 жылы әлеуметтік қолдау шараларын ұсыну туралы
