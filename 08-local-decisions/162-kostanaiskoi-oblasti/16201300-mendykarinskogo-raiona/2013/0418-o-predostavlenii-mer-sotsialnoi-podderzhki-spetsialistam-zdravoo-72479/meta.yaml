requisite: Решение маслихата Мендыкаринского района Костанайской области от 18 апреля 2013 года № 134. Зарегистрировано Департаментом юстиции Костанайской области 8 мая 2013 года № 4127. Утратило силу решением маслихата Мендыкаринского района Костанайской области от 25 октября 2013 года № 185
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты района на 2013 год
  kaz: Ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2013 жылға әлеуметтік қолдау шараларын ұсыну туралы
