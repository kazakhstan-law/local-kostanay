requisite: Решение маслихата Мендыкаринского района Костанайской области от 29 июля 2015 года № 319. Зарегистрировано Департаментом юстиции Костанайской области 18 августа 2015 года № 5807. Утратило силу решением маслихата Мендыкаринского района Костанайской области от 19 января 2016 года № 380
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік ставкаларды белгілеу туралы
