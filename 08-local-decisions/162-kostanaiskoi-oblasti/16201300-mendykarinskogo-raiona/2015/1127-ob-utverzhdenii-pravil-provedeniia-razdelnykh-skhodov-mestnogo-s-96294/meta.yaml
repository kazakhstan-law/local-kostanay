    kaz: Мәслихаттың 2015 жылғы 27 қарашадағы № 355 «Қостанай облысы Меңдіқара ауданы Введен ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидасын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
