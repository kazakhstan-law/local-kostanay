act_code: '140805'
requisite: Решение маслихата Мендыкаринского района Костанайской области от 30 марта 2020 года № 357. Зарегистрировано Департаментом юстиции Костанайской области 31 марта 2020 года № 9069. Утратило силу решением маслихата Мендыкаринского района Костанайской области от 9 июня 2023 года № 44 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта, являющимся гражданскими служащими и работающим в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерді белгілеу туралы
