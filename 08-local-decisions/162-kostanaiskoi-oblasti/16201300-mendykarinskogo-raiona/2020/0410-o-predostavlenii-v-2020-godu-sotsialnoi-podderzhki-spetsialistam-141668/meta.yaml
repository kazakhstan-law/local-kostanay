act_code: '141668'
requisite: Решение маслихата Мендыкаринского района Костанайской области от 10 апреля 2020 года № 361. Зарегистрировано Департаментом юстиции Костанайской области 15 апреля 2020 года № 9116. Утратило силу решением маслихата Мендыкаринского района Костанайской области от 10 декабря 2020 года № 421 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении в 2020 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Мендыкаринского района
  kaz: Меңдіқара ауданының ауылдық елдi мекендеріне жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы әлеуметтiк қолдау көрсету туралы
