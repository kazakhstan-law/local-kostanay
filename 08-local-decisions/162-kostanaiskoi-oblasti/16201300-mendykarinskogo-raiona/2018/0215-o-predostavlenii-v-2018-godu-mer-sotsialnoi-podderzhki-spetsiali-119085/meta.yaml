act_code: '119085'
requisite: Решение маслихата Мендыкаринского района Костанайской области от 15 февраля 2018 года № 178. Зарегистрировано Департаментом юстиции Костанайской области 28 февраля 2018 года № 7559
title:
  rus: О предоставлении в 2018 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Мендыкаринского района
  kaz: Меңдіқара ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылы әлеуметтік қолдау шараларын қөрсету туралы
